        <div class="ck-content"><h4>Celebrating 50 Years: David Weekley Homes Marks Half a Century of Building Dreams</h4><p>&nbsp;</p><p>2026 is a monumental milestone for David Weekley Homes — our 50th year as one of America's leading privately-held homebuilders. From a small Houston office opened by 23-year-old David Weekley in 1976, we've grown into a national builder operating across 19 markets in 13 states, delivering more than 130,000 homes to families nationwide.</p><p>&nbsp;</p><p>This half-century journey reflects our unwavering "people-first" commitment to customers, team members, and communities. We've pioneered innovations like LifeDesign℠ — our exclusive natural light home design technique that balances sight lines, room placement, and windows to enhance everyday living. Our accolades include the prestigious Triple Crown of Homebuilding: America's Best Builder, the National Housing Quality Award, and National Builder of the Year.</p><p>&nbsp;</p><p>Looking forward, we're excited about our Expedition Evergreen initiative launched in 2024, backed by a $1.25 billion capital infusion targeting 10,000 annual closings and doubling our volume over the next decade. We're expanding into new markets including Starkey Ranch in Florida, opening models across Texas, and growing our footprint in Arizona, Colorado, and Utah. Our strategy includes product diversification into attainably priced homes and 55+ communities for empty nesters, plus energy-efficient construction with third-party inspections.</p><p>&nbsp;</p><p>Through our CARE program, we've donated over $400 million to philanthropic causes, demonstrating that building homes goes hand-in-hand with building communities.</p><p>Thank you for making us part of your story. Whether you're a first-time buyer, empty nester, or move-up family, we remain focused on customer service, innovation, and creating spaces where families can thrive for generations.</p><p>&nbsp;</p><p><strong>Your next chapter starts here. Let's build your dream together.</strong></p><p>&nbsp;</p><p>&nbsp;</p></div>

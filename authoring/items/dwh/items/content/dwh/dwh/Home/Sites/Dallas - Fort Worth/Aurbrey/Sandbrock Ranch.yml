      Hint: Overview
      Value: |
        Beautiful David Weekley homes are now available in Sandbrock Ranch! Located just north of Dallas in Aubrey, this master-planned community offers a variety of award-winning floor plans on 50-foot homesites, all featuring the best in Design, Choice and Service from a builder with more than 40 years of experience. In Sandbrock Ranch, you’ll enjoy miles of tranquil trails, a sparkling community pool and much more:
        
        Carriage House amenity center, fitness center and splash pad
        Fully stocked fishing lakes
        Walk and bike paths, parks and playground
        Event lawn and outdoor amphitheater
        Convenient access to the Dallas North Tollway and Highway 380
        Students attend Denton ISD schools, including Union Park Elementary, Rodriguez Middle and Braswell High schools
        Nearby shopping, dining and entertainment

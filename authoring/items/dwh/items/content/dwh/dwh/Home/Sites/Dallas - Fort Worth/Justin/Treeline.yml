    - ID: "acacfe9c-91e6-45b9-9e3d-5b3a0aadbc11"
      Hint: Overview
      Value: |
        <div class="ck-content"><p>New construction homes from award-winning builder David Weekley Homes are now selling in Treeline! Located in Justin, Texas, this 800-acre community features scenic landscapes of mature oaks, parks and a flowing creek. Here, Homebuyers will discover a selection of one- and two-story single-family homes built on 50-foot homesites. In Treeline, you can experience top-quality craftsmanship from a trusted Dallas/Ft. Worth home builder and delight in amenities, such as:</p><ul><li>Amenity Center with a resort-style pool and pickleball courts<br />Community parks<br />Miles of hike and bike trails<br />Fishing and kayaking at the community lake<br />Nearby shopping, dining and entertainment<br />Easy access to the AllianceTexas corridor<br />Students attend acclaimed Northwest ISD schools, including a future on-site elementary school</li></ul></div>

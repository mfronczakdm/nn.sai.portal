      Value: "Quelles catégories de produits SYNC vend-elle?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: "SYNC vend des haut-parleurs (domestiques, portables, professionnels), des écouteurs (intra-auriculaires, circum-auriculaires, sans fil) et des amplificateurs (à lampes, à transistors, numériques, hybrides). Nous offrons également des accessoires, des solutions SYNC pour les entreprises et des services pour artistes. Magasinez par catégorie ou utilisez des filtres comme Bluetooth et haut-parleur intelligent pour trouver l'équipement qui vous convient."

      Hint: Biography
      Value: "<p>Shannon is a strategic advisor and litigator who defends companies, boards and executives when integrity, judgment and reputations are on the line. For more than 25 years, she has counseled technology and life sciences innovators at the heart of Silicon Valley's ecosystem. She helps clients navigate securities litigation, government investigations, internal crises and other high-stakes disputes. Shannon is Chambers-ranked in securities litigation in California.</p>"

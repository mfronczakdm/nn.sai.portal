      Hint: Detail
      Value: <h2>Who we are</h2><p>Cooley LLP is a global law firm known for representing companies that invent, scale, and lead. From our roots in Northern California, we have grown into offices across the United States, Europe, and Asia while keeping a culture that prizes collaboration and practical judgment.</p><p>We counsel emerging companies and the investors who back them, as well as mature public companies navigating transactions, regulation, intellectual property, and disputes.</p><h3>Explore</h3><ul><li>Geographies and offices</li><li>Firm timeline</li><li>Giving and pro bono</li><li>Alumni network</li></ul>

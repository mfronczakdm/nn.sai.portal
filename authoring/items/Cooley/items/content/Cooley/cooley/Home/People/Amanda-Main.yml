      Hint: Biography
      Value: "<p>Amanda is a strategic, solutions-oriented litigator who advocates for innovators and market leaders, from emerging startups to Fortune 50 companies, in their most consequential disputes. She is the head of the business litigation practice for Cooley's Palo Alto office and focuses on trade secret and competitor disputes, complex business and post-acquisition disputes, consumer and securities class actions, general commercial litigation, and internal and government investigations.</p>"

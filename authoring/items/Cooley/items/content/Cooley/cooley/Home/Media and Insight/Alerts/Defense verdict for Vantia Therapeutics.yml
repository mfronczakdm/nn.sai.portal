    - ID: "1c5dc4c1-21cd-405b-873b-5a82e1c0dd31"
      Hint: ArticleBody
      Value: |
        <div class="ck-content"><p dir="ltr">A Cooley trial team has won a complete defense verdict for DeVeau Therapeutics in the US District Court for the Northern District of California, defeating a patent claim that sought more than $400 million and an injunction that would have stopped a Phase 3 program.</p><p dir="ltr">&nbsp;</p><p dir="ltr">The jury returned its verdict on August 14 after a two-week trial. It found that DeVeau's lead antibody program did not infringe any of the three asserted patents, and separately found every asserted claim invalid as obvious. No damages were awarded.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>What decided the case</strong></p><p dir="ltr">The plaintiff's theory rested on a genus claim covering antibodies that bind a defined target and produce a therapeutic effect. DeVeau's program was developed independently, from a different structural starting point, and the trial record showed it.</p><p dir="ltr">&nbsp;</p><p dir="ltr">Two rulings before trial shaped what the jury heard. The court granted summary judgment against the plaintiff's willfulness allegations, removing enhanced damages from the case. It then excluded portions of the plaintiff's damages expert testimony, which narrowed the royalty base substantially. By the time the case reached the jury, the plaintiff was asking it to accept a damages figure the court had already pared back and an infringement theory that depended on claim scope the patentee could not support.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Why this matters beyond this case</strong></p><p dir="ltr">Validity is now where antibody patent cases are decided. Since <em>Amgen Inc. v. Sanofi</em>, 598 U.S. 594 (2023), broad functional genus claims have faced a harder enablement and written description test, and claims drafted before that decision are being litigated under it now.</p><p dir="ltr">&nbsp;</p><p dir="ltr">The practical consequence for anyone holding an antibody portfolio: the asset is the narrowest claim you can fully support with disclosed structure and working examples. Everything above it is optionality, and it should be valued that way in diligence, in partnering negotiations and on the balance sheet.</p><p dir="ltr">&nbsp;</p><p dir="ltr">If your portfolio includes genus claims granted before 2023, assume a serious challenger will test them. The time to find out how they hold up is before a threat letter arrives, not after.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Quotes</strong></p><p dir="ltr">"This verdict reflects a jury that understood the science," said [Partner name], who led the trial team. "DeVeau built this program independently, and the evidence made that clear."</p><p dir="ltr">&nbsp;</p><p dir="ltr">Charlie Kim added: "Antibody cases are won by putting complex biology in front of a jury accurately and in plain terms. That was the whole strategy."</p></div>

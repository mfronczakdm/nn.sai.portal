      Hint: Biography
      Value: "<p>Luke is head of business litigation for Boston and partner in charge of Cooley's Boston office. He is an experienced trial attorney, concentrating on securities enforcement matters, internal investigations, complex commercial litigation, shareholder disputes and class actions. He has been recognized by Chambers USA for securities litigation and white-collar crime and government investigations. Luke is a former assistant director in the Enforcement Division of the US Securities and Exchange Commission.</p>"

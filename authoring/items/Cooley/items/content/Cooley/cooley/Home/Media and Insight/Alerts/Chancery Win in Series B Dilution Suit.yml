      Hint: pageSummary
      Value: "On August 17, 2026, the Delaware Court of Chancery entered judgment for Cooley client Halcyon Robotics, Inc. and its directors, rejecting common stockholder claims that a $42 million Series B financing led by two existing preferred investors was a dilutive, self-dealing transaction. The court held that the special committee's process was sufficient to satisfy entire fairness."

    - ID: "1c5dc4c1-21cd-405b-873b-5a82e1c0dd31"
      Hint: ArticleBody
      Value: |
        <div class="ck-content"><p><strong>Background</strong></p><p>Halcyon Robotics, a venture-backed developer of warehouse automation systems, raised a $42 million Series B round in 2023 at a valuation below its prior Series A price. The round was led by two of the company's existing preferred stockholders, each of whom held a board seat, and included a pay-to-play provision converting non-participating preferred shares to common.</p><p>&nbsp;</p><p>A group of former employees and founder-affiliated common stockholders filed suit in the Delaware Court of Chancery, alleging that the director defendants breached their fiduciary duties by approving a financing that entrenched the insider investors and substantially diluted the common. Plaintiffs sought rescissory damages and asked the court to unwind the pay-to-play conversion.</p><p>&nbsp;</p><p><strong>The Court's Decision</strong></p><p>Because the transaction involved conflicted directors on both sides, the court applied entire fairness — the most exacting standard of review under Delaware law — rather than the deferential business judgment rule. Defendants did not dispute the standard. Instead, they argued that the process and price satisfied it.</p><p>&nbsp;</p><p>Following a four-day trial, the court agreed. In its post-trial memorandum opinion, the court emphasized several facts:</p><p>&nbsp;</p><ul><li>The board formed a special committee of two disinterested directors before term sheet negotiations began, and the committee was empowered to say no.</li><li>The committee retained independent financial and legal advisors and ran a documented outreach process to 14 outside investors over roughly 11 weeks, none of whom submitted a competing term sheet on better terms.</li><li>Contemporaneous board materials showed the company had fewer than five months of runway at the time the terms were approved.</li><li><p>The pay-to-play provision applied uniformly to all preferred holders, including the lead investors' own earlier-round shares.</p><p>&nbsp;</p></li></ul><p>On price, the court credited defendants' expert testimony that the pre-money valuation fell within a reasonable range given the company's burn rate, missed revenue milestones and the broader 2023 financing environment. The court noted that a lower valuation is not, standing alone, evidence of unfairness where the alternative is insolvency.</p></div>

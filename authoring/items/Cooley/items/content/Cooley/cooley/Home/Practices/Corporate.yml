      Value: "<h2>Corporate counsel for innovators</h2><p>Cooley’s corporate lawyers are known for emerging-company and venture work, as well as sophisticated M&amp;A, capital markets, and governance advice for public companies. We sit at the intersection of technology, life sciences, and private capital.</p><h3>What we do</h3><ul><li>Company formation, venture financings, and exits</li><li>Mergers and acquisitions and private equity</li><li>Capital markets, debt finance, and fund formation</li><li>Governance, securities regulation, tax, and employment</li><li>Cyber, privacy, ESG, and technology transactions</li></ul>"

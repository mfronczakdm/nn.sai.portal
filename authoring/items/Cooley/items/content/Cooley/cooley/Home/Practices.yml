    - ID: "93f130f9-b079-4d7d-b7af-ac85cd31bffd"
      Hint: Detail
      Value: "<h2>How we work with clients</h2><p>Cooley advises companies, investors, and boards across the full lifecycle of a business—from formation and first financing through public markets, complex transactions, and high-stakes disputes.</p><p>Our lawyers are organized around the issues that matter most to innovators: capital formation, intellectual property, regulation, and trial-ready advocacy. Teams collaborate across offices in the United States, Europe, and Asia so clients receive coordinated advice without losing local judgment.</p><h3>Practice groups</h3><ul><li>Corporate — emerging companies, venture capital, M&amp;A, capital markets, and transactions</li><li>Litigation — commercial, IP, securities, white collar, and appellate matters</li><li>Intellectual Property — patents, copyright, branding, and life sciences IP</li><li>CooleyREG — CFIUS, export controls, communications, aviation, and education regulation</li></ul><p>Explore a practice area to see how we counsel clients in that discipline.</p>"

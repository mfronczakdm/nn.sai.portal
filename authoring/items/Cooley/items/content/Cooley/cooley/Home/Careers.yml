      Hint: Detail
      Value: "<h2>Work at Cooley</h2><p>Cooley looks for people who are intellectually curious, client-focused, and comfortable working across practices and offices. Whether you are a law student, a practicing lawyer, or a business professional, you will work on matters that sit at the center of technology, life sciences, and growth markets.</p><h3>Paths</h3><ul><li>Law students — summer programs, interviews, and recruiting contacts</li><li>Lawyers — associate, counsel, and laterals</li><li>Business professionals and paralegals — the teams that make client service possible</li></ul><p>Current openings are posted on Cooley’s careers site. This page is a starting point for how we recruit and what it is like to work here.</p>"

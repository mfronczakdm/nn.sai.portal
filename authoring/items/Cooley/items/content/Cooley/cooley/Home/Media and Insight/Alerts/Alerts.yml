    - ID: "1c5dc4c1-21cd-405b-873b-5a82e1c0dd31"
      Hint: ArticleBody
      Value: |
        <div class="ck-content"><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">A Cooley trial team has won a complete defense verdict for client Vantia Therapeutics in a closely watched patent dispute in the US District Court for the Northern District of California.</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">&nbsp;</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">After a two-week trial, the jury returned a unanimous verdict on August 14 finding that Vantia's lead antibody program did not infringe any of the three asserted patents, and further found all asserted claims invalid as obvious. The plaintiff had sought damages exceeding $400 million, along with an injunction that would have halted Vantia's Phase 3 program.</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">&nbsp;</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">The verdict follows two years of litigation in which Cooley narrowed the case significantly before trial — obtaining summary judgment on the plaintiff's willfulness allegations and successfully excluding portions of the plaintiff's damages expert testimony under <em>Daubert</em>.</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">&nbsp;</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">"This result reflects a jury that understood the science," said [Partner Name], who led the trial team. "Our client's program was built independently, and the evidence at trial made that clear."</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">&nbsp;</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">[Partner Name] added: "Life sciences patent cases turn on getting complex biology in front of a jury in a way that is accurate and understandable. That was the focus of our entire trial strategy."</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">&nbsp;</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">The Cooley team was led by [Partner Name] and [Partner Name], with [Partner Name], [Associate Name] and [Associate Name].</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">&nbsp;</p><p class="font-claude-response-body break-words whitespace-normal" dir="ltr">For a deeper look at how courts have treated obviousness challenges in antibody patent litigation over the past three years, see our related analysis below.</p></div>

    - ID: "1c5dc4c1-21cd-405b-873b-5a82e1c0dd31"
      Hint: ArticleBody
      Value: |
        <p dir="ltr">Series B is the round where terms have moved most. Seed and Series A pricing has stayed relatively orderly, and late-stage rounds have always carried structure. The B is where the gap between a clean round and a structured one has widened, and where founders are most often surprised by it.</p><p dir="ltr">&nbsp;</p><p dir="ltr">Three shifts are showing up consistently.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Structure is back, and it is negotiable.</strong> Participating preferred, multiple liquidation preferences and pay-to-play provisions are appearing in Series B term sheets that would have priced cleanly in 2023 and 2024. Not every investor leads with them, and not every one of them holds. What matters is knowing which terms actually cost you money at exit and which ones are noise. A 1x non-participating preference and a 1.5x participating preference on the same headline valuation are very different deals, and the second one is worth arguing about in a way that a board observer seat is not.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Milestone expectations have moved up.</strong> Investors are underwriting the B against evidence that the A thesis worked, not against a plan for how it might. That usually means durable revenue rather than a good quarter, retention data with enough history to be believable, and a hiring plan the current burn can actually support. Companies raising against a narrative rather than a dataset are taking longer to close.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Diligence takes longer than founders budget for.</strong> Cap table cleanup, option pool history, IP assignment gaps and open-source questions surface at the B in a way they rarely do at the A. These are almost always fixable, and almost never fixable quickly once a term sheet is signed and a closing date is set.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Three things to fix before you open the round</strong></p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Clean the cap table first.</strong> Confirm every 83(b) election was filed, every founder and contractor has a signed IP assignment, and every safe or convertible note converts the way you think it does. Model the conversion. Founders are regularly surprised by the post-conversion number.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Model the pool increase before you negotiate valuation, not after.</strong> A pre-money pool expansion is dilution, and it is easier to argue about when it is a line in your model rather than a footnote in someone else&rsquo;s term sheet.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Decide what you actually need from the round.</strong> A B raised for eighteen months of runway and a B raised to reach profitability are different rounds with different terms, and investors will price the ambiguity if you have not resolved it.</p><p dir="ltr">&nbsp;</p><p dir="ltr"><strong>Who to talk to</strong></p><p dir="ltr">&nbsp;</p><p dir="ltr">Cooley&rsquo;s emerging companies and venture capital team advises founders through Series B financings across the US, Europe and Asia &mdash; and has done so for the same companies from incorporation through IPO. If you are raising in the next two quarters, the useful conversation happens before the term sheet, not after.</p><p dir="ltr">&nbsp;</p><p dir="ltr">Contact [Partner name], [Partner name] or [Partner name], or start with the free financing guidance and model documents on Cooley GO.</p>

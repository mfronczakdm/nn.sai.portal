    - ID: "93f130f9-b079-4d7d-b7af-ac85cd31bffd"
      Hint: Detail
      Value: "<h2>Industry-focused counsel</h2><p>Clients choose Cooley because our lawyers live in the same markets they serve. We advise founders, public companies, investors, and boards in sectors where regulation, intellectual property, and capital formation move quickly.</p><p>Industry teams work alongside corporate, litigation, IP, and regulatory specialists so advice is practical, coordinated, and grounded in how the business actually operates.</p><h3>Sectors we serve</h3><ul><li>Technology, artificial intelligence, and digital media</li><li>Life sciences and healthcare</li><li>Fintech, payments, and blockchain</li><li>Communications, telecommunications, and energy</li><li>Education and consumer products</li></ul>"

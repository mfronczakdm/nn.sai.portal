      Hint: PromoText2
      Value: |
        <div class="ck-content"><p>You've probably invested a lot of time improving your home. Now that its value has increased, you can borrow against it to address other expenses or projects. Our home equity line of credit is best if you need access to a revolving line of credit to meet your needs as they arise. &nbsp;Now with a Fixed Rate Loan Conversion Option: convert a portion or all of outstanding line balances into a fixed term loan.</p><p>With our Home Equity Line of Credit, you'll get the funds you need at a competitive rate that makes your money go further. Our easy-to-use home equity calculator1(Opens in a new Window) can help you determine what your home equity is. Rockland Trust has an easy application process for a home equity line of credit and we’re always happy to talk you through it.</p></div>

      Hint: description
      Value:  We know that signing up for free checking means more than just opening a free checking account. It’s about finding a neighborhood bank to support your personal financial goals. Rockland Trust supports these goals, and we have different checking options for your personal needs.  Maybe you don't want to worry about maintaining balances and free checking matters most to you. Or perhaps it's the access and convenience of more than 120 branch locations to over 200 ATMs. Or maybe you're looking for an online checking account the gives you access 24/7. Join the Rockland Trust community and open a checking account with us today.

    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Request medical or repair records using Progressive-approved authorizations and forms when the claim type requires them, including Florida PIP/no-fault medical documentation where applicable. Track outstanding requests as pending information and follow Florida DFS privacy expectations. Never store or share medical data outside Progressive privacy rules."

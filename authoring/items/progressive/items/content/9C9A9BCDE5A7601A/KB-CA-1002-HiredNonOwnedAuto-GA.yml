      Hint: __Revision
      Value: "fa8795ae-ec7e-45a4-841f-dca1d4fa44da"
    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Full vehicle photos plus impact close-ups</li><li>Rental agreement / contract header and vehicle description page</li><li>Any employer dispatch, calendar invite, or delivery ticket supporting business use</li><li>Dashcam / phone video of scene when available — retain per Progressive evidence rules</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Vehicle not scheduled and HNOA unclear:</strong> Progressive commercial coverage SME before coverage statements</li><li><strong>Potential primary vs excess dispute with personal auto carrier:</strong> coverage counsel / SME path</li><li><strong>Denial or reservation of rights likely:</strong> Progressive coverage letter protocol only</li><li><strong>Gig / delivery app mixed with commercial employment:</strong> verify which Progressive policy and which period apply</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: "Hired and Non-Owned Auto"
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\uDLr1K5wd1M8y82dfXcCgcafj64coB7N
    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: <ul><li>Explain to the insured which Progressive commercial coverages may apply and what remains with the personal auto or rental company</li><li>If coverage is pending, limit activity to documentation and safe storage</li><li>Do not promise Progressive will pay the employee’s personal deductible without authority</li></ul>
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Provide a consistent Progressive method to evaluate <strong>Hired Auto</strong> and <strong>Non-Owned Auto (HNOA)</strong> exposures after FNOL, before estimate authorization or liability negotiation.</p><ul><li>Distinguish scheduled owned units from rented, borrowed, or employee-owned vehicles used for business</li><li>Confirm whether Progressive commercial liability / HNOA endorsements apply</li><li>Coordinate with the employee’s personal auto carrier when non-owned use is alleged</li></ul>"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260803T141346Z

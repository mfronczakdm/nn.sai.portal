      Value: "{8C7B2964-CC9E-44C7-A0F7-7436FD280DF4}"
    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Run HNOA / hired-auto triage when:</p><ul><li>Loss involves a rental, temporary substitute, or borrowed vehicle used for the Progressive commercial insured’s business</li><li>Employee’s personal vehicle was used for business errands, client visits, or deliveries</li><li>FNOL vehicle is <strong>not</strong> on the Progressive commercial schedule</li><li>Insured asks whether Progressive “business auto” covers an employee’s personal car accident</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Employee hits third party in personal car on client visit:</strong> document business purpose; evaluate Progressive non-owned liability vs personal auto primary</li><li><strong>Corp rental truck for temporary capacity:</strong> verify hired auto liability and any hired PD endorsement</li><li><strong>Owner’s spouse using company rental for personal trip:</strong> likely coverage challenge — escalate</li><li><strong>Employee commuting only:</strong> typically personal auto; do not force Progressive commercial FNOL without business nexus</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260722T091500Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Liability reserves only after HNOA / hired auto applicability is reasonably indicated</li><li>Expense reserves for investigation may be set while coverage review continues</li><li>Do not set Progressive commercial PD indemnity on a non-owned personal vehicle until coverage is confirmed</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 3.80
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 28
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>Is the vehicle owned/scheduled on the Progressive commercial policy, hired/rented, or employee-owned?</li><li>What was the purpose of the trip (business vs personal)? Who authorized it?</li><li>Does the Progressive policy show hired auto and/or non-owned auto liability?</li><li>Is there physical damage coverage for hired autos, or liability-only HNOA?</li><li>Does the employee carry Progressive or other personal auto? Policy number?</li><li>Any rental agreement, corporate card, or employer authorization on file?</li><li>Any certificate / additional insured issues tied to the job or contract?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: "Hired and Non-Owned Auto — Coverage Triage"
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: "<ul><li>Liability payments after Progressive commercial coverage + liability decision</li><li>Hired auto PD (if endorsed) after rental damage documentation and deductible rules</li><li>Contribution / other-insurance coordination with personal auto carriers as required by Progressive guidelines</li></ul>"
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 8

    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: <ul><li>Photograph the involved vehicle and document ownership indicators (registration, rental agreement)</li><li>Do not authorize Progressive commercial physical damage repairs on an employee’s personal vehicle without confirmed coverage</li><li>Preserve rental contract damage report and fuel/mileage pages</li><li>Record employer statements on business purpose separately from employee statements</li></ul>

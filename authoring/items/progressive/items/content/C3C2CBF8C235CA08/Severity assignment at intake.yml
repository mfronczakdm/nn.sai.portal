    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "How do Progressive claims advisors assign claim severity at intake?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Severity assignment at intake
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Apply Progressive severity guidelines based on injuries, total loss indicators, litigation potential, commercial exposure, and catastrophic events. Assign the severity tier during intake so the claim routes to the correct queue. In Florida, weigh PIP/no-fault injury signals and hurricane or CAT surge carefully against FL DFS handling expectations. Escalate uncertain high-severity indicators to a supervisor or SME rather than under-classifying the file."

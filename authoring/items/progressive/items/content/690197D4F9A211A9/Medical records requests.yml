      Hint: Question
      Value: "How do Progressive Texas claims advisors request medical or repair records?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Medical records requests
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Request medical or repair records using Progressive-approved authorizations and forms when the claim type requires them. Track outstanding requests as pending information so TX DOI prompt-payment clocks are not delayed, including storm-related injury claims. Never store or share medical data outside Progressive privacy rules."

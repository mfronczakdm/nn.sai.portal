      Value: Customer status scripts
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Use Progressive-approved scripts that state current status, next step, and expected timing without promising outcomes. In North Carolina, align timing language with NC DOI guidance and note coastal claim complexity when relevant. Document the customer conversation in the Progressive claim file."

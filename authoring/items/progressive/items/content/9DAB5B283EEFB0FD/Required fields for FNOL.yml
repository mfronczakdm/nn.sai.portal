    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "Which fields are required when Progressive claims advisors complete FNOL?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Required fields for FNOL
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Required FNOL fields typically include policy number or searchable insured identifiers, loss date and approximate time, loss location, loss type, caller relationship to the insured, and a brief description of what happened. Add vehicle, driver, or property details when the loss type requires them. In Florida, also capture PIP/no-fault injury indicators and any hurricane or CAT-related loss context when applicable, keeping FL DFS reporting timelines in mind. Do not submit FNOL until required fields are complete or documented as unavailable with a reason."

      Value: What open claims means
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Open means the Progressive claim is active and still requires work such as investigation, estimate, payment, or customer follow-up. In Florida, also track PIP/no-fault milestones and any Florida DFS timing expectations on every touch. Keep customers informed using Progressive-approved status language."

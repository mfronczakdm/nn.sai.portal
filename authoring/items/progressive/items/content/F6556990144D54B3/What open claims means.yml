      Value: What open claims means
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Open means the Progressive claim is active and still requires work such as investigation, estimate, payment, or customer follow-up. In Texas, review next action and aging against TX DOI prompt-payment timelines, especially on storm-related claims. Keep customers informed using Progressive-approved status language."

      Hint: Question
      Value: "What Progressive litigation hold indicators should Florida claims advisors watch for?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Litigation hold indicators
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Watch for attorney letters, lawsuit notices, preservation requests, or explicit litigation language—including Florida PIP/no-fault disputes that may escalate. Immediately apply Progressive litigation-hold procedures and stop routine document destruction or informal email about the claim. Notify the designated Progressive litigation contact the same day, and note any Florida DFS complaint or regulatory correspondence."

      Hint: question
      Value: "How do Progressive claims agents assign claim severity at intake?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: "Apply Progressive severity guidelines based on injuries, total loss indicators, litigation potential, commercial exposure, and catastrophic events. Assign the severity tier during intake so the claim routes to the correct queue. Escalate uncertain high-severity indicators to a supervisor rather than under-classifying the file."

      Hint: question
      Value: "What are Progressive expectations when a claim is pending information?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: "Pending information means Progressive is waiting on documents or details from the customer, provider, or other party. Follow Progressive follow-up SLAs, document contact attempts, and clear the pending flag when information arrives. Escalate aged pending items per Progressive aging guidelines."

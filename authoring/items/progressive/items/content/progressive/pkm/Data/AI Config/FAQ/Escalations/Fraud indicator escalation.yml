      Hint: question
      Value: "What should Progressive agents do when fraud indicators appear?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: Stop routine settlement steps that could compromise investigation, document indicators factually, and escalate through Progressive fraud/SIU channels. Do not accuse customers directly. Follow Progressive fraud handling guidance for interviews and evidence.

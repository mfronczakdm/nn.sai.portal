      Hint: question
      Value: "What should Progressive claims agents do if FNOL information is incomplete?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: "Save the incomplete FNOL with a clear missing-information list and set the claim or intake status to pending information when allowed. Contact the reporter using Progressive follow-up SLAs and document each attempt. Do not advance coverage decisions until critical missing fields are obtained or formally waived by a supervisor."

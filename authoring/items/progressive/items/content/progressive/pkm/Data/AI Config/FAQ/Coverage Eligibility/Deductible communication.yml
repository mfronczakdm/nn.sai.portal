    - ID: "a3b4c5d6-e7f8-4a9b-0c1d-2e3f4a5b6c7d"
      Hint: question
      Value: "How should Progressive agents explain deductibles to customers?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: State the Progressive deductible amount from the policy for the applicable coverage, explain it is the customer's responsibility before Progressive payment, and avoid promising net payment amounts before estimate completion. Document that the deductible discussion occurred. For multiple deductibles, confirm which Progressive coverage applies.

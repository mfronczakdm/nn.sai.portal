      Hint: question
      Value: "When should Progressive claims agents escalate a claim?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: Escalate when severity, coverage complexity, customer complaint risk, or aging exceeds Progressive guidelines. Provide a short summary of facts, actions taken, and the decision needed. Use Progressive escalation contacts rather than informal side channels.

    - ID: "a3b4c5d6-e7f8-4a9b-0c1d-2e3f4a5b6c7d"
      Hint: question
      Value: "Which fields are required when Progressive associates complete FNOL?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: Required FNOL fields typically include policy number or searchable insured identifiers, loss date and approximate time, loss location, loss type, caller relationship to the insured, and a brief description of what happened. Add vehicle, driver, or property details when the loss type requires them. Do not submit FNOL until required fields are complete or documented as unavailable with a reason.

    - ID: "a3b4c5d6-e7f8-4a9b-0c1d-2e3f4a5b6c7d"
      Hint: question
      Value: "How do Progressive claims agents verify that a policy is active before discussing coverage?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: Search Progressive policy lookup with policy number or insured identifiers, confirm status is in force for the loss date, and verify named insured and product type match the report. Screenshot or note the verification result in the claim file. If status is cancelled, lapsed, or not found, stop coverage statements and escalate per Progressive guidelines.

      Hint: question
      Value: "What does an open Progressive claim status mean for agents?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: "Open means the Progressive claim is active and still requires work such as investigation, estimate, payment, or customer follow-up. Agents should review next action and aging indicators on every touch. Keep customers informed using Progressive-approved status language."

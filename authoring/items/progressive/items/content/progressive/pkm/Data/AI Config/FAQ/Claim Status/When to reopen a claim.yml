      Hint: question
      Value: "When can Progressive agents reopen a closed claim?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: Reopen when new material Progressive documentation, new damages related to the original loss, or approved reopen criteria are met. Document the reopen reason and notify the assigned Progressive owner. Do not reopen for unrelated new losses—those need a new FNOL.

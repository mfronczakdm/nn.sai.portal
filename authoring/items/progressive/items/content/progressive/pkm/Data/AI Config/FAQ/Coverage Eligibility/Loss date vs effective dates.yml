      Hint: answer
      Value: "Confirm the reported loss date falls within Progressive policy effective and expiration dates, including time-zone considerations when relevant. If the loss is outside the policy period, document findings and follow Progressive non-coverage or further-investigation procedures. Never assume continuous coverage without checking the period on the loss date."

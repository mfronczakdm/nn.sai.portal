      Value: "Yes—Progressive accepts third-party reported losses, but verify the reporter’s relationship, contact details, and known policy identifiers. Confirm the policy and named insured before coverage discussions. Limit liability statements and follow Progressive third-party intake scripts for privacy and accuracy."

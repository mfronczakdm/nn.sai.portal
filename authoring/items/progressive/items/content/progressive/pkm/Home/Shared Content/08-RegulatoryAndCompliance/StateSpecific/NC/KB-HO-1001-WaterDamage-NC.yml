      Value: "<p>In North Carolina water claims, distinguish sudden or accidental discharge from flood and long-term seepage before confirming Homeowners coverage. When flood indicators exist, direct the customer to the flood path and avoid HO commitments that conflict with Progressive exclusions and disclosure expectations.</p>"

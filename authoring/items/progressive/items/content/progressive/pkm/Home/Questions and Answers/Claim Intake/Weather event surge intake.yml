      Hint: Answer
      Value: "Follow Progressive catastrophe or weather-event playbooks for surge intake, including abbreviated FNOL scripts and prioritized severity routing. Capture essential loss facts first and schedule follow-up for secondary details when volume is high. Use the designated weather-event claim indicators so reporting and staffing remain accurate."

    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "What are Progressive expectations when a claim is pending information?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Pending information SLAs
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Pending information means Progressive is waiting on documents or details from the customer, provider, or other party. Follow Progressive follow-up SLAs, document contact attempts, and clear the pending flag when information arrives. Escalate aged pending items per Progressive aging guidelines to a supervisor or SME."

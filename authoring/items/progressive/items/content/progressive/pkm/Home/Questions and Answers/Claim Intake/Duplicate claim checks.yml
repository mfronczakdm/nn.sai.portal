    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: Search Progressive claims lookup by policy number, loss date, VIN, and claimant name before creating a new claim. If a matching open or recent claim exists, update that file instead of opening a duplicate. Document the duplicate check result in intake notes.

    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: Escalate when severity, coverage complexity, customer complaint risk, or aging exceeds Progressive guidelines. Provide a short summary of facts, actions taken, and the decision needed. Use Progressive escalation contacts and involve an SME rather than informal side channels.

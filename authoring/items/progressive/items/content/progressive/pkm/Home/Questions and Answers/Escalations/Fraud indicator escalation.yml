      Hint: Question
      Value: "What should Progressive claims advisors do when fraud indicators appear?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Fraud indicator escalation
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: Stop routine settlement steps that could compromise investigation, document indicators factually, and escalate through Progressive fraud/SIU channels. Do not accuse customers directly. Follow Progressive fraud handling guidance for interviews and evidence, and involve an SME when required.

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Start a Commercial Property fire workflow when:</p><ul><li>Named insured, property manager, or Progressive agent reports fire, explosion with fire, or smoke damage at a Progressive-insured commercial location</li><li>Fire department / alarm company notifies Progressive of a structure fire with an identifiable commercial policy</li><li>Tenant or landlord on a Progressive commercial policy reports fire originating in or spreading to the insured premises</li><li>Prior fire claim needs reopening for secondary smoke, odor, or contents discovery</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Kitchen hood / grease fire in restaurant:</strong> fire + smoke + possible ordinance/law; BI likely</li><li><strong>Electrical panel fire in warehouse:</strong> origin-and-cause; inventory smoke damage</li><li><strong>Tenant space fire spreading to adjoining suite:</strong> confirm who Progressive insures; subrogation watch</li><li><strong>Smoke-only from neighboring unit:</strong> document migration path; limited building scope</li><li><strong>Arson suspected:</strong> SIU; preserve scene; do not disturb evidence</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260727T130000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Building reserve by areas affected and construction type</li><li>BPP / stock reserve from early inventory estimates</li><li>Debris removal expectation early on total / near-total losses</li><li>BI / extra expense placeholder when operations are interrupted — refine after worksheets</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.50
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 61
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>Exact address / suite and occupancy type (retail, warehouse, office, restaurant)?</li><li>Is the fire extinguished? Any remaining hot spots or utility shutoffs?</li><li>Fire department report / incident number? Cause under investigation?</li><li>Anyone injured or hospitalized?</li><li>Building vs contents vs stock vs equipment damaged?</li><li>Is the business able to operate (partial / full interruption)?</li><li>Sprinkler discharge, smoke only, or open flame involvement?</li><li>Any hazardous materials, deep fryers, welding, or known ignition sources?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Commercial Property Fire — Intake to Mitigation
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: "<ul><li>Emergency board-up / mitigation after coverage confirmation and reasonableness review</li><li>Building repairs after agreed estimate and deductible</li><li>BPP after inventory and valuation (ACV/RCV per Progressive commercial forms)</li><li>BI / extra expense with documented loss of income and continuing expenses per policy</li></ul>"
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 7
    - ID: "76c3fa76-04cb-4142-9756-6fcb96442bf4"
      Hint: "KB-ID"
      Value: "KB-CP-1001"
    - ID: "8147ab19-7525-4ef0-a878-3e3f0a3157ac"
      Hint: LOB
      Value: "{E799A026-FF03-4588-8607-16222D811A4C}"
    - ID: "8cdc337e-a112-42fb-bbb4-4143751e123f"
      Hint: __Revision
      Value: "6e74f7b4-ace7-47dc-9d57-27bdceff9337"
    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Exterior elevations and roof if accessible/safe</li><li>Origin area overview (not disturbing evidence)</li><li>Smoke lines, soot on HVAC, inventory, and finishes</li><li>Utility shutoffs, boarded openings, and temporary power</li><li>Date-stamped vendor mitigation photos when available</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Active fire / structural collapse risk / hazmat:</strong> emergency services priority + commercial large-loss desk</li><li><strong>Fatalities or multiple injuries:</strong> severity / SIU / executive notice per Progressive guidelines</li><li><strong>Cause undetermined / arson indicators:</strong> SIU and origin-and-cause expert path</li><li><strong>High BI / extra expense / multi-location impact:</strong> commercial property large-loss</li><li><strong>Landlord / tenant / HOA / condo association disputes:</strong> confirm insurable interest before coverage commitments</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Commercial Property Fire
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\WIt5EKonMo343Fqq8begbLVKlCgYPAIX
    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: "<ul><li>Authorize board-up, temporary roofing, and water extraction from firefighting runoff when reasonably necessary</li><li>Coordinate smoke / soot remediation with approved Progressive commercial vendors</li><li>Advise insured on inventory preservation and cold-storage for perishable stock when applicable</li><li>Discuss temporary relocation / extra expense only after confirming Progressive commercial coverages</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Equip Progressive Claims Advisors to handle <strong>Commercial Property fire</strong> losses with accurate intake, life-safety prioritization, and clear building / BPP / BI framing.</p><ul><li>Secure the site and coordinate with fire authorities</li><li>Separate building, business personal property, and debris removal exposures</li><li>Identify early business interruption / extra expense needs</li></ul>"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260802T180113Z

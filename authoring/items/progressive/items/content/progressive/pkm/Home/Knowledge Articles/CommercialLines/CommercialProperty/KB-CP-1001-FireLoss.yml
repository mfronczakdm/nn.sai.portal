    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: "<ul><li>Do not enter unsafe structures until cleared by fire authorities / Progressive engineer guidance</li><li>Document origin area, burn patterns at a high level, and extent of smoke migration</li><li>Inventory major BPP categories and salvageable stock early</li><li>Note sprinkler heads activated and water damage secondary to firefighting</li><li>Separate pre-existing conditions from fire / smoke damage</li></ul>"

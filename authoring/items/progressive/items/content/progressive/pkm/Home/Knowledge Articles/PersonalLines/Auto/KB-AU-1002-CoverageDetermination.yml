    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: <ul><li>Explain deductible and rental implications accurately after coverage confirmation</li><li>If coverage is unresolved, set customer expectation and next contact time</li><li>Do not promise payment or waive deductible without authority</li></ul>
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Provide a consistent Progressive method to determine which <strong>Personal Auto</strong> coverages apply after FNOL, before estimate authorization or liability negotiation.</p><ul><li>Match loss facts to policy coverages and endorsements</li><li>Spot exclusions, named-driver issues, and use-type problems early</li><li>Document coverage position clearly for customers and claim file</li></ul>"

    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Photos that prove loss type (impact vs weather vs animal vs vandalism) support coverage</li><li>Capture evidence of use type when relevant (delivery bags, commercial markings)</li><li>Dashcam / telematics clips: note retention and attach per Progressive evidence handling</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Coverage gray area / conflicting endorsements:</strong> Progressive coverage SME or supervisor review</li><li><strong>Potential denial / reservation of rights:</strong> follow Progressive coverage letter protocol — do not improvise denial language</li><li><strong>Rideshare or delivery app in use:</strong> verify period-specific coverage and escalate if period unclear</li><li><strong>Out-of-state or multi-state policy issues:</strong> compliance / coverage counsel path as required</li><li><strong>Material misrepresentation suspected:</strong> SIU / underwriting referral</li></ul>"

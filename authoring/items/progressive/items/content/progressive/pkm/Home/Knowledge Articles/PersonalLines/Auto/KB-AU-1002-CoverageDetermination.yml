    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Run coverage determination when:</p><ul><li>FNOL is complete enough to identify policy, vehicle, drivers, and loss type</li><li>Customer asks “Am I covered?” before inspection</li><li>Loss involves glass, rental, rideshare, business use, excluded driver, or out-of-state operation</li><li>Prior coverage decision needs revisit after new facts (different driver, commercial use, intentional act allegation)</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Listed driver, collision applicable:</strong> confirm deductible, proceed to estimate</li><li><strong>Excluded driver operating vehicle:</strong> escalate; likely coverage challenge — supervisor path</li><li><strong>Uber/Lyft period 1 vs 2:</strong> verify app status and Progressive rideshare endorsement</li><li><strong>Glass claim on comprehensive:</strong> confirm comprehensive and glass deductible/waiver</li><li><strong>Policy lapse day-of-loss:</strong> verify exact cancel time and state grace rules before decision</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260723T140000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Do not set indemnity payment reserve until coverage is confirmed for that coverage part</li><li>Expense reserves (inspection, appraisal) may be set while coverage review is in progress per Progressive guidelines</li><li>If denial is likely, follow non-payment reserve / closure procedures</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.00
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 41
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>Is the vehicle on the Progressive declarations for the loss date?</li><li>Was the operator a rated/listed driver, household member, or permissive user?</li><li>Is the loss type collision, comprehensive, liability (BI/PD), UMPD/UIM, MedPay/PIP, rental, or roadside?</li><li>Any endorsement that changes coverage (rideshare, custom parts, loan/lease gap, new car replacement)?</li><li>Any exclusion: business use, racing, intentional damage, named excluded driver?</li><li>Policy status on loss date (active, pending cancel, lapse, rewrite)?</li><li>State-specific rules (PIP/no-fault, financial responsibility, comparative negligence)?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Personal Auto Coverage Determination
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: <ul><li>Collision / comprehensive payments after coverage + estimate agreement</li><li>Liability payments after coverage + liability decision + settlement authority</li><li>MedPay/PIP subject to state forms and medical bill review</li><li>Rental only when rental coverage applies and dates align to loss of use</li></ul>

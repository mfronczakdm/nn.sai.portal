    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: "<ul><li>Coverage position should be documented before authorizing teardown or major repair</li><li>If coverage is pending, limit activity to secure storage and photo documentation</li><li>For liability-only claims, confirm Progressive liability exposure before third-party estimate commitments</li><li>Record which coverage section supports the decision (collision deductible, comprehensive, etc.)</li></ul>"

    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "How do Progressive claims advisors verify that a policy is active before discussing coverage?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: How to verify active policy
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: Search Progressive policy lookup with policy number or insured identifiers, confirm status is in force for the loss date, and verify named insured and product type match the report. Screenshot or note the verification result in the claim file. If status is cancelled, lapsed, or not found, stop coverage statements and escalate per Progressive guidelines to a supervisor or coverage SME.

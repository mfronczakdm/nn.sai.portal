      Hint: Intake Triggers
      Value: "<p>Use when:</p><ul><li>Hit-and-run leaves Progressive insured injured or with vehicle damage</li><li>At-fault driver has no insurance or inadequate limits</li><li>Insured asks about UM/UIM after a third-party liability denial for no coverage</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Parking-lot hit-and-run PD only:</strong> UMPD or collision path</li><li><strong>Interstate sideswipe, other driver flees:</strong> police + UM evaluation</li><li><strong>At-fault minimal limits, serious injury:</strong> UIM after tortfeasor exhaustion rules</li><li><strong>Uninsured driver identified later:</strong> update liability/UM strategy</li></ul>"

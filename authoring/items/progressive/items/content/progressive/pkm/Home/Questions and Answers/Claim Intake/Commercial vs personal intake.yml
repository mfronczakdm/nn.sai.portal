      Hint: Question
      Value: "What is different about Progressive commercial lines claim intake versus personal lines?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Commercial vs personal intake
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: Commercial intake often requires business name, FEIN or account identifiers, vehicle/unit numbers, and confirmation of applicable commercial coverages. Personal lines typically centers on named insured, drivers, and personal auto or property details. Use the correct Progressive product path and severity rules for the line of business.

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Use when:</p><ul><li>Tree or large limb falls onto roof, garage, fence, or vehicle on Progressive HO risk</li><li>Wind removes shingles/siding and a tree is also involved</li><li>Neighbor’s tree falls onto Progressive insured’s property</li><li>Insured asks only for tree removal with no building damage</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Healthy oak blown onto roof:</strong> remove from structure + roof repair; limited debris</li><li><strong>Dead tree falls in calm weather:</strong> may be maintenance — escalate coverage</li><li><strong>Tree on fence only:</strong> other structures; debris rules</li><li><strong>Neighbor tree onto Progressive house:</strong> handle Progressive first-party; note subrogation</li><li><strong>Tree in yard, no structure hit:</strong> typically limited/no coverage for removal alone</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260729T120000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: <ul><li>Dwelling/other structures repair band from impact severity</li><li>Emergency tree/tarp costs when structure struck</li><li>ALE if home uninhabitable</li></ul>

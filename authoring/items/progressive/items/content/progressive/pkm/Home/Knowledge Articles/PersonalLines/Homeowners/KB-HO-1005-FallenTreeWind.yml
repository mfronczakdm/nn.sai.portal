      Hint: General Mitigation
      Value: "<ul><li>Authorize emergency tree removal from structure and tarp/board-up when Progressive coverage indicated</li><li>Do not approve full yard cleanup beyond Progressive debris allowances without authority</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Equip Progressive Claims Advisors to handle <strong>fallen tree and wind</strong> homeowners claims, including when trees strike the dwelling versus debris-only scenarios.</p><ul><li>Confirm wind/storm as the proximate cause</li><li>Separate covered dwelling/other structures damage from non-covered tree removal alone</li><li>Protect openings quickly to prevent interior water</li></ul>"

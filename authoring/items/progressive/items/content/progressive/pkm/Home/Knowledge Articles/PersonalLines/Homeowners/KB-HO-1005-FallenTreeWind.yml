      Hint: Core Triage Questions
      Value: "<ol><li>Did the tree strike a covered structure or only land in the yard?</li><li>Storm/wind date vs discovery date?</li><li>Any interior leaks from roof openings?</li><li>Tree on Progressive property vs neighbor’s tree?</li><li>Any vehicle damaged under Progressive auto vs HO?</li><li>Is the tree still on the roof creating an unsafe condition?</li></ol>"

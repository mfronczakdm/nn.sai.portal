      Value: "What does an open Progressive claim status mean for claims advisors?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: What open claims means
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Open means the Progressive claim is active and still requires work such as investigation, estimate, payment, or customer follow-up. Claims advisors should review next action and aging indicators on every touch. Keep customers informed using Progressive-approved status language."

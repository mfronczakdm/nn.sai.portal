    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Start a Homeowners water damage workflow when:</p><ul><li>Insured reports burst pipe, supply line failure, appliance overflow, roof leak after storm, ice dam, or sump/backup (endorsement dependent)</li><li>Water is active or recently stopped and materials are wet</li><li>Prior water claim needs reopening due to secondary damage (mold risk, cabinets, flooring)</li></ul><p>Route <strong>flood</strong> (rising surface water / overflow of inland/tidal waters) separately — Progressive HO typically excludes flood; advise NFIP/flood carrier path when applicable.</p>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Washing machine supply line burst:</strong> sudden/accidental discharge path; mitigation + flooring/cabinets</li><li><strong>Slow drain leak for months:</strong> possible long-term seepage exclusion — escalate coverage</li><li><strong>Roof leak during rain with no wind opening:</strong> verify covered cause of loss; may need exterior inspection</li><li><strong>Sump backup:</strong> check water backup endorsement before committing</li><li><strong>Toilet overflow with contamination:</strong> treat as higher category water; document health/safety</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260728T080000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: <ul><li>Initial dwelling reserve based on rooms affected and finish quality</li><li>Include mitigation/drying invoice expectation early</li><li>Contents reserve when personal property is clearly wet</li><li>ALE reserve when displacement is likely</li><li>Revisit reserves after moisture map and estimate</li></ul>
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.50
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 64
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>What is the water source (supply line, drain, roof, appliance, groundwater, weather)?</li><li>Is water still running? Has the main shutoff been used?</li><li>When did the loss begin and when was it discovered?</li><li>Which rooms/levels are affected? Any electrical hazards?</li><li>Category of water (clean / gray / black) and visible contamination?</li><li>Any mold odor, prior leaks, or long-term staining?</li><li>Is the property occupied? Temporary housing needed?</li><li>Sump pump / sewer backup endorsement on Progressive policy?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Homeowners Water Damage — Intake to Mitigation
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: <ul><li>Mitigation invoices after coverage confirmation and reasonable/necessary review</li><li>Dwelling repairs after estimate agreement and deductible application</li><li>Contents after inventory and valuation (ACV/RCV per Progressive policy)</li><li>ALE with documentation of additional living expenses</li></ul>
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 8
    - ID: "76c3fa76-04cb-4142-9756-6fcb96442bf4"
      Hint: "KB-ID"
      Value: "KB-HO-1001"

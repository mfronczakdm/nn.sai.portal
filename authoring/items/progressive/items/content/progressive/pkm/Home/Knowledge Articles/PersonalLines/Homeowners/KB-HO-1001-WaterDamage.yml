    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Iniciar un flujo de trabajo de daños por agua en hogares cuando:</p><ul><li>El asegurado informa sobre una tubería rota, falla de línea de suministro, desbordamiento de electrodoméstico, fuga en el techo después de una tormenta, dique de hielo o respaldo/sumidero (dependiendo de la endoso)</li><li>El agua está activa o se detuvo recientemente y los materiales están húmedos</li><li>Un reclamo previo de agua necesita ser reabierto debido a daños secundarios (riesgo de moho, gabinetes, pisos)</li></ul><p>Dirigir <strong>inundaciones</strong> (agua superficial ascendente / desbordamiento de aguas interiores/mareas) por separado — Progressive HO típicamente excluye inundaciones; aconsejar la ruta de NFIP/portador de inundaciones cuando sea aplicable.</p>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Rotura de línea de suministro de lavadora:</strong> ruta de descarga repentina/accidental; mitigación + pisos/gabinetes</li><li><strong>Fuga lenta de drenaje durante meses:</strong> posible exclusión por filtración a largo plazo — escalar cobertura</li><li><strong>Fuga en el techo durante la lluvia sin apertura por viento:</strong> verificar causa cubierta de la pérdida; puede necesitar inspección exterior</li><li><strong>Respaldo de sumidero:</strong> verificar endoso de respaldo de agua antes de comprometerse</li><li><strong>Desbordamiento de inodoro con contaminación:</strong> tratar como agua de categoría superior; documentar salud/seguridad</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260728T080000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: <ul><li>Reserva inicial de vivienda basada en las habitaciones afectadas y la calidad del acabado</li><li>Incluir la expectativa de factura de mitigación/secado desde el principio</li><li>Reserva de contenidos cuando los bienes personales estén claramente húmedos</li><li>Reserva de ALE cuando el desplazamiento sea probable</li><li>Revisar reservas después del mapa de humedad y estimación</li></ul>

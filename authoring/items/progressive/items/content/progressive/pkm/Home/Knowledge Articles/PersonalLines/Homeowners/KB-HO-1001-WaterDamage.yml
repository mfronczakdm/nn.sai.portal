    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: <ul><li>Documentar la fuente de agua y el punto de falla (foto del accesorio roto, penetración del techo, electrodoméstico)</li><li>Mapear la humedad en las habitaciones; anotar el tipo de piso, gabinetes, altura de la línea de agua en el drywall</li><li>Separar el daño por descarga repentina de las manchas/deformaciones preexistentes</li><li>Confirmar si ya se inició la mitigación y por quién</li><li>Para agua relacionada con el techo después de viento/granizo, también capturar la condición exterior del techo</li></ul>

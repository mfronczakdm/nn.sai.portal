    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: "<ul><li>Document source of water and point of failure (photo of broken fitting, roof penetration, appliance)</li><li>Moisture map rooms; note flooring type, cabinetry, drywall height of water line</li><li>Separate sudden discharge damage from pre-existing stains/warping</li><li>Confirm whether mitigation already started and by whom</li><li>For roof-related water after wind/hail, also capture exterior roof condition</li></ul>"

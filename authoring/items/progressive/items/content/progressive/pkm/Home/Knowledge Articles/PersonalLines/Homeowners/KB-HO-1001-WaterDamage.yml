    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: <ul><li>Detener la fuente; extraer agua estancada; colocar equipos de secado según las prácticas de proveedores progresivos alineados con IICRC</li><li>Autorizar servicios de emergencia para proteger la propiedad cuando la cobertura esté razonablemente indicada</li><li>Aconsejar la remoción de contenidos húmedos que bloqueen el secado; inventariar bienes personales dañados</li><li>Explicar opciones de ALE / pérdida de uso si el hogar no es seguro para ocupar</li><li>No autorizar demolición más allá de lo necesario para secar sin dirección del ajustador en pérdidas grandes</li></ul>
    - ID: "c8f93afe-bfd4-4e8f-9c61-152559854661"

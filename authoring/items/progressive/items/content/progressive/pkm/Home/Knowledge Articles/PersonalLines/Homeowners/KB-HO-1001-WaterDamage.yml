    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: <ul><li>Fuente de la fuga y válvula de cierre</li><li>Tomas amplias de cada habitación afectada + línea de humedad en las paredes</li><li>Primeros planos de materiales saturados, agua estancada y daños en contenidos</li><li>Lecturas de medidores / fotos de medidores de humedad cuando los proveedores las proporcionen</li><li>Antes/después de la mitigación cuando esté disponible</li></ul>
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Inundación activa / compromiso estructural / peligro eléctrico:</strong> mitigación de emergencia + prioridad de campo</li><li><strong>Posible inundación vs agua HO:</strong> SME de cobertura antes de comprometer el lenguaje de cobertura</li><li><strong>Moho más allá de la ventana de mitigación de Progressive / filtración a largo plazo:</strong> supervisor / revisión de cobertura</li><li><strong>Pérdida grande / múltiples oficios / exposición alta de ALE:</strong> escritorio de pérdidas grandes</li><li><strong>Disputas entre inquilino / propietario / HOA:</strong> confirmar interés asegurable y responsabilidades de las partes</li></ul>"

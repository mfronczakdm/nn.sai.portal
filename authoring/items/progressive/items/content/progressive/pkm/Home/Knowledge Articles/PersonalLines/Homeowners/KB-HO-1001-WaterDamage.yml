    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>¿Cuál es la fuente del agua (línea de suministro, drenaje, techo, electrodoméstico, agua subterránea, clima)?</li><li>¿El agua sigue corriendo? ¿Se ha utilizado la válvula principal de cierre?</li><li>¿Cuándo comenzó la pérdida y cuándo se descubrió?</li><li>¿Qué habitaciones/niveles están afectados? ¿Hay peligros eléctricos?</li><li>¿Categoría del agua (limpia / gris / negra) y contaminación visible?</li><li>¿Algún olor a moho, fugas previas o manchas a largo plazo?</li><li>¿La propiedad está ocupada? ¿Se necesita vivienda temporal?</li><li>¿Endoso de respaldo de bomba de sumidero / alcantarillado en la póliza de Progressive?</li></ol>"

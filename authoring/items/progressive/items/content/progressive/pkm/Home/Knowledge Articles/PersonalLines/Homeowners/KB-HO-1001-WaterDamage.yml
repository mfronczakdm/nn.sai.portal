      Hint: LOB
      Value: "{331E5703-41A4-4592-B744-14A83C4CFAAE}"
    - ID: "8cdc337e-a112-42fb-bbb4-4143751e123f"
      Hint: __Revision
      Value: "2d4521af-65c3-40b0-8c57-ebda64006502"
    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Source of leak and shutoff valve</li><li>Wide shots of each affected room + moisture line on walls</li><li>Close-ups of saturated materials, standing water, and contents damage</li><li>Meter readings / moisture meter photos when vendors provide them</li><li>Before/after mitigation when available</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Active flooding / structural compromise / electrical hazard:</strong> emergency mitigation + field priority</li><li><strong>Potential flood vs HO water:</strong> coverage SME before committing coverage language</li><li><strong>Mold beyond Progressive mitigation window / long-term seepage:</strong> supervisor / coverage review</li><li><strong>Large loss / multiple trades / ALE exposure high:</strong> large-loss desk</li><li><strong>Tenant / landlord / HOA disputes:</strong> confirm insurable interest and party responsibilities</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Homeowners Water Damage
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\david.stremic@sitecore.com
    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: "<ul><li>Stop the source; extract standing water; set drying equipment per IICRC-aligned Progressive vendor practices</li><li>Authorize emergency services to protect property when coverage is reasonably indicated</li><li>Advise removal of wet contents that block drying; inventory damaged personal property</li><li>Explain ALE / loss of use options if home is not safe to occupy</li><li>Do not authorize demolition beyond what is required to dry without adjuster direction on large losses</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Equip Progressive Claims Advisors to handle <strong>Personal Home water damage</strong> claims with accurate intake, rapid mitigation, and clear coverage framing.</p><ul><li>Distinguish sudden/accidental discharge vs flood, seepage, and long-term leakage</li><li>Protect the dwelling with timely mitigation</li><li>Document category/class of water and affected rooms early</li></ul>"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20260805T105046Z

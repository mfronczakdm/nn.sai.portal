    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: |
        <div class="ck-content"><p>Equipar a los Asesores de Reclamos de Progressive para manejar reclamos de <strong>daños por agua en hogares personales</strong> con una toma precisa, mitigación rápida y un encuadre claro de la cobertura.</p><ul><li>Distinguir descarga repentina/accidental vs inundación, filtración y fugas a largo plazo</li><li>Asegurar una evaluación adecuada de los daños estructurales</li><li>Facilitar una comunicación fluida entre las partes interesadas para resoluciones rápidas</li></ul></div>

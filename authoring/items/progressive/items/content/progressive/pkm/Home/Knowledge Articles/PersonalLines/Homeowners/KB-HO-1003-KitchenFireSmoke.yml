      Hint: Standard Site Inspection Rules
      Value: <ul><li>Document point of origin (range, oven, microwave niche) without disturbing evidence if cause is disputed</li><li>Map smoke/soot migration room by room and into HVAC returns</li><li>Inventory damaged soft goods, pantry stock, and appliances</li><li>Check for water damage from extinguishment</li><li>Separate grease film / cooking residue from sudden fire soot when evaluating maintenance vs loss</li></ul>

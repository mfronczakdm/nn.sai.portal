    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: "<ul><li>Authorize emergency board-up / temporary utilities only if needed for safety</li><li>Start soot/smoke cleaning and pack-out through Progressive-approved vendors when coverage is indicated</li><li>Advise discarding porous food products exposed to heavy smoke per health guidance</li><li>Explain ALE / loss of use if cooking facilities or air quality make the home unusable</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Guide Progressive Claims Advisors through <strong>Personal Home kitchen fire and smoke</strong> claims from FNOL through mitigation and contents handling.</p><ul><li>Prioritize life safety and utility shutoffs</li><li>Document flame vs smoke-only damage accurately</li><li>Address ALE when the kitchen or dwelling is not safely occupiable</li></ul>"

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Use this kitchen fire / smoke workflow when:</p><ul><li>Insured reports a cooking fire, grease fire, oven/stovetop fire, or toaster/appliance fire</li><li>Smoke or soot migrated beyond the kitchen to HVAC, bedrooms, or contents</li><li>Fire department responded to a residential cooking incident at a Progressive HO risk</li><li>Prior kitchen fire claim needs reopening for odor, soft goods, or hidden soot discovery</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Unattended frying pan grease fire:</strong> localized cabinets + range; possible hood/duct cleaning</li><li><strong>Oven fire with heavy smoke throughout house:</strong> pack-out soft goods; HVAC cleaning</li><li><strong>Microwave fire contained to appliance:</strong> limited scope; confirm no hidden cavity burn</li><li><strong>Condo unit cooking fire affecting hallway:</strong> coordinate association; document Progressive unit boundaries</li><li><strong>Candle left near curtains near kitchen:</strong> verify cause; not always “cooking” — still fire peril</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260726T093000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Kitchen rebuild band (cabinets, appliances, finishes) plus smoke migration rooms</li><li>Contents / soft goods reserve when pack-out is likely</li><li>ALE reserve when displacement or loss of kitchen use is expected</li><li>Revisit after moisture/soot assessment and estimate</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.50
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 45
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>Is the fire fully extinguished? Any smoldering or electrical hazards remaining?</li><li>Fire department on scene / report number?</li><li>Anyone injured from smoke inhalation or burns?</li><li>What ignited (grease, packaging, wiring, candle nearby)?</li><li>Extent: cabinets only, open flame to structure, or smoke throughout?</li><li>Is the home safe to occupy overnight?</li><li>Any renters / HO-6 / condo association involvement?</li><li>Recent renovations or unpermitted kitchen work?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Homeowners Kitchen Fire and Smoke Damage
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: <ul><li>Mitigation / cleaning invoices after coverage and reasonableness review</li><li>Dwelling repairs after agreed scope and Progressive HO deductible</li><li>Contents after inventory (ACV/RCV per Progressive policy)</li><li>ALE with documentation of additional living expenses</li></ul>
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 5

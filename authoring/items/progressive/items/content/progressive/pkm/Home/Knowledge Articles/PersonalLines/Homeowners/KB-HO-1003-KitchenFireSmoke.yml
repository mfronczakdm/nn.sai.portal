    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Stovetop/oven origin close-ups and wider kitchen elevations</li><li>Cabinet interiors, range hood, and ceiling above cooking area</li><li>Smoke lines in hallways and HVAC vents</li><li>Contents requiring pack-out (clothing, upholstery)</li><li>Fire department overhaul / water residue when present</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Structural involvement / attic migration / multi-unit spread:</strong> field priority + large-loss as needed</li><li><strong>Injuries or fatalities:</strong> Progressive severity path</li><li><strong>Arson / intentional act indicators:</strong> SIU</li><li><strong>Condo / HOA master policy interaction:</strong> confirm Progressive unit-owner vs association responsibilities</li><li><strong>High ALE / full pack-out:</strong> large-loss desk</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Homeowners Kitchen Fire and Smoke

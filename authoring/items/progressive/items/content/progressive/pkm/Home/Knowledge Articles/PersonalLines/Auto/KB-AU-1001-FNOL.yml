      Hint: __Updated by
      Value: |
        sitecore\uDLr1K5wd1M8y82dfXcCgcafj64coB7N
    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: <ul><li>Advise safe vehicle storage and authorize tow to preferred Progressive network shop when appropriate</li><li>Explain rental / transportation options based on coverage (rental reimbursement, rideshare reimbursement where applicable)</li><li>Remind customer to retain repair estimates and police report copies</li><li>Do not authorize teardown beyond Progressive estimate protocol without adjuster approval</li></ul>
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: <p>Guide Progressive Claims Advisors through accurate, complete <strong>Personal Auto FNOL</strong> so the claim is set up correctly the first time.</p><ul><li>Capture loss facts that drive coverage and liability decisions</li><li>Identify severity and special handling early</li><li>Route to the right Progressive workflow (desk, field, catastrophe, SIU)</li></ul>

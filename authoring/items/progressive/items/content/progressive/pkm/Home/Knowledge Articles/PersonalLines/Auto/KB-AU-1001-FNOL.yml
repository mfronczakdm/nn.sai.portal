    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Four corners + all four sides of the Progressive vehicle</li><li>Close-ups of impact points, paint transfer, and debris</li><li>VIN plate, odometer, and dash warning lights if relevant</li><li>Scene photos when available (intersection, skid marks, signals)</li><li>Avoid blurry/dark images; request re-upload before closing intake</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Injury / fatality / pedestrian / motorcycle:</strong> escalate per Progressive severity guidelines; flag for injury adjuster</li><li><strong>Suspected fraud / staged accident / VIN mismatch:</strong> SIU referral checklist</li><li><strong>Attorney representation already retained:</strong> follow represented claimant handling</li><li><strong>Catastrophe / declared weather event:</strong> route to CAT intake playbook</li><li><strong>Rideshare / delivery / business use:</strong> verify endorsement and escalate coverage SME if unclear</li><li><strong>Unlisted driver / excluded driver / lapsed policy:</strong> supervisor review before denial language</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Personal Auto FNOL

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Open or update an Auto FNOL when any of the following occur:</p><ul><li>Policyholder, household member, or Progressive agent reports an auto accident, glass loss, hit-and-run, theft, vandalism, or roadside incident involving a covered vehicle</li><li>Third-party claimant reports loss involving a Progressive-insured vehicle</li><li>Police, tow yard, or repair facility notifies Progressive of a loss with an identifiable Progressive policy</li><li>Prior FNOL is incomplete and missing required intake fields that block assignment</li></ul><p>Do <strong>not</strong> create a duplicate claim when an open FNOL already exists for the same loss date, VIN, and parties — link or amend instead.</p>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Rear-end with minor bumper damage:</strong> complete FNOL, capture photos, desk estimate path</li><li><strong>Hit-and-run parking lot:</strong> confirm UMPD/collision deductible path; police report if available</li><li><strong>Single-vehicle animal strike:</strong> confirm comprehensive; photos of animal debris if possible</li><li><strong>Multi-car interstate:</strong> capture all parties, severity triage, possible field assignment</li><li><strong>Glass crack only:</strong> route to Progressive glass partners; skip full collision FNOL fields not required</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260728T090000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Set initial indemnity reserve consistent with Progressive Auto severity band (PD-only vs BI)</li><li>Glass-only: use glass program reserve defaults</li><li>Potential total loss: include storage/tow and owner retention considerations early</li><li>Update reserves when new injuries, additional vehicles, or attorney involvement appear</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.50
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 78
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>What is the <strong>date/time</strong> and <strong>exact location</strong> of loss (city, state, highway/mile marker if applicable)?</li><li>Who was driving, and were all occupants Progressive named insureds, listed drivers, or permissive users?</li><li>How many vehicles/parties are involved, and is anyone injured?</li><li>Was a police report taken? Agency name and report number?</li><li>Is the Progressive vehicle drivable? Where is it now (home, tow yard, shop)?</li><li>Are airbags deployed, fluids leaking, or is the vehicle a potential total loss?</li><li>Any rental need, rideshare/commercial use at time of loss, or prior damage?</li><li>Is there glass-only damage, animal strike, flood, hail, or fire?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Personal Auto FNOL — First Notice of Loss Intake
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: "<ul><li>Payment after coverage confirmation, liability position (where required), and estimate/appraisal agreement</li><li>Direct repair network payments follow Progressive DRP invoice rules</li><li>Rental payments require rental coverage confirmation and dates of loss</li><li>Third-party payments require claimant identity verification and release where applicable</li></ul>"
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 6

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Open or update a Commercial Auto FNOL when:</p><ul><li>Named insured, fleet manager, or Progressive agent reports an accident, theft, vandalism, glass, or cargo-related incident involving a Progressive-scheduled commercial vehicle</li><li>Third-party claimant reports injury or property damage involving a Progressive business auto</li><li>Employee or permissive business driver is involved while operating for the insured’s business</li><li>Police, tow yard, or repair facility notifies Progressive with an identifiable commercial policy / VIN</li></ul><p>Do <strong>not</strong> duplicate an open claim for the same loss date, VIN, and parties — amend the existing FNOL.</p>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Delivery van rear-end at light:</strong> complete FNOL, employee driver status, desk estimate path</li><li><strong>Box truck dock impact:</strong> capture dock camera if available; check cargo damage separately</li><li><strong>Employee personal errand in company truck:</strong> document purpose of trip; coverage SME if personal use disputed</li><li><strong>Hit-and-run on parked service van:</strong> comprehensive/UMPD path per Progressive commercial forms</li><li><strong>Certificate holder tender letter:</strong> do not admit coverage; escalate tender handling</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260725T143000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: <ul><li>Set initial PD and BI reserves using Progressive commercial severity bands</li><li>Include storage/tow early when unit is undrivable</li><li>Separate cargo / inland marine style exposures from auto PD reserves when identified</li><li>Update reserves when additional claimants, AI tenders, or attorney involvement appear</li></ul>
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.26
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 42
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>What is the loss date/time and exact location (city, state, road/mile marker)?</li><li>Which Progressive commercial policy and which scheduled vehicle (year/make/model/VIN) are involved?</li><li>Was the operator an employee, owner-operator, listed driver, or other permissive user? On-duty for the business?</li><li>Any injuries, fatalities, pedestrians, or multiple commercial units?</li><li>Police report taken? Agency and report number?</li><li>Is the vehicle drivable? Current location (yard, tow lot, shop)?</li><li>Any cargo, tools, or customer property in/on the vehicle at time of loss?</li><li>Certificate of insurance / additional insured tender already received?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Commercial Auto FNOL — Business Vehicle Intake
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: "<ul><li>Physical damage payment after coverage confirmation and agreed estimate/appraisal</li><li>Liability payments after coverage + liability decision + settlement authority</li><li>Direct repair / commercial shop invoices follow Progressive commercial DRP rules</li><li>Rental / loss-of-use only when endorsed and dates align to loss of use of the scheduled unit</li></ul>"
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 5

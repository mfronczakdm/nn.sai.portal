    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: <ul><li>Authorize tow to a Progressive commercial repair network shop when appropriate</li><li>Secure cargo and advise insured on temporary replacement / rental truck options per coverage</li><li>Preserve dashcam / telematics / ELD data retention notices when available</li><li>Do not authorize teardown beyond Progressive commercial estimate protocol without adjuster approval</li></ul>
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Guide Progressive Claims Advisors through accurate <strong>Commercial Auto / Business Auto FNOL</strong> so liability, physical damage, and hired/non-owned exposures are identified at intake.</p><ul><li>Confirm the correct Progressive commercial policy and scheduled unit</li><li>Capture business use, driver employment status, and cargo/passenger facts</li><li>Route severity, fleet, and potential MCS-90 / certificate issues early</li></ul>"

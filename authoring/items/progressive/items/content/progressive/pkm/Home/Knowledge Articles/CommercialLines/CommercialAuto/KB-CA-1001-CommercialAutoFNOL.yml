    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Four corners and all sides of the Progressive commercial unit</li><li>Close-ups of impact points, paint transfer, and underride contact</li><li>VIN plate, odometer/hubometer, and license plate</li><li>Scene photos when available (intersection, dock, job site)</li><li>Cargo compartment / ladder rack / box contents when cargo is claimed</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Injury / fatality / pedestrian:</strong> Progressive commercial severity path; flag BI desk</li><li><strong>Fleet / large loss / multiple units:</strong> commercial large-loss / fleet desk</li><li><strong>Additional insured / tender / MCS-90 hints:</strong> coverage SME before committing tender response</li><li><strong>Suspected fraud / staged commercial accident:</strong> SIU checklist</li><li><strong>Radius / out-of-state / interstate trucking facts:</strong> verify policy eligibility and escalate if use exceeds declarations</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Commercial Auto FNOL

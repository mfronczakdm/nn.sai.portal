    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: "<ul><li>Confirm VIN against Progressive schedule and note any unit mismatch</li><li>Document commercial markings, wrap advertising, and GVWR indicators when relevant</li><li>Desk estimate when photos meet standards and damage is clearly non-structural</li><li>Field inspection for structural damage, underride, prior damage disputes, or total-loss indicators</li><li>Separate cargo / tools damage from auto physical damage scope</li></ul>"

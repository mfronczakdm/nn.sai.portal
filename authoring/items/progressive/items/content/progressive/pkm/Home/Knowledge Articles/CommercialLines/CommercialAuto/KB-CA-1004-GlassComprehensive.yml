      Hint: Core Triage Questions
      Value: "<ol><li>Is the unit on the Progressive commercial schedule for the loss date?</li><li>Collision vs comprehensive cause (impact with another vehicle vs glass/vandalism/hail)?</li><li>Any driver injury or multi-vehicle involvement that should be full FNOL?</li><li>OEM vs aftermarket glass requirements for the fleet?</li><li>Fleet downtime / rental truck need?</li></ol>"

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Use this workflow when:</p><ul><li>Insured reports windshield/side glass damage on a Progressive commercial unit</li><li>Vandalism, hail to body panels, falling tree limb, or animal strike (comprehensive path)</li><li>Glass shop or fleet manager submits a Progressive commercial glass claim</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Highway rock chip on delivery van:</strong> glass network; ADAS check</li><li><strong>Parking-lot vandalism keying:</strong> comprehensive; police report if required by guidelines</li><li><strong>Hail dents on fleet hoods:</strong> CAT or comprehensive path; unit-by-unit photos</li><li><strong>Animal strike:</strong> comprehensive; document carcass/scene if available</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260720T160000Z

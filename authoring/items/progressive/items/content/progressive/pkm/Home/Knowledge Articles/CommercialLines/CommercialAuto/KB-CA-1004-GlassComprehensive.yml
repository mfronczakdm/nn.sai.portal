    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Standardize Progressive handling of <strong>Commercial Auto comprehensive</strong> losses, especially glass, vandalism, and non-collision physical damage on scheduled business vehicles.</p><ul><li>Confirm comprehensive coverage and deductible on the Progressive commercial form</li><li>Route glass-only claims efficiently through approved networks</li><li>Spot theft-related comprehensive overlaps early</li></ul>"

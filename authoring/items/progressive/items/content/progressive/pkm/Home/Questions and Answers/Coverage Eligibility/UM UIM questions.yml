      Hint: Question
      Value: "How should Progressive claims advisors handle uninsured or underinsured motorist (UM/UIM) questions?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: UM UIM questions
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Confirm Progressive UM/UIM coverage exists on the policy and that third-party insurance status supports a UM/UIM claim. Collect required documentation of the other party's coverage limits or lack of insurance. Escalate complex UM/UIM liability or stacking questions to a Progressive coverage SME."

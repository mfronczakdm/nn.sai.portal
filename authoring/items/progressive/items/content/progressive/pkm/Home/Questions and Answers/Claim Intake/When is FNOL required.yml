    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "When is a first notice of loss (FNOL) required for Progressive claims?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: When is FNOL required
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: Record FNOL whenever a Progressive customer, agent, or third party reports a new loss that may result in a claim. Capture FNOL before creating the claim file so policy, loss date, and involved parties are confirmed. If the loss was already reported under another claim number, do not open a duplicate FNOL—link to the existing file instead.

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Use this wind/hail workflow when:</p><ul><li>Insured reports roof, siding, screens, fences, or outbuilding damage after wind or hail</li><li>Interior water intrusion follows a storm-created opening</li><li>CAT event codes apply to the loss date/location</li><li>Public adjuster or roofer submits notice on behalf of insured</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Hail bruises on 12-year asphalt roof:</strong> document test squares; estimate repair vs replace per Progressive guidelines</li><li><strong>Wind-lifted shingles with interior drip:</strong> tarp + exterior scope + interior water mitigation</li><li><strong>Fence blown down only:</strong> other structures coverage; photos of posts/footings</li><li><strong>Cosmetic denting on metal roof:</strong> check policy cosmetic damage language</li><li><strong>Tree limb through roof:</strong> emergency board-up, debris removal vs tree removal coverage nuances</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260725T170000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Roof: band by squares affected and material type</li><li>Include tarp/mitigation and potential interior water early when leaks reported</li><li>Collateral structures reserved separately</li><li>Reassess after inspection report — CAT first-notice reserves are often preliminary</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 3.80
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 58
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>Date/time of storm and when damage was discovered?</li><li>What was damaged (roof covering, flashing, soft metals, siding, windows, screens, HVAC fins)?</li><li>Any interior leaks? Which rooms?</li><li>Roof age, material (asphalt, metal, tile), and prior roof claims?</li><li>Temporary repairs already made (tarp)?</li><li>Is the home in a Progressive CAT footprint for that date?</li><li>Any trees down, power lines, or unsafe structures?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Homeowners Wind and Hail — Storm Damage Handling
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: <ul><li>Emergency tarp invoices after reasonableness review</li><li>Dwelling repairs after agreed estimate and deductible (wind/hail deductible if endorsed)</li><li>Confirm correct deductible type (AOP vs wind/hail) on Progressive declarations</li><li>Interior repairs after drying complete and scope agreed</li></ul>
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 14

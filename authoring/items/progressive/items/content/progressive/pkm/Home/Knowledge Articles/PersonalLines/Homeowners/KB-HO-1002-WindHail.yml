    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: "<ul><li>Authorize emergency tarp / board-up to prevent further interior damage</li><li>Advise insured to retain damaged shingles if removed for evidence when practical</li><li>Start interior drying if secondary water intrusion is present</li><li>Set expectations on storm surge timelines and preferred contractor networks</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Standardize Progressive handling of <strong>Personal Home wind and hail</strong> claims from FNOL through repair authorization.</p><ul><li>Separate storm-created openings from wear-and-tear</li><li>Coordinate exterior inspection and interior water follow-through</li><li>Manage CAT surge volume without skipping documentation quality</li></ul>"

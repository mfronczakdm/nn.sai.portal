      Hint: Standard Site Inspection Rules
      Value: <ul><li>Inspect roof elevations, ridges, valleys, flashing, and penetrations</li><li>Test squares for hail bruise patterns on asphalt; note soft metal evidence (vents, caps)</li><li>Photograph elevations and representative test areas</li><li>Inspect interior ceilings under damaged roof planes</li><li>Note collateral (fence, shed, screened enclosure) separately</li></ul>

    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>All roof slopes and close-ups of damaged shingles/metal</li><li>Hail spatter on AC fins, gutters, downspouts when claimed</li><li>Interior stain photos tied to exterior openings</li><li>Drone/aerial only via approved Progressive vendors where used</li><li>Date-stamped vendor reports attached to file</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Unsafe structure / tree on house / live wires:</strong> emergency services + field priority</li><li><strong>Matching / full roof replacement disputes:</strong> follow Progressive estimating and state matching guidelines; supervisor as needed</li><li><strong>Suspected pre-existing / cosmetic-only hail:</strong> document thoroughly; coverage/estimate review</li><li><strong>PA / attorney represented:</strong> represented handling rules</li><li><strong>High ALE or multi-trade large loss:</strong> large-loss desk</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Homeowners Wind and Hail

    - ID: "1a6c4003-b700-4ff6-9a1e-b0b809a20c52"
      Hint: Standard Site Inspection Rules
      Value: "<ul><li>If unrecovered: verify police entry and wait Progressive theft waiting period before total-loss settlement per guidelines</li><li>If recovered: inspect for collision damage, stripped parts, ignition damage, and interior vandalism</li><li>Document odometer, VIN plates, and airbag status</li><li>Separate theft-related damage from pre-existing damage</li></ul>"

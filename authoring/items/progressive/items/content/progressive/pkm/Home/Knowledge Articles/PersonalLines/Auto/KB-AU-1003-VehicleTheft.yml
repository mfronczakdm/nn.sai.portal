    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: "<ul><li>Advise insured to continue police follow-up and freeze related accounts if PII was in the vehicle</li><li>Explain rental reimbursement timing for Progressive comprehensive theft (waiting periods may apply)</li><li>Authorize tow from recovery yard to Progressive inspection or salvage path when appropriate</li><li>Do not release Progressive settlement until ownership/lien and theft waiting requirements are met</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Standardize Progressive handling of <strong>Personal Auto comprehensive theft</strong> claims from FNOL through recovery or total-loss settlement.</p><ul><li>Confirm comprehensive theft coverage and correct deductible</li><li>Coordinate police reporting and recovery notifications</li><li>Inspect recovered units for damage, stripping, and prior damage disputes</li></ul>"

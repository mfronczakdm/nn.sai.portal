    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Use this theft workflow when:</p><ul><li>Policyholder reports vehicle stolen, attempted theft, or theft of wheels/catalytic converter with comprehensive coverage</li><li>Police recover a Progressive-insured vehicle and notify the insured or Progressive</li><li>Prior theft FNOL needs update because the vehicle was recovered damaged or stripped</li><li>Keys / fobs were stolen and vehicle is missing (evaluate theft vs mysterious disappearance facts carefully)</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Stolen from apartment lot overnight:</strong> police report, comprehensive deductible, rental waiting period</li><li><strong>Recovered stripped for parts:</strong> total-loss evaluation; document missing components</li><li><strong>Catalytic converter cut:</strong> comprehensive; undercarriage photos; repair vs replace converter</li><li><strong>Valet took vehicle and it disappeared:</strong> facts may be conversion / voluntary parting — escalate coverage</li><li><strong>Teen took keys without permission:</strong> may not be theft by third party — supervisor/coverage path</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260719T113000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>Unrecovered: reserve toward ACV / total-loss band after coverage confirmation</li><li>Recovered repairable: PD reserve from estimate; include storage/tow</li><li>Contents / aftermarket: reserve only for covered personal effects per Progressive auto forms</li><li>Update when recovery status changes</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.00
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 36
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>When and where was the vehicle last seen? When discovered missing?</li><li>Police report filed? Agency, case number, and detective contact?</li><li>Were keys, fobs, and title in the insured’s possession?</li><li>Any GPS / Progressive telematics / OnStar-style locator active?</li><li>Loan/lease payoff needed? Lienholder name?</li><li>Personal property / aftermarket equipment in the vehicle?</li><li>Any prior damage, salvage history, or recent sale listing?</li><li>Suspects, roommates, ex-partners, or valet/parking attendants involved?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Personal Auto Vehicle Theft — Recovery and Total Loss
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: "<ul><li>Total-loss settlement after Progressive valuation, lienholder requirements, and theft waiting period</li><li>Repair payments after recovery inspection and agreed estimate</li><li>Rental payments when rental coverage applies and theft waiting rules are satisfied</li><li>Owner retention / salvage only per Progressive total-loss procedures</li></ul>"
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 4

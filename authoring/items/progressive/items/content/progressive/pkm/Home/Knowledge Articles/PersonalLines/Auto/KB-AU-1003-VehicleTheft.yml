      Hint: __Revision
      Value: "59aeceb6-43b0-4f86-8e25-837912cdbf1b"
    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: "<ul><li>Recovered vehicle: four corners, ignition area, missing parts close-ups</li><li>Police recovery yard location and unit condition on recovery day</li><li>Key/fob inventory photos when relevant</li><li>Catalytic converter undercarriage photos for converter-only theft</li></ul>"
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Friendly fraud / insured involvement suspected:</strong> SIU referral</li><li><strong>Keys surrendered / voluntary parting:</strong> coverage SME — may not be theft under Progressive forms</li><li><strong>Recovered burned or heavily stripped:</strong> total-loss desk + possible SIU</li><li><strong>Catalytic converter theft wave / VIN cloning indicators:</strong> document thoroughly; SIU as needed</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Personal Auto Vehicle Theft

    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "What should Progressive claims advisors do if FNOL information is incomplete?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Incomplete FNOL handling
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Save the incomplete FNOL with a clear missing-information list and set the claim or intake status to pending information when allowed. Contact the reporter using Progressive follow-up SLAs and document each attempt. Do not advance coverage decisions until critical missing fields are obtained or formally waived by a supervisor or SME."

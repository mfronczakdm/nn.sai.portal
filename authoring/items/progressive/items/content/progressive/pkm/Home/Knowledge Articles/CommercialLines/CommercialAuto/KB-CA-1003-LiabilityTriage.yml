    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: "<ul><li>Confirm rental / loss-of-use expectations for third-party PD only when liability is reasonably clear</li><li>Advise insured not to discuss fault on social media or with claimants</li><li>Secure Progressive unit and cargo if still at scene</li></ul>"
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Guide Progressive Claims Advisors through <strong>Commercial Auto liability</strong> claims involving third-party bodily injury and property damage.</p><ul><li>Establish liability facts early without admitting fault improperly</li><li>Separate Progressive-insured unit PD from third-party exposures</li><li>Identify additional insured / tender and severity paths quickly</li></ul>"
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"

    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Run commercial auto liability triage when:</p><ul><li>Third party alleges injury or vehicle/property damage caused by a Progressive commercial auto</li><li>Multi-vehicle accident includes a Progressive-scheduled business unit</li><li>Pedestrian, bicyclist, or dock worker injury is reported</li><li>Attorney or certificate holder tenders a liability claim to Progressive</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Rear-end by Progressive delivery van:</strong> likely liability; capture employee statement and dashcam</li><li><strong>Backing from loading dock into private auto:</strong> witness + dock camera</li><li><strong>Lane-change sideswipe on interstate:</strong> disputed liability; telematics critical</li><li><strong>Pedestrian in crosswalk:</strong> severity path immediately</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260728T110000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: "<ul><li>BI reserve by injury severity band; PD by visible damage</li><li>Update when attorney, surgery, or additional claimants appear</li><li>Keep Progressive first-party PD reserves separate from liability</li></ul>"
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating
      Value: 4.50
    - ID: "5897e9d3-8204-4ed7-9f6a-ceb4891c3182"
      Hint: PositiveCount
      Value: 55
    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>Who was operating the Progressive unit and for what business purpose?</li><li>How many claimants (BI vs PD)? Any ambulance / hospital?</li><li>Police report, citations, and independent witnesses?</li><li>Dashcam / telematics / ELD available?</li><li>Any additional insured, hold-harmless, or tender letter?</li><li>Comparative negligence facts (lane change, rear-end, backing, blind spot)?</li><li>State of loss and any no-fault / PIP interaction?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: "Commercial Auto Liability — Third-Party Injury and PD"
    - ID: "6be9cd31-e34e-4bed-880a-a218075a5b0d"
      Hint: General Payment Triggers
      Value: "<ul><li>Third-party PD after liability decision and agreed estimate/release as required</li><li>BI after medical evaluation, liability decision, and settlement authority</li><li>No payments that imply coverage beyond Progressive commercial limits without authority</li></ul>"
    - ID: "71d4c96f-1e34-4f86-8ba5-e7a24a873933"
      Hint: NegativeCount
      Value: 3

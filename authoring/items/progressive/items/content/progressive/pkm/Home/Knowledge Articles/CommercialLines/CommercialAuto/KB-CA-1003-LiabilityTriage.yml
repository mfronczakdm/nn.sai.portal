      Hint: Standard Site Inspection Rules
      Value: <ul><li>Document impact points on all vehicles and property</li><li>Preserve scene evidence (skid, debris, dock cameras)</li><li>Do not negotiate medical specials without authority</li><li>Coordinate Progressive unit PD on a separate estimate track</li></ul>

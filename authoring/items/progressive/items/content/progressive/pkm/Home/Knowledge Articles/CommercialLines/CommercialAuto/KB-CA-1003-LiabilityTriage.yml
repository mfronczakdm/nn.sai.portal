      Hint: __Revision
      Value: "4b2ac18b-d2d8-4cde-8e02-fc3f77dc4631"
    - ID: "ae3f508c-c043-4863-899c-986ad4b75bd5"
      Hint: Photo Video Standards
      Value: <ul><li>All involved vehicles’ damage and plate/VIN where accessible</li><li>Property damage (fence, building, signage) with scale references</li><li>Scene overview and traffic control devices</li><li>Retain telematics clips per Progressive evidence handling</li></ul>
    - ID: "b3f4a945-e28b-4a1c-81c7-857555b83127"
      Hint: General Escalation Rules
      Value: "<ul><li><strong>Serious injury / fatality:</strong> Progressive commercial severity desk</li><li><strong>Represented claimant:</strong> represented handling rules only</li><li><strong>AI tender / MCS-90 language:</strong> coverage SME before response</li><li><strong>Disputed liability with large exposure:</strong> supervisor / liability specialist</li></ul>"
    - ID: "b7979eed-6bcb-4117-80bc-4bcc6aab12a9"
      Hint: pageHeaderTitle
      Value: Commercial Auto Liability

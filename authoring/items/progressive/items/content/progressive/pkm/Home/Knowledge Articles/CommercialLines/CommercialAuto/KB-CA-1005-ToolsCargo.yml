    - ID: "480bb6b8-0914-4d2c-a73e-c5b28b8693e0"
      Hint: Intake Triggers
      Value: "<p>Use when:</p><ul><li>Collision or overturn damages tools, racks, or cargo in a Progressive commercial unit</li><li>Insured claims laptop kits, power tools, or customer goods were destroyed in the vehicle</li><li>Box truck contents shift and crush stock after hard braking / impact</li></ul>"
    - ID: "4d1faace-7b0f-4ec7-94b8-9ae80e0a9bce"
      Hint: Common Scenarios
      Value: "<ul><li><strong>Service van rear-ended; tool chests crushed:</strong> check inland marine / BPP</li><li><strong>Customer appliances damaged in box truck:</strong> bailee/cargo analysis</li><li><strong>Ladder rack torn off in low bridge strike:</strong> attached equipment vs auto PD</li><li><strong>Refrigerated food spoiled after delay:</strong> spoilage endorsements / BI adjacent issues</li></ul>"
    - ID: "4ed4709d-3dc8-4d81-bc4b-b44be7d21c45"
      Hint: LastRated
      Value: 20260718T083000Z
    - ID: "4f91e6ca-b571-41f9-bc35-4e7e89c590de"
      Hint: Baseline Reserve Guidelines
      Value: <ul><li>Auto PD for vehicle only until other coverages confirmed</li><li>Separate contents/cargo reserve on the correct Progressive coverage track</li></ul>
    - ID: "568439dd-7959-4317-ac05-4aca4fe37a7a"
      Hint: AverageRating

    - ID: "c09aaa65-03f7-41a9-ba56-69b018e89ccc"
      Hint: General Mitigation
      Value: <ul><li>Secure remaining tools/cargo against further theft or weather</li><li>Explain which Progressive coverage parts may apply; do not promise auto PD will cover loose tools</li></ul>
    - ID: "cc6e82f0-6942-4103-8d12-c8742b54a7a1"
      Hint: Purpose
      Value: "<p>Help Progressive Claims Advisors correctly separate <strong>commercial auto PD</strong> from <strong>tools, equipment, and cargo</strong> damaged in or on a Progressive-scheduled vehicle.</p><ul><li>Avoid paying cargo/tools under auto PD without the right Progressive coverage</li><li>Document inventories early</li><li>Coordinate inland marine / BPP / cargo forms when present</li></ul>"

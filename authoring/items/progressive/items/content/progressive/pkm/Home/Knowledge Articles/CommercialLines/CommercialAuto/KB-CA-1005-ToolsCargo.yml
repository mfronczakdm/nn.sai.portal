    - ID: "5b49b775-a3f5-41cd-bd78-90fae97f1fd6"
      Hint: Core Triage Questions
      Value: "<ol><li>What Progressive policies apply (auto only vs auto + inland marine / BPP / cargo)?</li><li>Were items permanently attached (ladder rack) vs loose tools vs customer cargo?</li><li>Who owned the goods (insured vs customer)?</li><li>Bill of lading / work order / inventory available?</li><li>Any refrigeration / time-sensitive stock?</li></ol>"
    - ID: "5c01b675-9b56-4d6b-aee4-0ecb1a0021f6"
      Hint: pageTitle
      Value: Commercial Auto — Tools, Equipment, and Cargo After Collision

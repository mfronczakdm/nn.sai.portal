      Value: "When is rental reimbursement available on a Progressive claim?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Rental reimbursement eligibility
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Check whether Progressive rental reimbursement or transportation expense coverage is on the policy and whether the claim type qualifies. Explain daily and maximum limits from the Progressive policy. In Florida, consider PIP/no-fault vehicle downtime and hurricane or CAT repair delays when discussing rental timing under FL DFS expectations. Do not authorize rental beyond Progressive guidelines without documented approval from a supervisor or SME."

    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "How should Progressive claims advisors explain deductibles to customers?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Deductible communication
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: State the Progressive deductible amount from the policy for the applicable coverage, explain it is the customer's responsibility before Progressive payment, and avoid promising net payment amounts before estimate completion. Document that the deductible discussion occurred. For Florida hurricane or CAT losses, clarify any separate wind or hurricane deductible and note FL DFS timing expectations when discussing next steps. For multiple deductibles, confirm which Progressive coverage applies.

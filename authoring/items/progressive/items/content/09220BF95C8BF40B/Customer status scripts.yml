    - ID: "2d71e32d-e990-46b3-8ca1-58cd89743d5e"
      Hint: Question
      Value: "What status language should Progressive Texas claims advisors use with customers?"
    - ID: "4e0720e9-9d50-4ddc-87cf-ecd65e8e94c8"
      Hint: NavigationTitle
      Value: Customer status scripts
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Use Progressive-approved scripts that state current status, next step, and expected timing without promising outcomes. In Texas, avoid promising payment dates that conflict with TX DOI prompt-payment rules, especially on storm claims. Document the customer conversation in the Progressive claim file."

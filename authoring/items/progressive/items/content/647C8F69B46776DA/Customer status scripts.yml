      Hint: NavigationTitle
      Value: Customer status scripts
    - ID: "4f8dc72e-1548-471c-9f3e-a13e944e4321"
      Hint: Answer
      Value: "Use Progressive-approved scripts that state current status, next step, and expected timing without promising outcomes. In Florida, reference PIP/no-fault process steps only when applicable and avoid Florida DFS-related commitments beyond approved language. Document the customer conversation in the Progressive claim file."

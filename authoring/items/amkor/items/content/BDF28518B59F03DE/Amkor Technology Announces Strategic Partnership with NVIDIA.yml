        <h2>Amkor Technology、次世代AIインフラ向け先端パッケージングおよびテスト拡大に向けてNVIDIAとの戦略的パートナーシップを発表</h2><p><em>2026年7月28日 午後9:00</em></p><p>Amkor TechnologyとNVIDIAは、米国内の能力を含む、次世代AIインフラを支える先端パッケージングおよびテスト能力を拡大するための戦略的パートナーシップを発表しました。</p><p><a href="https://ir.amkor.com/press-releases" rel="noopener noreferrer" target="_blank">ir.amkor.comで読む</a></p>

        <h2>アムコー・テクノロジー、2026年第2四半期の財務結果を発表</h2><p><em>2026年7月27日 午後8:03</em></p><p>アムコー・テクノロジー（Amkor Technology, Inc.）は、2026年第2四半期の財務結果を発表し、先端パッケージング需要、設備投資、および年内残り期間の見通しについてコメントしました。</p><p><a href="https://ir.amkor.com/press-releases" rel="noopener noreferrer" target="_blank">ir.amkor.comで続きを読む</a></p>

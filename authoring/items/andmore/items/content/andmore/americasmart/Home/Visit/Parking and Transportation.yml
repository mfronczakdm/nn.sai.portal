      Value: |
        <h2>駐車場・交通アクセス</h2><p>AmericasMart Atlantaへの便利な駐車場・交通アクセスのオプションをご案内します。Building 2およびBuilding 3の駐車場はキャンパスへのアクセスを提供し、MARTAのPeachtree Center StationではBuilding 1の正面玄関まで鉄道で直接アクセスできます。対象となるバイヤーおよびデザイナーには、一部のMarket期間中に無料の1日駐車をご利用いただけます。</p><p><a href="https://www.americasmart.com/Year-Round/Parking-and-Transportation">駐車場・交通アクセスのオプションを見る</a></p>

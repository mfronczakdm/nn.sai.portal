        <h2>Estacionamiento y transporte</h2><p>Encuentre opciones convenientes de estacionamiento y transporte para AmericasMart Atlanta. Los estacionamientos de los edificios 2 y 3 brindan acceso al campus, mientras que la estación Peachtree Center de MARTA ofrece servicio ferroviario directo a la puerta del edificio 1. Hay estacionamiento diario gratuito disponible para compradores y diseñadores elegibles entre ciertos Markets.</p><p><a href="https://www.americasmart.com/Year-Round/Parking-and-Transportation">Consulte las opciones de estacionamiento y transporte</a></p>

    - ID: "f79467fb-89e8-478b-8ac7-5b37b53c1c0c"
      Hint: Detail
      Value: |
        <h2>登録方法</h2><p>AmericasMart Atlantaは業界関係者のみご入場いただけます。来場者は、小売、インテリアデザイン、ホスピタリティ、または卸売業界で現在活動している方で、適切な事業資格証明書類の提示が必要です。すべての来場者は、バッジを受け取るために、有効な政府発行の写真付き身分証明書を持参のうえ、会場でチェックインを行います。</p><p><a href="https://www.americasmart.com/Year-Round/How-to-Register">登録要件を確認する</a></p>

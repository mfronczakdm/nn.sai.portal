      Hint: Detail
      Value: |
        <h2>How to Register</h2><p>AmericasMart Atlanta is open to the trade only. Visitors must be active members of the retail, interior design, hospitality or wholesale industries and provide appropriate business credentials. All attendees check in onsite with valid government-issued photo identification to receive a badge.</p><p><a href="https://www.americasmart.com/Year-Round/How-to-Register">Review registration requirements</a></p>

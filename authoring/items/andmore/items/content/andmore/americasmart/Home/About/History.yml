        <h2>A Legacy of Excellence</h2><p>Founded in 1957 by architect and developer John C. Portman Jr., AmericasMart began as The Atlanta Merchandise Mart. Building 1 opened in 1961 and became the foundation of today's integrated three-building campus. In 2018, AmericasMart merged with International Market Centers, now ANDMORE.</p><p><a href="https://www.americasmart.com/About/History">Explore AmericasMart history</a></p>

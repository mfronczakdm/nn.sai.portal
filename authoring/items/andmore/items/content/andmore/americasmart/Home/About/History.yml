      Value: |
        <h2>卓越のレガシー</h2><p>1957年に建築家・デベロッパーのJohn C. Portman Jr.によって創設されたAmericasMartは、当初The Atlanta Merchandise Martとして始まりました。1961年にBuilding 1が開業し、現在の3棟が一体となったキャンパスの礎となりました。2018年、AmericasMartはInternational Market Centers（現ANDMORE）と統合しました。</p><p><a href="https://www.americasmart.com/About/History">AmericasMartの歴史を見る</a></p>

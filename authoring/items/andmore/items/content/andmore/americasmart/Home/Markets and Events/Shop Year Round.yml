      Value: |
        <h2>通年営業</h2><p>AmericasMartは、ギフト、季節商品、ファッション、ホームデコ、商業関連カテゴリーのショールームを備えた、通年で仕入れができる拠点です。バイヤーやデザイナーは、自分のペースで買い付けを行い、専用サービス、教育の機会、キャンパス内アメニティを活用できます。</p><p><a href="https://www.americasmart.com/Year-Round">通年の仕入れを見る</a></p>

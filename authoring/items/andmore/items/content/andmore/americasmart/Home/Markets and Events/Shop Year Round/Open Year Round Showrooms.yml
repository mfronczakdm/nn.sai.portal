        <h2>通年営業</h2><p>マーケット開催期間外でも、AmericasMart の3棟すべてにあるショールームから商品をお探しいただけます。Building 1 ではホームデコ、カジュアル家具、デザインリソースを、Building 2 ではギフト商品とライフスタイル製品を、Building 3 ではアパレル、ジュエリー、アクセサリーを取り扱っています。</p><p><a href="https://www.americasmart.com/Year-Round/Visit">通年のご来場を計画する</a></p>

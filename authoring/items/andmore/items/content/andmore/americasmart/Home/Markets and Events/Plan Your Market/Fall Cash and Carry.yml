        <h2>秋のキャッシュ＆キャリー</h2><p>ギフトおよびホームのショールームと臨時出展を巡り、フロアサンプル、特別価格、そしてその場で持ち帰れる在庫をお買い求めいただけます。キャッシュ＆キャリーは、バイヤーが在庫を補充し、季節需要に備えるための催しです。</p><p><a href="https://www.americasmart.com/Markets/Fall-Cash-and-Carry">秋のキャッシュ＆キャリーを見る</a></p>

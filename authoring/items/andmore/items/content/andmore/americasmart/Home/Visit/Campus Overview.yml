      Value: |
        <h2>アメリカズマートのキャンパスを探索</h2><p>アメリカズマートのキャンパスは、スカイブリッジでつながる3棟の建物で構成されています。ビル1にはホームデコールとデザイン関連のリソース、ビル2にはギフトとライフスタイル製品、ビル3にはアパレル、ジュエリー、ファッションアクセサリーがあります。</p><p><a href="https://www.americasmart.com/Year-Round/Campus-Overview">キャンパス概要を見る</a></p>

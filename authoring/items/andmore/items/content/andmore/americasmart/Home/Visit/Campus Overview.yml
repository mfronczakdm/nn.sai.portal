        <h2>Explore the AmericasMart Campus</h2><p>The AmericasMart campus spans three buildings connected by skybridges. Building 1 features home décor and design resources, Building 2 is a destination for gift and lifestyle products, and Building 3 is home to apparel, jewelry and fashion accessories.</p><p><a href="https://www.americasmart.com/Year-Round/Campus-Overview">View the campus overview</a></p>

        <h2>今後さらに充実するダウンタウン</h2><p>キャンパスからすぐのダウンタウン・アトランタでは、新たな飲食店、アート、エンターテインメント施設の開発が進んでいます。センテニアル・パーク地区には大規模な投資が集まり、AmericasMart周辺でも追加プロジェクトが進行中です。</p><p><a href="https://www.americasmart.com/Year-Round/Interactive-Map">インタラクティブな開発マップを見る</a></p>

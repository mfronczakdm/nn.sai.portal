        <h2>Acerca de AmericasMart</h2><p>Ubicado en el centro de Atlanta, el complejo AmericasMart cuenta con más de 7,2 millones de pies cuadrados de espacio de exhibición y una amplia colección de salas de exhibición mayoristas de hogar, regalos y vestuario. Sus mercados anuales atienden a minoristas, diseñadores y grupos de compra de todo Estados Unidos y del mundo.</p><p><a href="https://www.americasmart.com/About">Más información sobre AmericasMart</a></p>

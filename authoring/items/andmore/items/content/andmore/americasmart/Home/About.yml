      Value: |
        <h2>AmericasMartについて</h2><p>アトランタのダウンタウンに位置するAmericasMart複合施設は、720万平方フィートを超える展示スペースと、ホーム、ギフト、アパレルの卸売ショールームを幅広く備えています。毎年開催されるマーケットには、全米各地および世界中の小売業者、デザイナー、バイインググループが訪れます。</p><p><a href="https://www.americasmart.com/About">AmericasMartについて詳しく見る</a></p>

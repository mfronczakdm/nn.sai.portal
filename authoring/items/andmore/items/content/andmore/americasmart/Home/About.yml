        <h2>About AmericasMart</h2><p>Located in downtown Atlanta, the AmericasMart complex contains more than 7.2 million square feet of exhibition space and a vast collection of wholesale home, gift and apparel showrooms. Its annual markets serve retailers, designers and buying groups from across the United States and around the world.</p><p><a href="https://www.americasmart.com/About">Learn more about AmericasMart</a></p>

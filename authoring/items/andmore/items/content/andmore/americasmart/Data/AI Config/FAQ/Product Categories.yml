      Hint: question
      Value: "¿Qué categorías de productos vende SYNC?"
    - ID: "b4c5d6e7-f8a9-4b0c-1d2e-3f4a5b6c7d8e"
      Hint: answer
      Value: SYNC vende parlantes (para el hogar, portátiles, profesionales), audífonos (intraurales, circumaurales, inalámbricos) y amplificadores (de tubo, de estado sólido, digitales, híbridos). También ofrecemos accesorios, soluciones SYNC for Business y Servicios para Artistas. Compra por categoría o usa filtros como Bluetooth y parlante inteligente para encontrar el equipo adecuado.

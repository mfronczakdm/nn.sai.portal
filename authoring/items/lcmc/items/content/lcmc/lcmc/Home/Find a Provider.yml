        <h2>Trouver un prestataire</h2><p>Utilisez l’outil de recherche de prestataires de LCMC Health pour trouver des médecins et d’autres professionnels de la santé qui répondent à vos besoins.</p><p>Les options de recherche aident les patients à trouver des prestataires par nom, spécialité et emplacement dans l’ensemble du réseau de santé.</p><p><a href="/For-Patients/Patient-Appointments">Prendre un rendez-vous en pédiatrie</a> avec les soins primaires de Manning Family Children's — choisissez un type de visite, sélectionnez une heure et terminez dans Mon LCMC Health ou en tant qu’invité.</p>

      Value: "<h2>Soins d’urgence LCMC Health à Chalmette</h2><p>La clinique de Chalmette offre des soins sans rendez-vous pour les maladies et blessures qui ne mettent pas la vie en danger dans la paroisse de St. Bernard.</p><p>Les patients peuvent recevoir rapidement une évaluation locale et des conseils sur le suivi lorsque des soins supplémentaires sont nécessaires.</p>"

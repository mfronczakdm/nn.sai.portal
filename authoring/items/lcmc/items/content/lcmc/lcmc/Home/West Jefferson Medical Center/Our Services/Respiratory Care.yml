      Hint: Detail
      Value: |
        <h2>Lung and breathing care</h2><p>Respiratory care at West Jefferson Medical Center includes pulmonary clinic visits and hospital-based respiratory therapy. Patients with asthma, COPD, sleep-related breathing problems, or other lung conditions can be evaluated by pulmonary associates on campus.</p><p>West Jefferson Pulmonary Associates: 1111 Medical Center Blvd., Suite N-504, Marrero — 504-349-6705. Hospital: 504-347-5511.</p><p><a href="/Find-a-Provider">Find a pulmonary specialist</a></p>

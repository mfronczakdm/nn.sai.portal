    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Un hospital comunitario para la Ribera Oeste</h2><p>West Jefferson Medical Center abrió en abril de 1960 después de que familias y médicos de la Ribera Oeste organizaran uno de los primeros hospitales de este lado del río. Hoy es un hospital sin ánimo de lucro de 324 camas en un campus de más de 20 acres en Marrero, a minutos del centro de Nueva Orleans.</p><p>El hospital es un líder regional en atención aguda, preventiva y de rehabilitación para las comunidades de las parroquias de Jefferson, Orleans, Plaquemines y St. Charles. En el campus, los pacientes encuentran servicios de emergencia junto con atención cardíaca y vascular, un Centro Integral de Accidentes Cerebrovasculares de la Joint Commission, atención ósea y articular, diagnóstico por imágenes, un programa oncológico acreditado por la Commission on Cancer, servicios integrales para la mujer y un programa de rehabilitación certificado por CARF.</p><h3>Misión, visión y valores</h3><ul><li><strong>Misión:</strong> Salud, atención y educación más allá de lo extraordinario.</li><li><strong>Visión:</strong> Crear una cultura de bienestar.</li><li><strong>Valores:</strong> Ponemos corazón y alma. Estamos juntos en esto. Damos un poco más.</li></ul><h3>Parte de LCMC Health</h3><p>West Jefferson se unió a LCMC Health en 2015. Como miembro del sistema sin ánimo de lucro con sede en Nueva Orleans, el hospital continúa sirviendo a la industria de la Ribera Oeste, los corredores marítimos y las familias de los vecindarios con el mismo compromiso local con el que abrió sus puertas hace más de 60 años.</p>"

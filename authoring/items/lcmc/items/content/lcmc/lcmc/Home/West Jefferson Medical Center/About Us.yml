    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Un hôpital communautaire pour la Rive-Ouest</h2><p>Le West Jefferson Medical Center a ouvert ses portes en avril 1960, après que des familles et des médecins de la Rive-Ouest eurent organisé l’un des premiers hôpitaux de ce côté-ci du fleuve. Aujourd’hui, c’est un hôpital sans but lucratif de 324 lits, situé sur un campus de plus de 20 acres à Marrero, à quelques minutes du centre-ville de La Nouvelle-Orléans.</p><p>L’hôpital est un chef de file régional en soins aigus, préventifs et de réadaptation pour les communautés des paroisses de Jefferson, d’Orleans, de Plaquemines et de St. Charles. Sur le campus, les patients ont accès à des services d’urgence, ainsi qu’à des soins cardiaques et vasculaires, à un centre d’AVC complet accrédité par la Joint Commission, à des soins des os et des articulations, à l’imagerie diagnostique, à un programme de cancérologie agréé par la Commission on Cancer, à des services complets pour les femmes et à un programme de réadaptation certifié par la CARF.</p><h3>Mission, vision et valeurs</h3><ul><li><strong>Mission :</strong> La santé, les soins et l’éducation au-delà de l’extraordinaire.</li><li><strong>Vision :</strong> Créer une culture du mieux-être.</li><li><strong>Valeurs :</strong> Nous y mettons tout notre cœur et toute notre âme. Nous avançons ensemble. Nous en faisons un peu plus.</li></ul><h3>Fier membre de LCMC Health</h3><p>West Jefferson s’est joint à LCMC Health en 2015. En tant que membre de ce système sans but lucratif basé à La Nouvelle-Orléans, l’hôpital continue de servir les industries de la Rive-Ouest, les corridors maritimes et les familles du voisinage avec le même engagement local qui a guidé son ouverture il y a plus de 60 ans.</p>"

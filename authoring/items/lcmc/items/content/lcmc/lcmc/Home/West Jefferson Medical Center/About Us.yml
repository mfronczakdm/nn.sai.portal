    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>A community hospital for the Westbank</h2><p>West Jefferson Medical Center opened in April 1960 after Westbank families and physicians organized one of the first hospitals on this side of the river. Today it is a 324-bed not-for-profit hospital on a campus of more than 20 acres in Marrero, minutes from downtown New Orleans.</p><p>The hospital is a regional leader in acute, preventive, and rehabilitative care for Jefferson, Orleans, Plaquemines, and St. Charles Parish communities. On campus, patients find emergency services paired with heart and vascular care, a Joint Commission Comprehensive Stroke Center, bone and joint care, diagnostic imaging, a Commission on Cancer-accredited cancer program, comprehensive women’s services, and a CARF-certified rehabilitation program.</p><h3>Mission, vision, and values</h3><ul><li><strong>Mission:</strong> Health, care, and education beyond extraordinary.</li><li><strong>Vision:</strong> Creating a culture of wellness.</li><li><strong>Values:</strong> We bring heart and soul. We’re in it together. We give a little extra.</li></ul><h3>Part of LCMC Health</h3><p>West Jefferson joined LCMC Health in 2015. As a member of the New Orleans-based nonprofit system, the hospital continues to serve Westbank industry, maritime corridors, and neighborhood families with the same local commitment that opened its doors more than 60 years ago.</p>"

      Hint: Detail
      Value: |
        <h2>Keeping Westbank patients moving</h2><p>Orthopedic care at West Jefferson Medical Center covers injuries and chronic conditions of bones, joints, and related tissues. Teams typically begin with immobilization, medication, and physical therapy. When those approaches no longer control pain or restore daily activity, orthopedic surgeons discuss surgical options using current techniques.</p><p>Rehabilitation can continue on campus through physical rehabilitation services. Hospital main number: 504-347-5511. <a href="/Find-a-Provider">Find an orthopedic specialist</a>.</p>

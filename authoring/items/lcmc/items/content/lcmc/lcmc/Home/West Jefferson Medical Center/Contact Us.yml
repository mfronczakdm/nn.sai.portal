        <h2>Get in touch</h2><p><strong>West Jefferson Medical Center</strong><br/>1101 Medical Center Blvd.<br/>Marrero, LA 70072<br/>Main phone: <strong>504-347-5511</strong></p><h3>Specialty scheduling (demo)</h3><ul><li><strong>Ears, Nose &amp; Throat:</strong> 504-934-8550 — <a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">ENT care page</a></li><li><strong>Cancer Center / infusion:</strong> 504-349-6360</li><li><strong>Heart and vascular:</strong> 504-349-6800</li><li><strong>Family Birth Place:</strong> 504-349-6200</li></ul><p>For emergencies, go to the emergency department or call 911. The online contact form is not for medical advice.</p><p>System-wide help: <a href="/Contact-Us">LCMC Health Contact Us</a> &nbsp;|&nbsp; <a href="/Find-a-Provider">Find a Provider</a></p>

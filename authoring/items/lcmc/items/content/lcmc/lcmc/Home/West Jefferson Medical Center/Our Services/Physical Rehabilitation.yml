    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Rehabilitación después de una enfermedad o lesión</h2><p>West Jefferson Medical Center ofrece un programa integral de rehabilitación certificado por CARF. Los pacientes pueden recibir rehabilitación hospitalaria, fisioterapia y terapia ocupacional ambulatorias, y rehabilitación cardíaca. Las empresas de Westbank también pueden usar el Centro de Regreso al Trabajo en el campus.</p><p>Su equipo de atención le ayuda a establecer metas de fuerza, movilidad y regreso al hogar o al trabajo. Llame al 504-347-5511 para comunicarse con los servicios de rehabilitación, o pídale a su médico una remisión.</p>"

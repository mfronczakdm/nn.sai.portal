    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Réadaptation après une maladie ou une blessure</h2><p>West Jefferson Medical Center offre un programme complet de réadaptation certifié par la CARF. Les patients peuvent recevoir des services de réadaptation en hospitalisation, de physiothérapie et d’ergothérapie en consultation externe, ainsi que de réadaptation cardiaque. Les entreprises du Westbank peuvent aussi utiliser le centre de retour au travail situé sur le campus.</p><p>Votre équipe de soins vous aide à établir des objectifs pour retrouver votre force, votre mobilité et votre autonomie à la maison ou au travail. Appelez au 504-347-5511 pour joindre les services de réadaptation, ou demandez une recommandation à votre médecin.</p>"

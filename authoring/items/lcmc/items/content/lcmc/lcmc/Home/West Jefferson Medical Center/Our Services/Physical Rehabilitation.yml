    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Rehabilitation after illness or injury</h2><p>West Jefferson Medical Center provides a comprehensive rehabilitation program certified by CARF. Patients may receive inpatient rehab, outpatient physical and occupational therapy, and cardiac rehabilitation. Companies on the Westbank can also use the on-campus Return to Work Center.</p><p>Your care team helps set goals for strength, mobility, and returning to home or work. Call 504-347-5511 to reach rehabilitation services, or ask your physician for a referral.</p>"

      Value: "<h2>Soins urgents LCMC Health de Luling</h2><p>Les soins urgents de Luling sont présentés avec l’information du réseau élargi de soins urgents de LCMC Health, puisqu’une page en ligne dédiée n’était pas accessible.</p><p>Ce sujet aide les patients à trouver des soins sans rendez-vous pour les maladies et blessures qui ne mettent pas leur vie en danger, ainsi que des indications sur les services additionnels au besoin.</p>"

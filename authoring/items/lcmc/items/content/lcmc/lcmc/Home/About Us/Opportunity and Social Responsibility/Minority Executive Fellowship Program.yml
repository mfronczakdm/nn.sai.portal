        <h2>Minority Executive Fellowship Program</h2><p>This year-long LCMC Health fellowship creates a pipeline for recent graduates interested in healthcare administration and social sciences.</p><p>Fellows gain onsite training and practical experience while learning about leadership within a New Orleans-based health system.</p><p><a href="https://www.lcmchealth.org/about-us/opportunity-social-responsibility/minority-executive-fellowship-program/">Learn about the fellowship</a></p>

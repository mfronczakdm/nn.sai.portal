        <h2>Ligne téléphonique gratuite Demandez à une infirmière</h2><p>Les infirmières autorisées de LCMC Health répondent à vos questions de santé et aident les nouveaux patients et les patients actuels à déterminer la prochaine étape de soins qui convient.</p><p>La ligne téléphonique vous offre un moyen pratique de poser des questions sur les symptômes, les services et l’endroit où obtenir des soins lorsque vous ne savez pas qui contacter.</p><p><a href="https://www.lcmchealth.org/for-patients/free-ask-a-nurse-hotline/">Voir les détails de la ligne téléphonique</a></p>

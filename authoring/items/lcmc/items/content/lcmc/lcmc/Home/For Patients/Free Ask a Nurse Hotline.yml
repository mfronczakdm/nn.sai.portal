        <h2>Free Ask a Nurse Hotline</h2><p>LCMC Health registered nurses answer health questions and help new and existing patients identify an appropriate next step for care.</p><p>The hotline offers a convenient place to ask about symptoms, services, and where to seek care when you are unsure whom to contact.</p><p><a href="https://www.lcmchealth.org/for-patients/free-ask-a-nurse-hotline/">View hotline details</a></p>

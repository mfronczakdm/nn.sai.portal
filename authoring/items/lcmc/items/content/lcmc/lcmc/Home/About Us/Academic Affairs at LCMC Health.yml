        <h2>Affaires universitaires chez LCMC Health</h2><p>Les Affaires universitaires de LCMC Health coordonnent et font progresser les milieux d’apprentissage clinique dans les hôpitaux du système de santé.</p><p>Le programme soutient les apprenants en médecine, en sciences infirmières, en pharmacie, en formation clinique et en santé paramédicale, tout en contribuant à former la future main-d’œuvre en santé de la région.</p><p><a href="https://www.lcmchealth.org/about-us/academic-affairs-at-lcmc-health/">Découvrir les Affaires universitaires</a></p>

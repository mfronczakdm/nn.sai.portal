      Value: <h2>Cirugía de Mohs</h2><p>La cirugía de Mohs es un procedimiento dermatológico especializado que se utiliza para extirpar ciertos tipos de cáncer de piel mientras se preserva la mayor cantidad posible de tejido sano.</p><p>Los equipos de dermatología de LCMC Health evalúan a cada paciente y explican si este enfoque preciso y por etapas es apropiado según el tipo y la ubicación del cáncer.</p>

      Hint: Detail
      Value: |
        <h2>Better rest, better health</h2><p>Sleep disorders affect daytime energy, heart health, and safety. West Jefferson Medical Center sleep care evaluates snoring, obstructive sleep apnea, and related conditions. Treatment may include lifestyle guidance, devices, or procedures coordinated with ENT or pulmonary specialists.</p><p>Ask your primary care physician for a referral, or call 504-347-5511. ENT patients with sleep apnea concerns can also start on the <a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">ENT page</a>.</p>

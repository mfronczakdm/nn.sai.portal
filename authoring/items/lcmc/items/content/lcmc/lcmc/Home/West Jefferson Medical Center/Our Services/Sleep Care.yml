      Hint: Detail
      Value: |
        <h2>Un meilleur sommeil pour une meilleure santé</h2><p>Les troubles du sommeil peuvent nuire à l’énergie durant la journée, à la santé du cœur et à la sécurité. Le service de soins du sommeil du West Jefferson Medical Center évalue le ronflement, l’apnée obstructive du sommeil et les troubles connexes. Le traitement peut comprendre des conseils sur les habitudes de vie, des appareils ou des interventions coordonnées avec des spécialistes en ORL ou en pneumologie.</p><p>Demandez une recommandation à votre médecin de soins primaires, ou appelez au 504-347-5511. Les patients en ORL ayant des préoccupations liées à l’apnée du sommeil peuvent aussi commencer sur la <a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">page ORL</a>.</p>

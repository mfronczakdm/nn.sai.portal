      Hint: Detail
      Value: |
        <h2>Mejor descanso, mejor salud</h2><p>Los trastornos del sueño afectan la energía durante el día, la salud del corazón y la seguridad. El servicio de atención del sueño de West Jefferson Medical Center evalúa los ronquidos, la apnea obstructiva del sueño y afecciones relacionadas. El tratamiento puede incluir orientación sobre el estilo de vida, dispositivos o procedimientos coordinados con especialistas en otorrinolaringología o neumología.</p><p>Pídale una remisión a su médico de atención primaria o llame al 504-347-5511. Los pacientes de otorrinolaringología con inquietudes sobre apnea del sueño también pueden comenzar en la <a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">página de otorrinolaringología</a>.</p>

    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: |
        <h2>Specialized wound healing</h2><p>Chronic wounds related to diabetes, circulation problems, or surgery need a dedicated plan. West Jefferson Medical Center wound care teams assess the wound, manage infection risk, and coordinate dressings, offloading, and, when appropriate, <a href="/West-Jefferson-Medical-Center/Our-Services/Hyperbaric">hyperbaric oxygen therapy</a>.</p><p>Ask your physician for a referral or call the hospital at 504-347-5511. Bring a list of medications and prior wound treatments to the first visit.</p>

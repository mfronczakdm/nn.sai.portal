      Hint: Detail
      Value: |
        <h2>Cicatrización especializada de heridas</h2><p>Las heridas crónicas relacionadas con la diabetes, los problemas de circulación o la cirugía necesitan un plan dedicado. Los equipos de cuidado de heridas de West Jefferson Medical Center evalúan la herida, manejan el riesgo de infección y coordinan los vendajes, la descarga y, cuando corresponde, la <a href="/West-Jefferson-Medical-Center/Our-Services/Hyperbaric">oxigenoterapia hiperbárica</a>.</p><p>Pídale a su médico una remisión o llame al hospital al 504-347-5511. Lleve una lista de medicamentos y tratamientos previos de la herida a la primera consulta.</p>

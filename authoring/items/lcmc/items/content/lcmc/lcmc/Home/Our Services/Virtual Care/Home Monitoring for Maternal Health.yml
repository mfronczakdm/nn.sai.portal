      Value: <h2>Surveillance à domicile pour la santé maternelle</h2><p>La surveillance à domicile de LCMC Health permet aux patientes admissibles en santé maternelle de transmettre certains renseignements sur leur santé à leur équipe soignante.</p><p>Le soutien à distance complète les visites prévues et aide les cliniciens à rester en lien avec l’évolution des besoins pendant la grossesse et après l’accouchement.</p>

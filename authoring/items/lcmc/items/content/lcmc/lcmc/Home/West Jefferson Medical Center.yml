      Hint: Detail
      Value: |
        <h2>Atención para la Ribera Oeste, cerca de casa</h2><p>West Jefferson Medical Center es un hospital sin ánimo de lucro de 324 camas ubicado en Medical Center Boulevard en Marrero. Durante más de 60 años ha sido el hospital regional para las comunidades de las parroquias de Jefferson, Orleans, Plaquemines y St. Charles en la Ribera Oeste.</p><p>Los pacientes vienen aquí para recibir atención de urgencias, tratamiento cardiovascular, servicios oncológicos, atención de maternidad en The Family Birth Place, ortopedia, diagnóstico por imágenes y una gama completa de especialidades hospitalarias. Las clínicas vecinales de atención primaria extienden ese mismo equipo de LCMC Health a Algiers, Harvey, Gretna y Terrytown.</p><h3>Visite y conéctese</h3><ul><li><strong>Dirección:</strong> 1101 Medical Center Blvd., Marrero, LA 70072</li><li><strong>Teléfono principal:</strong> 504-347-5511</li><li><strong>Departamento de urgencias:</strong> abierto las 24 horas del día</li></ul><p><a href="/West-Jefferson-Medical-Center/Our-Services">Explore los servicios del hospital</a> &nbsp;|&nbsp; <a href="/Find-a-Provider">Encuentre un proveedor</a> &nbsp;|&nbsp; <a href="/Our-Locations/West-Jefferson-Medical-Center">Ubicación del hospital y detalles del campus</a></p>

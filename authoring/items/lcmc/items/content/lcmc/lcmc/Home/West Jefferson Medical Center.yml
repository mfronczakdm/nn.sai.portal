    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: |
        <h2>Care for the Westbank, close to home</h2><p>West Jefferson Medical Center is a 324-bed not-for-profit hospital on Medical Center Boulevard in Marrero. For more than 60 years it has been the regional hospital for Jefferson, Orleans, Plaquemines, and St. Charles Parish communities on the Westbank.</p><p>Patients come here for emergency care, heart and vascular treatment, cancer services, maternity care at The Family Birth Place, orthopedics, imaging, and a full range of hospital specialties. Neighborhood primary care clinics extend that same LCMC Health team into Algiers, Harvey, Gretna, and Terrytown.</p><h3>Visit and connect</h3><ul><li><strong>Address:</strong> 1101 Medical Center Blvd., Marrero, LA 70072</li><li><strong>Main phone:</strong> 504-347-5511</li><li><strong>Emergency department:</strong> open 24 hours a day</li></ul><p><a href="/West-Jefferson-Medical-Center/Our-Services">Explore hospital services</a> &nbsp;|&nbsp; <a href="/Find-a-Provider">Find a provider</a> &nbsp;|&nbsp; <a href="/Our-Locations/West-Jefferson-Medical-Center">Hospital location and campus details</a></p>

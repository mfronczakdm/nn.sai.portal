      Hint: Detail
      Value: |
        <h2>Des soins pour la Rive-Ouest, près de chez vous</h2><p>West Jefferson Medical Center est un hôpital sans but lucratif de 324 lits situé sur Medical Center Boulevard à Marrero. Depuis plus de 60 ans, il est l’hôpital régional des communautés des paroisses de Jefferson, Orléans, Plaquemines et St. Charles sur la Rive-Ouest.</p><p>Les patients viennent ici pour les soins d’urgence, les traitements cardiaques et vasculaires, les services de cancérologie, les soins de maternité à The Family Birth Place, l’orthopédie, l’imagerie et une gamme complète de spécialités hospitalières. Les cliniques de soins primaires de quartier offrent cette même équipe de LCMC Health à Algiers, Harvey, Gretna et Terrytown.</p><h3>Visiter et communiquer</h3><ul><li><strong>Adresse :</strong> 1101 Medical Center Blvd., Marrero, LA 70072</li><li><strong>Téléphone principal :</strong> 504-347-5511</li><li><strong>Service d’urgence :</strong> ouvert 24 heures sur 24</li></ul><p><a href="/West-Jefferson-Medical-Center/Our-Services">Découvrir les services hospitaliers</a> &nbsp;|&nbsp; <a href="/Find-a-Provider">Trouver un médecin</a> &nbsp;|&nbsp; <a href="/Our-Locations/West-Jefferson-Medical-Center">Emplacement de l’hôpital et détails du campus</a></p>

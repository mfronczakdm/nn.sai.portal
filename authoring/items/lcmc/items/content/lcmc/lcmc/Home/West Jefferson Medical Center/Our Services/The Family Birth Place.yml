        <h2>Welcoming Westbank families</h2><p>The Family Birth Place at West Jefferson Medical Center is the hospital’s maternity unit — labor, delivery, and recovery on the third floor of the Marrero campus. The hospital is recognized for maternity care and offers childbirth preparation and related education classes.</p><p><strong>Location:</strong> 1101 Medical Center Blvd., 3rd Floor, Marrero, LA 70072<br/><strong>Phone:</strong> 504-349-6200 (unit) / 504-349-2528 (Family Birth Place listing)</p><p>Tour and class information is available by calling the unit. Women’s health obstetrics clinic: 1111 Medical Center Blvd., Suite S-250 — 504-349-6945. <a href="/Find-a-Provider">Find an OB/GYN</a>.</p>

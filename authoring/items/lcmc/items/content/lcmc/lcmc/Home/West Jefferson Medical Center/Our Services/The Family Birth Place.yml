        <h2>Accueillir les familles de la Westbank</h2><p>Le Family Birth Place au West Jefferson Medical Center est l’unité de maternité de l’hôpital — travail, accouchement et rétablissement au troisième étage du campus de Marrero. L’hôpital est reconnu pour ses soins de maternité et offre des cours de préparation à l’accouchement et d’autres cours éducatifs connexes.</p><p><strong>Emplacement :</strong> 1101 Medical Center Blvd., 3e étage, Marrero, LA 70072<br/><strong>Téléphone :</strong> 504-349-6200 (unité) / 504-349-2528 (répertoire du Family Birth Place)</p><p>Les renseignements sur les visites et les cours sont offerts en appelant l’unité. Clinique d’obstétrique et de santé des femmes : 1111 Medical Center Blvd., bureau S-250 — 504-349-6945. <a href="/Find-a-Provider">Trouver un OB/GYN</a>.</p>

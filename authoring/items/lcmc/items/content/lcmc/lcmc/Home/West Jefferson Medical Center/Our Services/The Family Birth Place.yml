        <h2>Bienvenidos a las familias de Westbank</h2><p>Family Birth Place at West Jefferson Medical Center es la unidad de maternidad del hospital: trabajo de parto, parto y recuperación en el tercer piso del campus de Marrero. El hospital es reconocido por su atención de maternidad y ofrece clases de preparación para el parto y educación relacionada.</p><p><strong>Ubicación:</strong> 1101 Medical Center Blvd., 3rd Floor, Marrero, LA 70072<br/><strong>Teléfono:</strong> 504-349-6200 (unidad) / 504-349-2528 (listado de Family Birth Place)</p><p>La información sobre recorridos y clases está disponible llamando a la unidad. Clínica de obstetricia y salud de la mujer: 1111 Medical Center Blvd., Suite S-250 — 504-349-6945. <a href="/Find-a-Provider">Encuentre un obstetra/ginecólogo</a>.</p>

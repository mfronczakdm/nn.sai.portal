        <h2>Soins spécialisés en urologie</h2><p>Les spécialistes en urologie de West Jefferson évaluent et traitent les problèmes des voies urinaires et de l’appareil reproducteur masculin, y compris les calculs rénaux, les problèmes de prostate et les troubles de la vessie. La clinique est située sur le campus de Marrero, ce qui permet d’avoir accès à l’imagerie et aux services hospitaliers à proximité au besoin.</p><p><strong>Clinique :</strong> 1111 Medical Center Blvd., Suite N-703, Marrero, LA 70072<br/><strong>Téléphone :</strong> 504-934-8100</p><p><a href="/Find-a-Provider">Trouver un urologue</a></p>

        <h2>Atención especializada en urología</h2><p>Los especialistas en urología de West Jefferson evalúan y tratan afecciones de las vías urinarias y del sistema reproductor masculino, incluidos los cálculos renales, los problemas de próstata y las afecciones de la vejiga. La clínica está en el campus de Marrero, por lo que los servicios de imágenes y hospitalarios están cerca cuando se necesitan.</p><p><strong>Clínica:</strong> 1111 Medical Center Blvd., Suite N-703, Marrero, LA 70072<br/><strong>Teléfono:</strong> 504-934-8100</p><p><a href="/Find-a-Provider">Encontrar un urólogo</a></p>

      Hint: Detail
      Value: <h2>Atención domiciliaria de LCMC Health</h2><p>La Atención Domiciliaria de LCMC Health ofrece servicios intermitentes dirigidos por médicos para pacientes calificados que se recuperan o manejan sus necesidades de salud en casa.</p><p>El apoyo disponible puede incluir enfermería especializada, terapia, educación y coordinación con el fin de ayudar a los pacientes a continuar su recuperación fuera del hospital.</p>

    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: <h2>Soins à domicile de LCMC Health</h2><p>Les soins à domicile de LCMC Health offrent des services intermittents dirigés par un médecin aux patients admissibles qui se rétablissent ou gèrent leurs besoins de santé à la maison.</p><p>Le soutien offert peut comprendre des soins infirmiers spécialisés, de la thérapie, de l’éducation et de la coordination visant à aider les patients à poursuivre leur rétablissement à l’extérieur de l’hôpital.</p>

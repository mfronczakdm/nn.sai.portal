      Hint: Detail
      Value: |
        <h2>Des soins dans la langue que les familles préfèrent</h2><p>Centro Hispano de Salud est le programme de santé hispanique du West Jefferson Medical Center. Il aide les patients à s’orienter pour les rendez-vous, les visites préventives et les services hospitaliers grâce à un soutien bilingue afin que la langue ne soit pas un obstacle aux soins.</p><p>La clinique Hispanic Health Center, située au 3909, boulevard Lapalco à Harvey (504-349-2150), est un point d’accès de proximité. Pour les ressources en santé hispanique à l’échelle du système, consultez aussi <a href="/Our-Services/Hispanic-Health-Center">LCMC Health Hispanic Health Center</a>.</p><p>Pour prendre rendez-vous, appelez la clinique ou utilisez <a href="/Find-a-Provider">Trouver un médecin</a>. Numéro principal de l’hôpital : 504-347-5511.</p>

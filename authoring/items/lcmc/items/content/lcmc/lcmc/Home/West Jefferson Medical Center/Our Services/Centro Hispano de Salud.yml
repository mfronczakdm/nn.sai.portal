      Hint: Detail
      Value: |
        <h2>Care in the language families prefer</h2><p>Centro Hispano de Salud is West Jefferson Medical Center’s Hispanic health program. It helps patients navigate appointments, preventive visits, and hospital services with bilingual support so language is not a barrier to care.</p><p>The Hispanic Health Center clinic at 3909 Lapalco Blvd. in Harvey (504-349-2150) is a neighborhood access point. For system-wide Hispanic health resources, see also <a href="/Our-Services/Hispanic-Health-Center">LCMC Health Hispanic Health Center</a>.</p><p>To schedule, call the clinic or use <a href="/Find-a-Provider">Find a Provider</a>. Hospital main number: 504-347-5511.</p>

      Hint: Detail
      Value: |
        <h2>Atención en el idioma que las familias prefieren</h2><p>Centro Hispano de Salud es el programa de salud hispano de West Jefferson Medical Center. Ayuda a los pacientes a gestionar citas, visitas preventivas y servicios hospitalarios con apoyo bilingüe para que el idioma no sea una barrera para la atención.</p><p>La clínica Hispanic Health Center en 3909 Lapalco Blvd. en Harvey (504-349-2150) es un punto de acceso en la comunidad. Para recursos de salud hispana en todo el sistema, consulte también <a href="/Our-Services/Hispanic-Health-Center">LCMC Health Hispanic Health Center</a>.</p><p>Para programar una cita, llame a la clínica o use <a href="/Find-a-Provider">Find a Provider</a>. Número principal del hospital: 504-347-5511.</p>

        <h2>Cuidado de la mujer en cada etapa</h2><p>West Jefferson Medical Center ofrece obstetricia y ginecología, atención de maternidad en The Family Birth Place, e imágenes mamarias y para la mujer. The Women’s Medical Center en Gretna (515 Westbank Expy., 504-366-7233) es otro punto de acceso para consultas de salud de la mujer.</p><p>Clínica de obstetricia y ginecología: 1111 Medical Center Blvd., Suite S-250 — 504-349-6945. Centro de Imágenes para la Mujer y Cuidado Mamario: 4521 Westbank Expressway — 504-349-6300.</p><p>Vea también <a href="/West-Jefferson-Medical-Center/Our-Services/The-Family-Birth-Place">The Family Birth Place</a>. <a href="/Find-a-Provider">Encuentre un proveedor de salud para la mujer</a>.</p>

      Value: |
        <h2>Women’s care through every stage</h2><p>West Jefferson Medical Center provides obstetrics and gynecology, maternity care at The Family Birth Place, and breast and women’s imaging. The Women’s Medical Center in Gretna (515 Westbank Expy., 504-366-7233) is another access point for women’s health visits.</p><p>OB/GYN clinic: 1111 Medical Center Blvd., Suite S-250 — 504-349-6945. Women’s Imaging and Breast Care Center: 4521 Westbank Expressway — 504-349-6300.</p><p>See also <a href="/West-Jefferson-Medical-Center/Our-Services/The-Family-Birth-Place">The Family Birth Place</a>. <a href="/Find-a-Provider">Find a women’s health provider</a>.</p>

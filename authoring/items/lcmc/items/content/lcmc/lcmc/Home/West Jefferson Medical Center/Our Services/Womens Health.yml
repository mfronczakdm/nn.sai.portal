        <h2>Des soins pour les femmes à chaque étape</h2><p>Le West Jefferson Medical Center offre des services d’obstétrique et de gynécologie, des soins de maternité à The Family Birth Place, ainsi que l’imagerie mammaire et l’imagerie pour la santé des femmes. The Women’s Medical Center à Gretna (515 Westbank Expy., 504-366-7233) est un autre point d’accès pour les visites en santé des femmes.</p><p>Clinique d’OB/GYN : 1111 Medical Center Blvd., bureau S-250 — 504-349-6945. Centre d’imagerie pour les femmes et de soins du sein : 4521 Westbank Expressway — 504-349-6300.</p><p>Voir aussi <a href="/West-Jefferson-Medical-Center/Our-Services/The-Family-Birth-Place">The Family Birth Place</a>. <a href="/Find-a-Provider">Trouver un fournisseur de soins pour la santé des femmes</a>.</p>

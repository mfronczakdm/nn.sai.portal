      Hint: Detail
      Value: |
        <h2>Intervention rapide en cas d’AVC</h2><p>West Jefferson Medical Center est désigné Comprehensive Stroke Center par la Joint Commission. Les équipes d’urgence, les spécialistes en neurosciences et le personnel de réadaptation travaillent ensemble dès les premiers symptômes jusqu’au rétablissement.</p><p>Si vous soupçonnez un AVC, composez le 911. Ne vous rendez pas à l’hôpital par vos propres moyens. Pour toute question non urgente sur les services liés aux AVC, appelez l’hôpital au 504-347-5511. En savoir plus sur le <a href="/Our-Services/Neuroscience-Institute-at-LCMC-Health">Neuroscience Institute de LCMC Health</a>.</p>

      Hint: Detail
      Value: |
        <h2>Fast stroke response</h2><p>West Jefferson Medical Center is designated a Comprehensive Stroke Center by The Joint Commission. Emergency teams, neuroscience specialists, and rehabilitation staff work together from first symptoms through recovery.</p><p>If you suspect a stroke, call 911. Do not drive yourself. For non-emergency questions about stroke services, call the hospital at 504-347-5511. Learn more about the <a href="/Our-Services/Neuroscience-Institute-at-LCMC-Health">LCMC Health Neuroscience Institute</a>.</p>

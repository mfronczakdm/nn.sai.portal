      Hint: Detail
      Value: |
        <h2>Respuesta rápida ante un accidente cerebrovascular</h2><p>West Jefferson Medical Center está designado como Centro Integral de Accidentes Cerebrovasculares por The Joint Commission. Los equipos de emergencias, los especialistas en neurociencias y el personal de rehabilitación trabajan juntos desde los primeros síntomas hasta la recuperación.</p><p>Si sospecha de un accidente cerebrovascular, llame al 911. No conduzca usted mismo. Para preguntas no urgentes sobre los servicios para accidentes cerebrovasculares, llame al hospital al 504-347-5511. Obtenga más información sobre el <a href="/Our-Services/Neuroscience-Institute-at-LCMC-Health">Instituto de Neurociencias de LCMC Health</a>.</p>

      Hint: Detail
      Value: |
        <h2>Gastroenterología para la salud digestiva diaria</h2><p>Cuando las comidas provocan dolor, reflujo, distensión abdominal o malestar estomacal continuo, los especialistas digestivos de West Jefferson Medical Center pueden evaluar el esófago, el estómago, el hígado, el páncreas, la vesícula biliar y los intestinos.</p><p>El hospital cuenta con un centro de endoscopia independiente con estacionamiento exclusivo, seis salas de procedimientos y salas privadas de recuperación para que las visitas de colonoscopia y endoscopia sean más fáciles para los pacientes y sus familias. Llame al <strong>504-349-6401</strong> o al hospital al 504-347-5511 para hablar sobre una remisión.</p><p><a href="/Find-a-Provider">Encontrar un gastroenterólogo</a></p>

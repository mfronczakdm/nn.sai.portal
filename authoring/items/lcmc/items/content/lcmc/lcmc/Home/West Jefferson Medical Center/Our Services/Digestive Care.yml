      Hint: Detail
      Value: |
        <h2>Gastroentérologie pour la santé digestive au quotidien</h2><p>Quand les repas entraînent de la douleur, du reflux, des ballonnements ou des troubles d’estomac persistants, les spécialistes en santé digestive du West Jefferson Medical Center peuvent évaluer l’œsophage, l’estomac, le foie, le pancréas, la vésicule biliaire et les intestins.</p><p>L’hôpital exploite un centre d’endoscopie autonome avec stationnement réservé, six salles d’intervention et des salles de récupération privées afin de faciliter les visites pour coloscopie et endoscopie des patients et de leurs familles. Appelez au <strong>504-349-6401</strong> ou l’hôpital au 504-347-5511 pour discuter d’une recommandation.</p><p><a href="/Find-a-Provider">Trouver un gastroentérologue</a></p>

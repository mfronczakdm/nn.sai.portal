      Hint: Detail
      Value: |
        <h2>Gastroenterology for everyday gut health</h2><p>When meals lead to pain, reflux, bloating, or ongoing stomach trouble, digestive specialists at West Jefferson Medical Center can evaluate the esophagus, stomach, liver, pancreas, gallbladder, and intestines.</p><p>The hospital operates a stand-alone endoscopy center with dedicated parking, six procedure rooms, and private recovery rooms so colonoscopy and endoscopy visits are easier for patients and families. Call <strong>504-349-6401</strong> or the hospital at 504-347-5511 to discuss a referral.</p><p><a href="/Find-a-Provider">Find a gastroenterologist</a></p>

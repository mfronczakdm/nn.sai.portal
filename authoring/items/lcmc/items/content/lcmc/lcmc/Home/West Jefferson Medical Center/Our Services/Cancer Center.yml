      Hint: Detail
      Value: |
        <h2>Soins contre le cancer près de la Westbank</h2><p>Le West Jefferson Medical Center offre un programme complet de soins contre le cancer aux patients qui souhaitent recevoir leur traitement sans quitter la paroisse de Jefferson. Les bâtiments dédiés au cancer sur la Westbank Expressway comprennent la perfusion, la radiothérapie — le seul service de radiothérapie sur la Westbank — et un environnement conçu pour les visites plus longues, avec des fauteuils inclinables, le Wi-Fi et des aires de collation pour les patients et les proches aidants.</p><p>Le programme comprend les soins palliatifs, la planification de la survie et l’accès à des essais cliniques. Les technologies offertes à l’équipe comprennent la TEP/TDM, la mammographie numérique et la chirurgie robotisée avec le système da Vinci lorsque c’est l’approche appropriée.</p><h3>Où aller</h3><ul><li><strong>Centre du cancer :</strong> 4513 Westbank Expy., Marrero, LA 70072</li><li><strong>Perfusion :</strong> 4511 Westbank Expy., Marrero, LA 70072</li><li><strong>Téléphone :</strong> 504-349-6360</li></ul><p>Appelez l’équipe de soins contre le cancer pour prendre rendez-vous ou demander une conversation pour obtenir un deuxième avis. Trouvez des oncologues par l’entremise de <a href="/Find-a-Provider">Find a Provider</a>.</p>

      Hint: Detail
      Value: |
        <h2>Atención oncológica cerca de Westbank</h2><p>West Jefferson Medical Center ofrece un programa integral de cáncer para pacientes que desean tratamiento sin salir de Jefferson Parish. Los edificios dedicados al cáncer en Westbank Expressway incluyen infusión, radioterapia — el único departamento de radioterapia en Westbank — y un entorno diseñado para visitas más largas, con sillas reclinables, Wi-Fi y estaciones de refrigerio para pacientes y cuidadores.</p><p>El programa incluye cuidados paliativos, planificación de supervivencia y acceso a ensayos clínicos. La tecnología disponible para el equipo incluye PET/CT, mamografía digital y cirugía robótica con el sistema da Vinci cuando es el enfoque adecuado.</p><h3>A dónde ir</h3><ul><li><strong>Centro de Cáncer:</strong> 4513 Westbank Expy., Marrero, LA 70072</li><li><strong>Infusión:</strong> 4511 Westbank Expy., Marrero, LA 70072</li><li><strong>Teléfono:</strong> 504-349-6360</li></ul><p>Llame al equipo de atención oncológica para programar una visita o una conversación para una segunda opinión. Encuentre oncólogos a través de <a href="/Find-a-Provider">Find a Provider</a>.</p>

      Hint: Detail
      Value: |
        <h2>Cancer care close to the Westbank</h2><p>West Jefferson Medical Center offers a comprehensive cancer program for patients who want treatment without leaving Jefferson Parish. The dedicated cancer buildings on Westbank Expressway include infusion, radiation therapy — the only radiation therapy department on the Westbank — and a setting designed for longer visits, with reclining chairs, Wi-Fi, and nourishment stations for patients and caregivers.</p><p>The program includes palliative care, survivorship planning, and access to clinical trials. Technology available to the team includes PET/CT, digital mammography, and robotic surgery with the da Vinci system when it is the right approach.</p><h3>Where to go</h3><ul><li><strong>Cancer Center:</strong> 4513 Westbank Expy., Marrero, LA 70072</li><li><strong>Infusion:</strong> 4511 Westbank Expy., Marrero, LA 70072</li><li><strong>Phone:</strong> 504-349-6360</li></ul><p>Call the cancer care team to schedule a visit or a second-opinion conversation. Find oncologists through <a href="/Find-a-Provider">Find a Provider</a>.</p>

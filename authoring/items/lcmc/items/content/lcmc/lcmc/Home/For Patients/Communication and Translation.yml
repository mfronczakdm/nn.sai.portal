    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Communication et traduction</h2><p>Le University Medical Center New Orleans fournit gratuitement des interprètes en langue des signes et des interprètes oraux, l’accès TTY et d’autres aides à la communication appropriées.</p><p>Les patients qui préfèrent une langue autre que l’anglais peuvent demander des services d’interprétation et de traduction en temps opportun auprès de n’importe quel membre du personnel ou en appelant au 504-702-3000.</p><p>L’équipe de l’expérience patient peut également aider à traiter les griefs liés à l’accès linguistique ou à la discrimination.</p>"

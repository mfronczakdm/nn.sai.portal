    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Communication and translation</h2><p>University Medical Center New Orleans provides sign-language and oral interpreters, TTY access, and other appropriate communication aids at no charge.</p><p>Patients who prefer a language other than English can request timely interpretation and translation services through any staff member or by calling 504-702-3000.</p><p>The Patient Experience team can also help with grievances related to language access or discrimination.</p>"

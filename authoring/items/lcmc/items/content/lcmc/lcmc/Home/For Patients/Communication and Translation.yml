    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Comunicación y traducción</h2><p>University Medical Center New Orleans ofrece intérpretes de lenguaje de señas y de interpretación oral, acceso TTY y otras ayudas de comunicación apropiadas sin costo.</p><p>Los pacientes que prefieren un idioma distinto del inglés pueden solicitar servicios oportunos de interpretación y traducción a través de cualquier miembro del personal o llamando al 504-702-3000.</p><p>El equipo de Experiencia del Paciente también puede ayudar con quejas relacionadas con el acceso al idioma o la discriminación.</p>"

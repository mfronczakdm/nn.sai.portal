    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Diagnostic imaging across the campus</h2><p>West Jefferson Medical Center Imaging serves inpatients, emergency patients, and outpatients in the hospital, the Physician’s Office Building, and the Medical Plaza on Westbank Expressway. Inpatient and ER imaging run 24/7. Outpatient centers offer MRI/MRA, 3T MRI, ultrasound, 3D mammography, CT, DEXA, and X-ray in a filmless PACS environment.</p><p>Women’s Imaging and Breast Care Center: 4521 Westbank Expressway, Marrero — 504-349-6300. Physician Office Building imaging: 1111 Medical Center Blvd., Suite N-108 — 504-349-6191.</p><p>Ask your physician to order imaging, or call the numbers above to schedule an outpatient exam.</p>"

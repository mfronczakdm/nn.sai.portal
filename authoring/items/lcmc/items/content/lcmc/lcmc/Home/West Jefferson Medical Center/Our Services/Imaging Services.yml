    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Imagerie diagnostique sur tout le campus</h2><p>Le service d’imagerie du centre médical West Jefferson sert les patients hospitalisés, les patients à l’urgence et les patients externes à l’hôpital, dans l’immeuble de cabinets médicaux et au Medical Plaza sur la Westbank Expressway. L’imagerie pour les patients hospitalisés et à l’urgence est offerte 24 h sur 24, 7 jours sur 7. Les centres externes offrent l’IRM/ARM, l’IRM 3T, l’échographie, la mammographie 3D, la TDM, la DEXA et la radiographie dans un environnement PACS sans pellicule.</p><p>Centre d’imagerie pour femmes et de soins du sein : 4521 Westbank Expressway, Marrero — 504-349-6300. Imagerie de l’immeuble de cabinets médicaux : 1111 Medical Center Blvd., bureau N-108 — 504-349-6191.</p><p>Demandez à votre médecin de prescrire une imagerie, ou appelez aux numéros ci-dessus pour planifier un examen externe.</p>"

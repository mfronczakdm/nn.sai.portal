    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Diagnóstico por imágenes en todo el campus</h2><p>West Jefferson Medical Center Imaging atiende a pacientes hospitalizados, pacientes de urgencias y pacientes ambulatorios en el hospital, el Edificio de Consultorios Médicos y la Plaza Médica en Westbank Expressway. Las imágenes para pacientes hospitalizados y de urgencias funcionan las 24 horas, los 7 días de la semana. Los centros ambulatorios ofrecen MRI/MRA, resonancia magnética 3T, ecografía, mamografía 3D, CT, DEXA y rayos X en un entorno PACS sin película.</p><p>Centro de Diagnóstico para la Mujer y Cuidado de los Senos: 4521 Westbank Expressway, Marrero — 504-349-6300. Diagnóstico por imágenes del Edificio de Consultorios Médicos: 1111 Medical Center Blvd., Suite N-108 — 504-349-6191.</p><p>Pídale a su médico que ordene el estudio por imágenes o llame a los números anteriores para programar un examen ambulatorio.</p>"

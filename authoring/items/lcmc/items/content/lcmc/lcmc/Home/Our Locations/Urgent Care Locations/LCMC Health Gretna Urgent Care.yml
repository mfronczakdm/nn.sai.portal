      Hint: Detail
      Value: "<h2>Soins urgents Gretna de LCMC Health</h2><p>La clinique de Gretna offre des soins sans rendez-vous pour les maladies et les blessures qui nécessitent une attention rapide, sans être des urgences.</p><p>Son emplacement sur la Westbank permet aux patients d’obtenir une évaluation locale et d’accéder au réseau élargi de LCMC Health lorsqu’un suivi est nécessaire.</p>"

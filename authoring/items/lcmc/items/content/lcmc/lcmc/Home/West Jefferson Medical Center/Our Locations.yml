        <h2>Campus hospitalier et cliniques de la rive ouest</h2><p>L’hôpital principal du West Jefferson Medical Center est situé au <strong>1101 Medical Center Blvd., Marrero, LA 70072</strong>. Le service des urgences est ouvert 24 h/24, 7 j/7. Téléphone principal : <strong>504-347-5511</strong>.</p><p>Ouvrez la page existante de l’hôpital pour les détails du campus, le stationnement et les renseignements aux visiteurs : <a href="/Our-Locations/West-Jefferson-Medical-Center">West Jefferson Medical Center (Our Locations)</a>.</p><p>Pour parcourir tous les établissements de LCMC Health et filtrer par la catégorie West Jefferson Medical Center, utilisez le répertoire du réseau : <a href="/Our-Locations">LCMC Health Our Locations</a>. Cette liste comprend déjà le campus de Marrero ainsi que des cliniques affiliées comme l’ENT au 1111 Medical Center Blvd. Suite N-707, le Cancer Center sur Westbank Expressway, les soins primaires à Algiers, Harvey et Terrytown, ainsi que The Family Birth Place.</p><p>Les dossiers des cliniques se trouvent dans des données de localisation partagées et ne sont pas dupliqués sur ce microsite. Les auteurs doivent continuer à modifier les renseignements sur les lieux dans les éléments de localisation existants — cette page est le carrefour de répertoire destiné à l’hôpital.</p>

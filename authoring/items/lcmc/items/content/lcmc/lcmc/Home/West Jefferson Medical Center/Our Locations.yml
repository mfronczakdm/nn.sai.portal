        <h2>Campus del hospital y clínicas de Westbank</h2><p>El hospital principal de West Jefferson Medical Center está en <strong>1101 Medical Center Blvd., Marrero, LA 70072</strong>. El departamento de emergencias está abierto las 24 horas, los 7 días de la semana. Teléfono principal: <strong>504-347-5511</strong>.</p><p>Abra la página existente del hospital para ver detalles del campus, estacionamiento y notas para visitantes: <a href="/Our-Locations/West-Jefferson-Medical-Center">West Jefferson Medical Center (Our Locations)</a>.</p><p>Para explorar todos los centros de LCMC Health y filtrar por la categoría West Jefferson Medical Center, use el directorio del sistema: <a href="/Our-Locations">LCMC Health Our Locations</a>. Ese listado ya incluye el campus de Marrero, además de clínicas afiliadas como ENT en 1111 Medical Center Blvd. Suite N-707, el Cancer Center en Westbank Expressway, atención primaria en Algiers, Harvey y Terrytown, y The Family Birth Place.</p><p>Los registros de las clínicas se encuentran en datos compartidos de ubicaciones y no se duplican en este micrositio. Los autores deben seguir editando la información de ubicación en los elementos de ubicación existentes; esta página es el centro de directorio del hospital.</p>

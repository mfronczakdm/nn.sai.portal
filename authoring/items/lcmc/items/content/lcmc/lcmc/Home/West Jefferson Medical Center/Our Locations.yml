      Hint: Detail
      Value: |
        <h2>Hospital campus and Westbank clinics</h2><p>West Jefferson Medical Center’s main hospital is at <strong>1101 Medical Center Blvd., Marrero, LA 70072</strong>. The emergency department is open 24/7. Main phone: <strong>504-347-5511</strong>.</p><p>Open the existing hospital page for campus details, parking, and visitor notes: <a href="/Our-Locations/West-Jefferson-Medical-Center">West Jefferson Medical Center (Our Locations)</a>.</p><p>To browse every LCMC Health site and filter by the West Jefferson Medical Center category, use the system directory: <a href="/Our-Locations">LCMC Health Our Locations</a>. That listing already includes the Marrero campus plus affiliated clinics such as ENT at 1111 Medical Center Blvd. Suite N-707, the Cancer Center on Westbank Expressway, primary care in Algiers, Harvey, and Terrytown, and The Family Birth Place.</p><p>Clinic records live in shared location data and are not duplicated on this microsite. Authors should keep editing location facts on the existing location items — this page is the hospital-facing directory hub.</p>

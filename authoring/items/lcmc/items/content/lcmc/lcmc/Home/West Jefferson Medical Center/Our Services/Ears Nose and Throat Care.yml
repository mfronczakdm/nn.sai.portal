      Value: |
        <h2>Otorrinolaringología en Westbank</h2><p>El Departamento de Otorrinolaringología — Cirugía de Cabeza y Cuello de West Jefferson Medical Center atiende afecciones del oído, la nariz y la garganta en todas las etapas de la vida. Los pacientes acuden aquí por infecciones recurrentes, obstrucción nasal, problemas de la voz y la deglución, apnea del sueño, lesiones faciales y enfermedades de la tiroides o las paratiroides.</p><p>Ya sea por una enfermedad aguda, una afección sinusal crónica o la evaluación de una masa en el cuello, el equipo de ORL trabaja para diagnosticar la causa y adaptar el tratamiento a los objetivos de cada paciente, desde manejo médico hasta procedimientos en el consultorio y cirugía cuando es la mejor opción.</p><h3>Cómo programar una cita</h3><p>Llame a la clínica de ORL de West Jefferson al <strong>504-934-8550</strong> para programar, o <a href="/Find-a-Provider">encuentre un otorrinolaringólogo en el directorio de proveedores de LCMC Health</a>.</p><p><strong>West Jefferson Medical Center Ear, Nose &amp; Throat</strong><br/>1111 Medical Center Blvd., Suite N-707<br/>Marrero, LA 70072<br/>Teléfono: 504-934-8550</p><h3>Afecciones que tratamos</h3><p>Las razones más comunes por las que los pacientes son remitidos a ORL en West Jefferson incluyen:</p><ul><li>Infecciones recurrentes del oído, pérdida de audición, tinnitus y problemas de equilibrio</li><li>Sinusitis crónica, pólipos nasales, rinitis alérgica y obstrucción nasal</li><li>Amigdalitis, ronquidos, apnea obstructiva del sueño y dificultad para la voz o la deglución</li><li>Nódulos y tumores tiroideos, enfermedad de las paratiroides y masas en el cuello</li><li>Lesiones faciales y necesidades seleccionadas de tipo cosmético o reconstructivo de la cara y los párpados</li></ul><h3>Tratamientos y procedimientos</h3><p>Los planes de atención comienzan con un examen dirigido y, cuando es necesario, endoscopia o imágenes en el consultorio. Se usa tratamiento médico siempre que pueda controlar los síntomas. Cuando los procedimientos son apropiados, el equipo ofrece una variedad de operaciones de oído, nariz, garganta y cuello, entre ellas:</p><h4>Oído</h4><p>Evaluación y tratamiento de infecciones, audición y otras afecciones relacionadas con el oído, en coordinación con audiología cuando las pruebas hacen parte del estudio.</p><h4>Nariz</h4><p>Opciones médicas y quirúrgicas para enfermedad sinusal, pólipos y obstrucción nasal, con el objetivo de restaurar la respiración y reducir infecciones repetidas.</p><h4>Garganta</h4><p>Atención para enfermedades de amígdalas y adenoides, ronquidos y apnea del sueño, y trastornos de la voz o la deglución, incluidos procedimientos cuando la atención conservadora no es suficiente.</p><h4>Cuello y cara</h4><ul><li>Tiroidectomía y paratiroidectomía</li><li>Disección de cuello y escisión del conducto tirogloso</li><li>Suspensión hioidea para problemas seleccionados de la vía aérea relacionados con el sueño</li><li>Blefaroplastia y Botox terapéutico cuando está clínicamente indicado</li></ul><h3>Qué puede esperar</h3><p>Traiga una lista de medicamentos, imágenes previas o estudios del sueño, y preguntas sobre el tiempo de recuperación. Si se recomienda cirugía, su cirujano revisará los beneficios, los riesgos y los cuidados posteriores antes de que usted decida. Para conocer el parqueadero del campus hospitalario y los horarios de visita, consulte <a href="/West-Jefferson-Medical-Center/Patients-and-Visitors">Patients &amp; Visitors</a>.</p><p>Esta página es la superficie de demostración de ORL: actualice la introducción, el teléfono de citas o la lista de tratamientos en Pages para mostrar a los autores cómo se mantiene el contenido de especialidades hospitalarias.</p>

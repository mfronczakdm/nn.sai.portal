        <h2>Oto-rhino-laryngologie sur la rive ouest</h2><p>Le service d’oto-rhino-laryngologie — chirurgie cervico-faciale du West Jefferson Medical Center prend en charge les affections de l’oreille, du nez et de la gorge à tous les âges de la vie. Les patients consultent ici pour des infections récurrentes, une obstruction nasale, des troubles de la voix et de la déglutition, l’apnée du sommeil, des blessures au visage, ou une maladie de la thyroïde ou des parathyroïdes.</p><p>Qu’il s’agisse d’une maladie aiguë, d’une sinusite chronique ou de l’évaluation d’une masse au cou, l’équipe ORL s’efforce de poser un diagnostic précis et d’adapter le traitement aux objectifs de chaque patient — de la prise en charge médicale aux interventions au cabinet et à la chirurgie lorsque c’est la meilleure option.</p><h3>Comment prendre rendez-vous</h3><p>Appelez la clinique ORL de West Jefferson au <strong>504-934-8550</strong> pour prendre rendez-vous, ou <a href="/Find-a-Provider">trouvez un oto-rhino-laryngologiste dans le répertoire des fournisseurs de LCMC Health</a>.</p><p><strong>West Jefferson Medical Center Ear, Nose &amp; Throat</strong><br/>1111 Medical Center Blvd., Suite N-707<br/>Marrero, LA 70072<br/>Téléphone : 504-934-8550</p><h3>Affections que nous traitons</h3><p>Voici quelques motifs fréquents d’orientation vers le service ORL à West Jefferson :</p><ul><li>Infections de l’oreille récurrentes, perte auditive, acouphènes et troubles de l’équilibre</li><li>Sinusite chronique, polypes nasaux, rhinite allergique et obstruction nasale</li><li>Amygdalite, ronflement, apnée obstructive du sommeil, et troubles de la voix ou de la déglutition</li><li>Nodules et tumeurs de la thyroïde, maladie des parathyroïdes et masses au cou</li><li>Blessures au visage et certains besoins esthétiques ou reconstructeurs du visage et des paupières</li></ul><h3>Traitements et interventions</h3><p>Les plans de soins commencent par un examen ciblé et, au besoin, une endoscopie au cabinet ou une imagerie. Un traitement médical est utilisé chaque fois qu’il permet de contrôler les symptômes. Lorsque des interventions sont appropriées, l’équipe offre une gamme d’opérations de l’oreille, du nez, de la gorge et du cou, y compris :</p><h4>Oreille</h4><p>Évaluation et traitement des infections, de l’audition et d’autres affections de l’oreille, en coordination avec l’audiologie lorsque des tests font partie de l’évaluation.</p><h4>Nez</h4><p>Options médicales et chirurgicales pour les maladies des sinus, les polypes et l’obstruction nasale, visant à rétablir la respiration et à réduire les infections répétées.</p><h4>Gorge</h4><p>Soins pour les maladies des amygdales et des adénoïdes, le ronflement et l’apnée du sommeil, ainsi que les troubles de la voix ou de la déglutition, y compris des interventions lorsque les soins conservateurs ne suffisent pas.</p><h4>Cou et visage</h4><ul><li>Thyroïdectomie et parathyroïdectomie</li><li>Curage ganglionnaire cervical et exérèse du canal thyréoglosse</li><li>Suspension de l’os hyoïde pour certains problèmes des voies respiratoires liés au sommeil</li><li>Blépharoplastie et Botox thérapeutique lorsque cela est indiqué sur le plan clinique</li></ul><h3>À quoi s’attendre</h3><p>Apportez une liste de vos médicaments, toute imagerie antérieure ou étude du sommeil, ainsi que vos questions sur le temps de rétablissement. Si une chirurgie est recommandée, votre chirurgien passera en revue les avantages, les risques et les soins après l’intervention avant que vous preniez votre décision. Pour le stationnement sur le campus hospitalier et les heures de visite, consultez <a href="/West-Jefferson-Medical-Center/Patients-and-Visitors">Patients &amp; Visitors</a>.</p><p>Cette page est la surface de démonstration ORL : mettez à jour l’introduction, le numéro de téléphone pour les rendez-vous ou la liste des traitements dans Pages pour montrer aux auteurs comment le contenu des spécialités hospitalières est maintenu.</p>

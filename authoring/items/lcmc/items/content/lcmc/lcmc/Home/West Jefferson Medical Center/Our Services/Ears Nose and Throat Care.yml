        <h2>Otolaryngology on the Westbank</h2><p>The Department of Otolaryngology — Head and Neck Surgery at West Jefferson Medical Center cares for ear, nose, and throat conditions across the lifespan. Patients come here for recurring infections, nasal blockage, voice and swallowing problems, sleep apnea, facial injury, and thyroid or parathyroid disease.</p><p>Whether the need is an acute illness, a chronic sinus condition, or evaluation of a neck mass, the ENT team works to diagnose the cause and match treatment to each patient’s goals — from medical management to in-office procedures and surgery when it is the better option.</p><h3>How to make an appointment</h3><p>Call the West Jefferson ENT clinic at <strong>504-934-8550</strong> to schedule, or <a href="/Find-a-Provider">find an otolaryngologist in the LCMC Health provider directory</a>.</p><p><strong>West Jefferson Medical Center Ear, Nose &amp; Throat</strong><br/>1111 Medical Center Blvd., Suite N-707<br/>Marrero, LA 70072<br/>Phone: 504-934-8550</p><h3>Conditions we treat</h3><p>Common reasons patients are referred to ENT at West Jefferson include:</p><ul><li>Recurring ear infections, hearing loss, tinnitus, and balance concerns</li><li>Chronic sinusitis, nasal polyps, allergic rhinitis, and nasal obstruction</li><li>Tonsillitis, snoring, obstructive sleep apnea, and voice or swallowing difficulty</li><li>Thyroid nodules and tumors, parathyroid disease, and neck masses</li><li>Facial injury and selected cosmetic or reconstructive needs of the face and eyelids</li></ul><h3>Treatments and procedures</h3><p>Care plans start with a focused exam and, when needed, in-office endoscopy or imaging. Medical therapy is used whenever it can control symptoms. When procedures are appropriate, the team offers a range of ear, nose, throat, and neck operations, including:</p><h4>Ear</h4><p>Evaluation and treatment for infection, hearing, and related ear conditions, coordinated with audiology when testing is part of the workup.</p><h4>Nose</h4><p>Medical and surgical options for sinus disease, polyps, and nasal obstruction, aimed at restoring breathing and reducing repeat infections.</p><h4>Throat</h4><p>Care for tonsil and adenoid disease, snoring and sleep apnea, and voice or swallowing disorders, including procedures when conservative care is not enough.</p><h4>Neck and face</h4><ul><li>Thyroidectomy and parathyroidectomy</li><li>Neck dissection and thyroglossal duct excision</li><li>Hyoid suspension for selected sleep-related airway problems</li><li>Blepharoplasty and therapeutic Botox when clinically indicated</li></ul><h3>What to expect</h3><p>Bring a list of medications, prior imaging or sleep studies, and questions about recovery time. If surgery is recommended, your surgeon will review benefits, risks, and after-care before you decide. For hospital campus parking and visitor hours, see <a href="/West-Jefferson-Medical-Center/Patients-and-Visitors">Patients &amp; Visitors</a>.</p><p>This page is the ENT demo surface: update the intro, appointment phone, or treatment list in Pages to show authors how hospital specialty content is maintained.</p>

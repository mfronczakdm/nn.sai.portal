        <h2>Transparencia de precios</h2><p>LCMC Health ofrece recursos de precios para ayudar a los pacientes a comprender los posibles costos antes de recibir atención.</p><p>Dado que la responsabilidad real depende de los servicios, la cobertura del seguro y las circunstancias individuales, los pacientes pueden usar las herramientas disponibles y comunicarse con el hospital correspondiente para recibir orientación adicional.</p><p><a href="https://www.lcmchealth.org/for-patients/financial-assistance/price-transparency/">Consulte los recursos de transparencia de precios</a></p>

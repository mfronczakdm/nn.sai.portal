      Hint: Detail
      Value: |
        <h2>Price transparency</h2><p>LCMC Health provides pricing resources to help patients understand possible costs before receiving care.</p><p>Because actual responsibility depends on services, insurance coverage, and individual circumstances, patients can use the available tools and contact the appropriate hospital for additional guidance.</p><p><a href="https://www.lcmchealth.org/for-patients/financial-assistance/price-transparency/">Review price transparency resources</a></p>

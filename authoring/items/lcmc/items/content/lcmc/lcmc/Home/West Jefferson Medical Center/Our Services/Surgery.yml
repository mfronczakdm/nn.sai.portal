      Hint: Detail
      Value: |
        <h2>Soins chirurgicaux à Marrero</h2><p>Les chirurgiens du West Jefferson Medical Center offrent des services de chirurgie générale et des soins surspécialisés, y compris en chirurgie colorectale, thyroïdienne, mammaire, laparoscopique, robotique, bariatrique et oncologique. L’équipe est reconnue dans la région pour la réparation des hernies et pour la formation d’autres chirurgiens à l’utilisation du robot da Vinci pour des interventions peu invasives.</p><p>Avant votre chirurgie, vous passerez en revue les avantages, les risques et le rétablissement avec votre chirurgien. Planification : 504-349-6713. Hôpital : 504-347-5511. <a href="/Find-a-Provider">Trouver un chirurgien</a>.</p>

      Hint: Detail
      Value: |
        <h2>Surgical care in Marrero</h2><p>West Jefferson Medical Center surgeons offer general surgery and subspecialty care including colorectal, thyroid, breast, laparoscopic, robotic, bariatric, and oncologic surgery. The team is known regionally for hernia repair and for teaching other surgeons to use the da Vinci robot for minimally invasive procedures.</p><p>Before surgery you will review benefits, risks, and recovery with your surgeon. Scheduling: 504-349-6713. Hospital: 504-347-5511. <a href="/Find-a-Provider">Find a surgeon</a>.</p>

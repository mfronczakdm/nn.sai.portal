      Value: |
        <h2>Atención quirúrgica en Marrero</h2><p>Los cirujanos de West Jefferson Medical Center ofrecen cirugía general y atención subespecializada, incluida cirugía colorrectal, de tiroides, de mama, laparoscópica, robótica, bariátrica y oncológica. El equipo es reconocido en la región por la reparación de hernias y por enseñar a otros cirujanos a usar el robot da Vinci para procedimientos mínimamente invasivos.</p><p>Antes de la cirugía, usted revisará con su cirujano los beneficios, riesgos y la recuperación. Programación: 504-349-6713. Hospital: 504-347-5511. <a href="/Find-a-Provider">Encuentre un cirujano</a>.</p>

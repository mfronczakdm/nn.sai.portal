      Hint: Detail
      Value: |
        <h2>Un médecin régulier près de chez vous</h2><p>Les médecins de soins primaires du West Jefferson Medical Center aident les patients à prévenir les maladies, à gérer les maladies chroniques et à coordonner les soins spécialisés. Les cliniques offrent des rendez-vous le jour même ou le lendemain, des visites en clinique et virtuelles, ainsi que des services d’analyses de laboratoire et d’imagerie sur place lorsque vous avez besoin de tests en un seul déplacement.</p><h3>Téléphones des cliniques</h3><ul><li>Médecine interne sur le campus (bureau S-850) : 504-349-6450</li><li>Lapalco / Harvey : 504-349-6900</li><li>Oakwood / Terrytown : 504-349-6925</li><li>Algiers : 504-368-4066</li><li>Manhattan / Harvey : 504-349-6930</li></ul><p>Après 17 h ou la fin de semaine, pensez à <a href="/Our-Services/Urgent-Care">LCMC Health Urgent Care</a>. <a href="/Find-a-Provider">Trouver un médecin de soins primaires</a>.</p>

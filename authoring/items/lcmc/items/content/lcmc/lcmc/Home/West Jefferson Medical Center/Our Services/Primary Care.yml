      Hint: Detail
      Value: |
        <h2>Un médico de confianza cerca de casa</h2><p>Los médicos de atención primaria de West Jefferson Medical Center ayudan a los pacientes a prevenir enfermedades, manejar afecciones crónicas y coordinar la atención especializada. Las clínicas ofrecen citas para el mismo día y el día siguiente, visitas en la clínica y virtuales, y laboratorio e imágenes en el lugar cuando necesita exámenes en una sola visita.</p><h3>Teléfonos de las clínicas</h3><ul><li>Medicina interna en el campus (Suite S-850): 504-349-6450</li><li>Lapalco / Harvey: 504-349-6900</li><li>Oakwood / Terrytown: 504-349-6925</li><li>Algiers: 504-368-4066</li><li>Manhattan / Harvey: 504-349-6930</li></ul><p>Después de las 5 p. m. o los fines de semana, considere <a href="/Our-Services/Urgent-Care">LCMC Health Urgent Care</a>. <a href="/Find-a-Provider">Encuentre un proveedor de atención primaria</a>.</p>

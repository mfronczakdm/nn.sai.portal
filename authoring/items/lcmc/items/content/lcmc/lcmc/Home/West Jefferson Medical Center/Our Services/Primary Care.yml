      Hint: Detail
      Value: |
        <h2>A regular doctor close to home</h2><p>West Jefferson Medical Center primary care physicians help patients prevent illness, manage chronic conditions, and coordinate specialty care. Clinics offer same- and next-day appointments, in-clinic and virtual visits, and on-site lab and imaging when you need testing in one trip.</p><h3>Clinic phones</h3><ul><li>Internal medicine on campus (Suite S-850): 504-349-6450</li><li>Lapalco / Harvey: 504-349-6900</li><li>Oakwood / Terrytown: 504-349-6925</li><li>Algiers: 504-368-4066</li><li>Manhattan / Harvey: 504-349-6930</li></ul><p>After 5 p.m. or on weekends, consider <a href="/Our-Services/Urgent-Care">LCMC Health Urgent Care</a>. <a href="/Find-a-Provider">Find a primary care provider</a>.</p>

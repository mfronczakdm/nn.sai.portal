      Value: <h2>Urgencias sin cita Kenner de LCMC Health</h2><p>La clínica de Kenner ofrece atención sin cita previa para enfermedades comunes y lesiones menores que requieren atención oportuna.</p><p>Los pacientes pueden recibir evaluación local y orientación sobre seguimiento con atención primaria, especializada o de emergencia cuando sea necesario.</p>

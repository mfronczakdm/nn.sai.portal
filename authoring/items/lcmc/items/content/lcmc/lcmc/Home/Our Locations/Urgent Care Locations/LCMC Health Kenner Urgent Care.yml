      Value: "<h2>Soins urgents LCMC Health de Kenner</h2><p>La clinique de Kenner offre des soins sans rendez-vous pour les maladies courantes et les blessures mineures qui nécessitent une attention rapide.</p><p>Les patients peuvent y recevoir une évaluation locale et des conseils concernant un suivi en soins primaires, en spécialité ou à l’urgence, au besoin.</p>"

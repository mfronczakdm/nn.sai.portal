      Value: |
        <h2>À propos de LCMC Health</h2><p>LCMC Health est un système de santé sans but lucratif établi à La Nouvelle-Orléans, axé sur les soins aux personnes et aux communautés partout en Louisiane et au-delà.</p><p>Ses hôpitaux, cliniques, médecins et membres de l’équipe mettent à profit leur connaissance du milieu et une approche centrée sur les personnes pour offrir des soins dans l’ensemble de la grande région de La Nouvelle-Orléans.</p><p><a href="https://www.lcmchealth.org/about-us/">En savoir plus sur LCMC Health</a></p>

        <h2>Acerca de LCMC Health</h2><p>LCMC Health es un sistema de salud sin ánimo de lucro con sede en Nueva Orleans, enfocado en cuidar a las personas y comunidades de Luisiana y más allá.</p><p>Sus hospitales, clínicas, médicos y miembros del equipo aportan conocimiento local y un enfoque centrado en las personas para la atención en toda el área metropolitana de Nueva Orleans.</p><p><a href="https://www.lcmchealth.org/about-us/">Conozca más sobre LCMC Health</a></p>

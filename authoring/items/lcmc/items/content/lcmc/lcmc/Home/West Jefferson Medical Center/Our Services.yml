        <h2>Hospital services on the Westbank</h2><p>West Jefferson Medical Center offers a full roster of hospital and clinic specialties for patients across Jefferson Parish and neighboring communities. Open a service page to learn what to expect and how to make an appointment.</p><p>Need a physician first? <a href="/Find-a-Provider">Search LCMC Health providers</a>. For the Marrero campus address and hours, see the <a href="/Our-Locations/West-Jefferson-Medical-Center">West Jefferson Medical Center location page</a>.</p><h3>All services</h3><ul><li><a href="/West-Jefferson-Medical-Center/Our-Services/Cancer-Center">Cancer Center</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Centro-Hispano-de-Salud">Centro Hispano de Salud</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Digestive-Care">Digestive Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">Ears, Nose &amp; Throat Care</a> (demo page)</li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Emergency-Care">Emergency Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Heart-and-Vascular-Care">Heart &amp; Vascular Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Hyperbaric">Hyperbaric</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Imaging-Services">Imaging Services</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Orthopedic-Care">Orthopedic Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Physical-Rehabilitation">Physical Rehabilitation</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Primary-Care">Primary Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Respiratory-Care">Respiratory Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Sleep-Care">Sleep Care</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Surgery">Surgery</a></li><li><a href="/West-Jefferson-Medica
        <h2>Servicios hospitalarios en Westbank</h2><p>West Jefferson Medical Center ofrece una gama completa de especialidades hospitalarias y clínicas para pacientes de Jefferson Parish y comunidades vecinas. Abra una página de servicio para conocer qué puede esperar y cómo programar una cita.</p><p>¿Necesita primero un médico? <a href="/Find-a-Provider">Busque proveedores de LCMC Health</a>. Para consultar la dirección y los horarios del campus de Marrero, vea la <a href="/Our-Locations/West-Jefferson-Medical-Center">página de ubicación de West Jefferson Medical Center</a>.</p><h3>Todos los servicios</h3><ul><li><a href="/West-Jefferson-Medical-Center/Our-Services/Cancer-Center">Centro de Cáncer</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Centro-Hispano-de-Salud">Centro Hispano de Salud</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Digestive-Care">Atención Digestiva</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">Atención de oídos, nariz y garganta</a> (página de demostración)</li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Emergency-Care">Atención de Emergencias</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Heart-and-Vascular-Care">Atención Cardíaca y Vascular</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Hyperbaric">Hiperbárica</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Imaging-Services">Servicios de Imágenes</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Orthopedic-Care">Atención Ortopédica</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Physical-Rehabilitation">Rehabilitación Física</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Primary-Care">Atención Primaria</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Respiratory-Care">Atención Respiratoria</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Sleep-Care">Atención del Sueño</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Surgery">Cirugía</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Stroke-Care">Atención de ACV</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/The-Family-Birth-Place">The Family Birth Place</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/The-Hispanic-Health-Center">The Hispanic Health Center</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Urology">Urología</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Womens-Health">Salud de la Mujer</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Wound-Care">Cuidado de Heridas</a></li></ul>

        <h2>Services hospitaliers sur la rive ouest</h2><p>West Jefferson Medical Center offre une gamme complète de spécialités hospitalières et cliniques aux patients de la paroisse de Jefferson et des communautés voisines. Ouvrez une page de service pour savoir à quoi vous attendre et comment prendre rendez-vous.</p><p>Vous avez d’abord besoin d’un médecin? <a href="/Find-a-Provider">Recherchez les fournisseurs de soins de LCMC Health</a>. Pour l’adresse du campus de Marrero et les heures d’ouverture, consultez la <a href="/Our-Locations/West-Jefferson-Medical-Center">page d’emplacement de West Jefferson Medical Center</a>.</p><h3>Tous les services</h3><ul><li><a href="/West-Jefferson-Medical-Center/Our-Services/Cancer-Center">Centre du cancer</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Centro-Hispano-de-Salud">Centro Hispano de Salud</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Digestive-Care">Soins digestifs</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Ears-Nose-and-Throat-Care">Soins des oreilles, du nez et de la gorge</a> (page démo)</li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Emergency-Care">Soins d’urgence</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Heart-and-Vascular-Care">Soins cardiaques et vasculaires</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Hyperbaric">Hyperbare</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Imaging-Services">Services d’imagerie</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Orthopedic-Care">Soins orthopédiques</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Physical-Rehabilitation">Réadaptation physique</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Primary-Care">Soins primaires</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Respiratory-Care">Soins respiratoires</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Sleep-Care">Soins du sommeil</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Surgery">Chirurgie</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Stroke-Care">Soins de l’AVC</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/The-Family-Birth-Place">Centre familial de naissance</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/The-Hispanic-Health-Center">The Hispanic Health Center</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Urology">Urologie</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Womens-Health">Santé des femmes</a></li><li><a href="/West-Jefferson-Medical-Center/Our-Services/Wound-Care">Soins des plaies</a></li></ul>

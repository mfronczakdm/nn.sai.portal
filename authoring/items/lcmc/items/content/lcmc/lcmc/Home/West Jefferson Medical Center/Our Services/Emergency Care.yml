    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Cuando cada minuto cuenta</h2><p>El Departamento de Emergencias del West Jefferson Medical Center está abierto las 24 horas del día para enfermedades y lesiones graves. Médicos de emergencias certificados por la junta atienden a niños, adultos y adultos mayores, incluidas áreas dedicadas que apoyan la atención geriátrica de emergencia.</p><p>Fast Track está disponible de 11:00 a. m. a 11:00 p. m. todos los días para necesidades de menor gravedad. Durante una visita, los pacientes pueden recibir actualizaciones en tiempo real en su teléfono para saber qué sigue en la sala de emergencias.</p><p><strong>Dirección:</strong> 1101 Medical Center Blvd., Marrero, LA 70072<br/><strong>Hospital principal:</strong> 504-347-5511<br/>Para emergencias que ponen en riesgo la vida, llame al 911.</p>"

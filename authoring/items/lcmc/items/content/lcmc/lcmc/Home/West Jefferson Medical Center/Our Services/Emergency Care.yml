    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>Quand chaque minute compte</h2><p>Le service d’urgence du West Jefferson Medical Center est ouvert 24 heures sur 24 pour les maladies et blessures graves. Des médecins urgentologues certifiés traitent les enfants, les adultes et les aînés, y compris dans des espaces dédiés qui soutiennent les soins d’urgence gériatriques.</p><p>Le service Fast Track est offert tous les jours de 11 h à 23 h pour les besoins moins urgents. Pendant la visite, les patients peuvent recevoir des mises à jour en temps réel sur leur téléphone pour savoir ce qui les attend ensuite à l’urgence.</p><p><strong>Adresse :</strong> 1101 Medical Center Blvd., Marrero, LA 70072<br/><strong>Hôpital principal :</strong> 504-347-5511<br/>En cas d’urgence mettant la vie en danger, composez le 911.</p>"

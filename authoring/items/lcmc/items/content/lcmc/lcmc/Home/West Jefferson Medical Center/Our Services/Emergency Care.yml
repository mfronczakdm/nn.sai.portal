    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: "<h2>When every minute matters</h2><p>The West Jefferson Medical Center Emergency Department is open 24 hours a day for serious illness and injury. Board-certified emergency physicians treat children, adults, and seniors, including dedicated spaces that support geriatric emergency care.</p><p>Fast Track is available 11:00 a.m.–11:00 p.m. daily for lower-acuity needs. During a visit, patients can receive real-time updates on their phone so they know what comes next in the ER.</p><p><strong>Address:</strong> 1101 Medical Center Blvd., Marrero, LA 70072<br/><strong>Main hospital:</strong> 504-347-5511<br/>For life-threatening emergencies, call 911.</p>"

      Hint: Detail
      Value: |
        <h2>Portal del Paciente de LCMC Health</h2><p>El Portal del Paciente en línea gratuito les brinda a los pacientes acceso conveniente a su información médica y herramientas para la gestión de su atención.</p><p>Use el portal para revisar los registros de salud disponibles, comunicarse a través de las funciones compatibles y gestionar tareas de facturación elegibles desde una cuenta segura.</p><p><a href="/For-Patients/Patient-Appointments">Programe una cita</a> para una visita de control infantil, una consulta por enfermedad o una vacuna, y luego finalice el proceso a través de My LCMC Health o como invitado.</p><p><a href="https://www.lcmchealth.org/for-patients/patient-portal/">Acceda al Portal del Paciente</a></p>

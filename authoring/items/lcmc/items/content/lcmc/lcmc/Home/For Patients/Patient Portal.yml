      Hint: Detail
      Value: |
        <h2>Portail patient de LCMC Health</h2><p>Le Portail patient gratuit en ligne offre aux patients un accès pratique à leurs renseignements médicaux et à des outils de gestion des soins.</p><p>Utilisez le portail pour consulter les dossiers de santé accessibles, communiquer au moyen des fonctionnalités prises en charge et gérer les tâches de facturation admissibles à partir d’un seul compte sécurisé.</p><p><a href="/For-Patients/Patient-Appointments">Prendre un rendez-vous</a> pour une visite de suivi pour enfant, une consultation pour maladie ou un vaccin, puis finalisez le tout dans Mon LCMC Health ou comme invité.</p><p><a href="https://www.lcmchealth.org/for-patients/patient-portal/">Accéder au Portail patient</a></p>

      Hint: Detail
      Value: |
        <h2>LCMC Health Patient Portal</h2><p>The free online Patient Portal gives patients convenient access to their medical information and care-management tools.</p><p>Use the portal to review available health records, communicate through supported features, and manage eligible billing tasks from one secure account.</p><p><a href="/For-Patients/Patient-Appointments">Schedule an appointment</a> for a child well visit, sick visit, or vaccine, then finish through My LCMC Health or as a guest.</p><p><a href="https://www.lcmchealth.org/for-patients/patient-portal/">Access the Patient Portal</a></p>

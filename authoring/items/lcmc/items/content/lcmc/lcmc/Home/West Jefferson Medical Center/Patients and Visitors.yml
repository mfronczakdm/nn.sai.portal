    - ID: "a8a1dfcb-7dd5-4413-8789-db24a95e439f"
      Hint: Detail
      Value: |
        <h2>Renseignements pour les patients et les visiteurs</h2><p>Que vous veniez pour une intervention prévue ou pour rendre visite à un proche, le West Jefferson Medical Center est organisé pour rendre votre temps sur le campus plus simple et plus prévisible. L’hôpital de Marrero offre un café, une boutique-cadeaux, un service de voiturier en semaine et des soins d’urgence 24 h sur 24, 7 j sur 7.</p><h3>Heures d’ouverture</h3><ul><li><strong>Salle d’urgence :</strong> 24 heures sur 24, 7 jours sur 7</li><li><strong>Fast Track :</strong> 11 h 00 à 23 h 00, tous les jours</li><li><strong>Inscription ambulatoire, enregistrement chirurgical et admissions directes :</strong> 5 h 00 à 17 h 00, du lundi au vendredi</li><li><strong>Laboratoire ambulatoire :</strong> 6 h 00 à 17 h 00, du lundi au vendredi</li><li><strong>Centre d’imagerie pour femmes et de soins du sein :</strong> 8 h 00 à 16 h 30, du lundi au vendredi</li></ul><h3>Stationnement</h3><p>Le service de voiturier est offert de 8 h 00 à 17 h 00, du lundi au vendredi. Le voiturier gratuit est offert aux futures mamans et aux visiteurs de 65 ans et plus. Des stationnements de surface et un garage de stationnement entourent le campus de Medical Center Boulevard.</p><h3>Questions</h3><p>Appelez l’hôpital au <strong>504-347-5511</strong> ou la ligne d’information aux patients au <strong>504-380-0723</strong>. Pour les dossiers, la facturation et le portail patient, consultez les ressources du système sous <a href="/For-Patients">For Patients</a>.</p>

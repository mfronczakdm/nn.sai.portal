      Hint: Detail
      Value: |
        <h2>Patient and visitor information</h2><p>Whether you are coming for a scheduled procedure or visiting a loved one, West Jefferson Medical Center is set up to make time on campus more predictable. The Marrero hospital has a café, gift shop, valet parking on weekdays, and 24/7 emergency care.</p><h3>Hours of operation</h3><ul><li><strong>Emergency Room:</strong> 24 hours a day, 7 days a week</li><li><strong>Fast Track:</strong> 11:00 a.m.–11:00 p.m. daily</li><li><strong>Outpatient registration, surgical check-in, and direct admissions:</strong> 5:00 a.m.–5:00 p.m., Monday–Friday</li><li><strong>Outpatient lab:</strong> 6:00 a.m.–5:00 p.m., Monday–Friday</li><li><strong>Women’s Imaging and Breast Care Center:</strong> 8:00 a.m.–4:30 p.m., Monday–Friday</li></ul><h3>Parking</h3><p>Valet parking is available 8:00 a.m.–5:00 p.m., Monday–Friday. Complimentary valet is offered for moms-to-be and visitors 65 and older. Surface lots and garage parking surround the Medical Center Boulevard campus.</p><h3>Questions</h3><p>Call the hospital at <strong>504-347-5511</strong> or the patient information line at <strong>504-380-0723</strong>. For records, billing, and the patient portal, see system resources under <a href="/For-Patients">For Patients</a>.</p>

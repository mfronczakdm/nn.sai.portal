      Hint: Detail
      Value: |
        <h2>Información para pacientes y visitantes</h2><p>Ya sea que venga para un procedimiento programado o para visitar a un ser querido, West Jefferson Medical Center está preparado para hacer que su tiempo en el campus sea más predecible. El hospital de Marrero cuenta con cafetería, tienda de regalos, valet parking entre semana y atención de emergencias 24/7.</p><h3>Horarios de atención</h3><ul><li><strong>Sala de Emergencias:</strong> 24 horas al día, 7 días a la semana</li><li><strong>Fast Track:</strong> 11:00 a. m.–11:00 p. m. todos los días</li><li><strong>Registro ambulatorio, admisión para cirugía y admisiones directas:</strong> 5:00 a. m.–5:00 p. m., lunes a viernes</li><li><strong>Laboratorio ambulatorio:</strong> 6:00 a. m.–5:00 p. m., lunes a viernes</li><li><strong>Centro de Imágenes para la Mujer y Cuidado de los Senos:</strong> 8:00 a. m.–4:30 p. m., lunes a viernes</li></ul><h3>Estacionamiento</h3><p>El valet parking está disponible de 8:00 a. m. a 5:00 p. m., de lunes a viernes. El servicio de valet de cortesía se ofrece para futuras mamás y visitantes de 65 años o más. Los lotes de superficie y el estacionamiento en garaje rodean el campus de Medical Center Boulevard.</p><h3>Preguntas</h3><p>Llame al hospital al <strong>504-347-5511</strong> o a la línea de información para pacientes al <strong>504-380-0723</strong>. Para registros, facturación y el portal del paciente, consulte los recursos del sistema en <a href="/For-Patients">For Patients</a>.</p>

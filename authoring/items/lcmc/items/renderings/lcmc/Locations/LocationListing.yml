- ID: "17bb046a-a32a-41b3-8315-81217947611b"
  Hint: ComponentQuery
  Value: |
    query LocationListing($datasource: String!, $language: String!) {
      datasource: item(path: $datasource, language: $language) {
        id
        name
        children(first: 20) {
          results {
            id
            name
            url { path }
            locationTitle: field(name: "LocationTitle") { jsonValue }
            locationShortName: field(name: "LocationShortName") { jsonValue }
            locationType: field(name: "LocationType") { jsonValue }
            streetAddress: field(name: "StreetAddress") { jsonValue }
            city: field(name: "City") { jsonValue }
            state: field(name: "State") { jsonValue }
            postalCode: field(name: "PostalCode") { jsonValue }
            phoneNumber: field(name: "PhoneNumber") { jsonValue }
            latitude: field(name: "Latitude") { jsonValue }
            longitude: field(name: "Longitude") { jsonValue }
            landingPage: field(name: "LandingPage") { jsonValue }
          }
        }
      }
    }

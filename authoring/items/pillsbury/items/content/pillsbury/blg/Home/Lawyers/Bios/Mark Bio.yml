    - ID: "e854dce0-3a20-40db-b32e-9e223e599310"
      Hint: Biography
      Value: <p>Michael Akins maintains a broad real estate, financial services and corporate and commercial law practice. His work includes purchase and sale transactions, leasing, secured and debt financing, private financings, corporate reorganizations and amalgamations, and commercial agreements.</p><p>Prior to joining BLG, Michael articled and practised at a prominent Calgary law firm. He is a member of the Law Society of Alberta, the Canadian Bar Association, and the Calgary Bar Association, and volunteers with BLG Reads to Kids.</p>

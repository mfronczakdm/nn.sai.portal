    - ID: "e854dce0-3a20-40db-b32e-9e223e599310"
      Hint: Biography
      Value: "<p>John-Paul Alexandrowicz is an experienced school board lawyer and co-chair of BLG’s National School Boards Practice. Practising in both English and French, his work includes strategic advice and advocacy in arbitration, labour boards, human rights tribunals and the courts.</p><p>He has represented and advised almost every public, Catholic and francophone school board in Ontario, both directly and through their provincial associations, and has appeared at well over a thousand arbitrations and at the Ontario Labour Relations Board.</p>"

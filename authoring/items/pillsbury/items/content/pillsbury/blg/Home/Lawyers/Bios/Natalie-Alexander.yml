      Hint: Biography
      Value: "<p>Kendall Andersen practises commercial lending, bankruptcy, insolvency and restructuring, mergers and acquisitions, and commercial transactions. He regularly acts for financial institutions, borrowers and private lenders.</p><p>He also advises on corporate and commercial matters, including LNG projects and long-term terminal services agreements, and acts for debtors, creditors, trustees and monitors in CCAA and BIA proceedings. Kendall provides legal services through a Law Corporation.</p>"

    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Associate — Corporate Commercial (Toronto)</h2><p><em>Open role · People</em></p><p>BLG’s Toronto Corporate Commercial practice is hiring an associate to support public and private M&amp;A, capital markets, and governance matters. You will work on live deals with partners across our Canadian offices.</p><p><strong>What you’ll do:</strong></p><ul><li>Diligence, drafting, and closing support on domestic and cross-border deals</li><li>Coordinate with specialists in IP, financial services, and employment as deals require</li><li>Client-facing writing and deal-team collaboration</li></ul><p><strong>How to apply:</strong> Apply through Careers or contact Toronto recruiting for the Corporate Commercial associate class.</p>"

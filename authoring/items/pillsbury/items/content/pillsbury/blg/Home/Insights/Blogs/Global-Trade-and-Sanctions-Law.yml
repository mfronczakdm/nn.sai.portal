    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<p>Global Trade and Sanctions Law examines the fast-moving landscape of export controls, economic sanctions, customs, and international trade compliance. Pillsbury’s trade lawyers monitor OFAC, BIS, State, and allied-jurisdiction actions that affect cross-border operations, supply chains, and investment decisions.</p><p>Our commentary helps companies anticipate enforcement risk, structure compliant transactions, and respond when designations, licensing rules, or tariff measures change.</p>"

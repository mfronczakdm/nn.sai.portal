      Hint: Detail
      Value: "<h2>Summer Associate Program</h2><p><em>Careers · Students</em></p><p>BLG’s Summer Associate Program immerses law students in substantive work across our practices—corporate commercial, disputes, IP, financial services, and more. Summers work on live matters, attend trainings, and build relationships that lead to articling and associate opportunities.</p><p><strong>Why apply:</strong></p><ul><li>Hands-on assignments with mentoring partners and associates</li><li>Exposure to multiple practice groups and Canadian offices</li><li>Clear recruiting timeline and offer process</li></ul><p><strong>How to apply:</strong> Submit materials through Careers when the summer recruiting cycle opens.</p>"

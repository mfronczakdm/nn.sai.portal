    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Summer Associate Program</h2><p><em>Careers · Law students</em></p><p>Pillsbury’s Summer Associate Program immerses rising 2Ls and 3Ls in substantive work across our practices—corporate, litigation, IP, international trade, and more. Summers work on live matters, attend trainings, and build relationships that lead to full-time opportunities.</p><p><strong>Why apply:</strong></p><ul><li>Hands-on assignments with mentoring partners and associates</li><li>Exposure to multiple practice groups and offices</li><li>Clear recruiting timeline and offer process</li></ul><p><strong>How to apply:</strong> Submit materials through Careers when the summer recruiting cycle opens, or ask Pulse about summer associate timelines for your target city.</p>"

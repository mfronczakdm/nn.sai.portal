      Hint: Biography
      Value: <p>Duncan Ault is a partner in BLG’s Ottawa office whose practice focuses on civil litigation. He advises clients in corporate commercial litigation, including contractual disputes, shareholder disputes, class actions, commercial arbitrations, and directors’ and officers’ liability.</p><p>Duncan also has an active administrative and public law practice and acts for both governmental agencies and private interests. He has appeared before all levels of court in Ontario, as well as the Québec Court of Appeal and the Supreme Court of Canada.</p>

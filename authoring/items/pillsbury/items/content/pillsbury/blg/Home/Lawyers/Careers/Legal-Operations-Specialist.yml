    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Legal Operations Specialist (Business Professionals)</h2><p><em>Open role · Business professionals</em></p><p>Not every career at Pillsbury is a lawyer track. Legal Operations specialists help practices run efficiently—implementing tools, improving matter workflows, and partnering with attorneys on client delivery.</p><p><strong>What you’ll do:</strong></p><ul><li>Support practice operations and knowledge workflows</li><li>Coordinate technology rollouts and training</li><li>Partner with lawyers and firm leadership on continuous improvement</li></ul><p><strong>How to apply:</strong> Apply under Business Professionals on Careers, or ask Pulse about non-lawyer career paths at Pillsbury.</p>"

    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Lateral Partner — Intellectual Property</h2><p><em>Open role · Laterals</em></p><p>We welcome conversations with IP partners who bring patent litigation, trade secret, or counseling practices and want a collaborative platform. Our IP group works closely with corporate and technology clients nationwide.</p><p><strong>What we look for:</strong></p><ul><li>Portable book and proven courtroom or counseling excellence</li><li>Interest in teaming across offices and practices</li><li>Alignment with Pillsbury’s client service model</li></ul><p><strong>How to start:</strong> Contact lateral recruiting via Careers, or explore related bios (e.g. Mark Abate, Ranjini Acharya) to understand the practice.</p>"

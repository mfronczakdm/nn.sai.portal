      Hint: Detail
      Value: "<h2>Lateral Partner — Intellectual Property</h2><p><em>Open role · Laterals</em></p><p>We welcome conversations with IP partners who bring patent, trademark, or counseling practices and want a collaborative national platform. BLG’s IP group works closely with corporate and technology clients across Canada.</p><p><strong>What we look for:</strong></p><ul><li>Portable book and proven counseling or courtroom excellence</li><li>Interest in teaming across our five Canadian offices</li><li>Alignment with BLG’s client service model</li></ul><p><strong>How to start:</strong> Contact lateral recruiting via Careers.</p>"

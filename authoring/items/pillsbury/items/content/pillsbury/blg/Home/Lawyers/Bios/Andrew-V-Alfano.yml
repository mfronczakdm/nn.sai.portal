      Hint: Biography
      Value: <p>Line Abecassis practises in most areas of real property law and associated areas of general commercial law, including leasing, acquisition, divestiture and financing of real estate and development.</p><p>She is the Regional Manager for the Specialized Business Law Group in Montréal, which includes real estate, tax, financial services and intellectual property. She speaks French, English, Hebrew and Arabic fluently.</p><p>Line is recognized in The Best Lawyers in Canada (Real Estate Law), the Canadian Legal Lexpert Directory (Property Leasing), and The Legal 500 Canada as a Leading Lawyer in Real Estate.</p>

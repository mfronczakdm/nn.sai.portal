      Hint: Biography
      Value: "<p>Don J. Alberga focuses his practice on labour and employment. He is widely recognized for representing management in occupational health and safety matters and compensation-related issues for work accident victims.</p><p>He has over twenty years of experience acting as legal counsel and litigator for employers in the manufacturing, food, construction, pharmaceutical and retail sectors in Québec and Canada. He also represents multinational organizations and federally and provincially regulated employers.</p>"

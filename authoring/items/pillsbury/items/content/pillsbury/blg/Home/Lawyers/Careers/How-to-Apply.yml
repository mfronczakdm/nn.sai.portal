    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>How to apply</h2><p><em>Careers guide</em></p><p>Finding the right opening should be as easy as describing what you want. Use site search with questions like <em>“I’m looking for a career in corporate commercial”</em> or <em>“summer associate program”</em>—then open the role page and follow the apply steps.</p><ol><li><strong>Browse or ask:</strong> Careers hub or search</li><li><strong>Open the role:</strong> Confirm location (Calgary, Montréal, Ottawa, Toronto, Vancouver), practice, and track</li><li><strong>Submit:</strong> Resume, cover letter, and any school-specific materials</li><li><strong>Follow up:</strong> Recruiting will confirm receipt and next steps</li></ol>"

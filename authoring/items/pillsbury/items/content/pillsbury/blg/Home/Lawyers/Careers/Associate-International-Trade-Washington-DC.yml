    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Associate — International Trade (Washington, DC)</h2><p><em>Open role · Lawyers</em></p><p>We are seeking an associate to join Pillsbury’s International Trade practice in Washington, DC. You will work with partners and senior associates on export controls (EAR), economic sanctions (OFAC), customs, and related national-security regulatory matters for U.S. and global clients.</p><p><strong>What you’ll do:</strong></p><ul><li>Support licensing, diligence, and enforcement-facing matters</li><li>Draft client advisories and contribute to webinars and alerts</li><li>Collaborate with corporate counsel on cross-border expansion (including MENA / Saudi market-entry matters)</li></ul><p><strong>How to apply:</strong> Submit your resume and cover letter via Careers, or ask recruiting about the International Trade associate track in Washington, DC.</p><p><strong>Related people:</strong> Ata A. Akiner and the International Trade team.</p>"

    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Associate — Disputes (Ottawa)</h2><p><em>Open role · People</em></p><p>We are seeking an associate to join BLG’s Disputes practice in Ottawa. You will work with partners on commercial litigation, public law, and related regulatory matters for Canadian and international clients.</p><p><strong>What you’ll do:</strong></p><ul><li>Support pleadings, discoveries, and hearings</li><li>Draft client advisories and contribute to insights</li><li>Collaborate with corporate counsel on disputes arising from M&amp;A and regulated industries</li></ul><p><strong>How to apply:</strong> Submit your resume and cover letter via Careers, or ask recruiting about the Disputes associate track in Ottawa.</p>"

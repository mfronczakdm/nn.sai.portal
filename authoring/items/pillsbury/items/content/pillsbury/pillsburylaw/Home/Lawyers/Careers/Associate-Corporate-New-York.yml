    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Associate — Corporate (New York)</h2><p><em>Open role · Lawyers</em></p><p>Pillsbury’s New York Corporate practice is hiring an associate to support public and private M&A, capital markets, and governance matters. You will work on live deals with partners across our platform.</p><p><strong>What you’ll do:</strong></p><ul><li>Diligence, drafting, and closing support on domestic and cross-border deals</li><li>Coordinate with specialists in IP, trade, and employment as deals require</li><li>Client-facing writing and deal-team collaboration</li></ul><p><strong>How to apply:</strong> Apply through Careers or contact New York recruiting for the Corporate associate class.</p>"

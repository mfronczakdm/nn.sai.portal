    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Expanding into Saudi Arabia: Export Controls 101</h2><p><em>Webinar · International Trade &amp; Corporate</em></p><p>U.S. companies expanding into Saudi Arabia often discover export-control questions after commercial diligence is already underway. This webinar walks through how EAR and OFAC analysis should sit beside local corporate setup, who to involve early, and what questions boards ask before green-lighting KSA expansion.</p><p><strong>Featured speakers:</strong> Ata A. Akiner (International Trade, Washington, DC) and Khalid A. AlArfaj (Corporate, Riyadh).</p><p><strong>You will learn:</strong></p><ul><li>When Saudi expansion triggers U.S. export-control review</li><li>How to sequence trade counsel with MENA corporate counsel</li><li>A practical intake checklist for legal and business teams</li></ul>"

    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<p>PFAS Observer monitors the rapidly evolving law of per- and polyfluoroalkyl substances. Pillsbury environmental and litigation lawyers analyze federal and state regulation, EPA actions, cleanup standards, product liability and mass tort trends, and transactional diligence issues tied to PFAS risk.</p><p>The blog is a resource for companies, utilities, insurers, and investors who need a clear view of how PFAS liabilities and compliance obligations are changing.</p>"

    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>How to apply</h2><p><em>Careers guide</em></p><p>Finding the right opening should be as easy as describing what you want. Use site search or Pulse with questions like <em>“I’m looking for a career in international trade”</em> or <em>“summer associate program”</em>—then open the role page and follow the apply steps.</p><ol><li><strong>Browse or ask:</strong> Careers hub, search, or Pulse</li><li><strong>Open the role:</strong> Confirm location, practice, and track (associate / summer / lateral / business professional)</li><li><strong>Submit:</strong> Resume, cover letter, and any school-specific materials</li><li><strong>Follow up:</strong> Recruiting will confirm receipt and next steps</li></ol><p>For International Trade associate interest in Washington, DC, start with the Associate — International Trade posting and related practice bios.</p>"

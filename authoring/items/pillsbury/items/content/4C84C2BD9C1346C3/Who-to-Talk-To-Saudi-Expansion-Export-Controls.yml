    - ID: "d2ff0fcf-f6f9-48c6-9efb-db569452b8dc"
      Hint: Detail
      Value: "<h2>Who Should We Talk To? Saudi Expansion with Export-Control Questions</h2><p><em>Article · Client guide</em></p><p>When visitors ask: &ldquo;We&rsquo;re expanding into Saudi Arabia and have export-control questions—who should we talk to?&rdquo; the answer is usually a two-lawyer team plus curated learning assets.</p><ol><li><strong>Ata A. Akiner</strong> — International Trade, Washington, DC (export controls / sanctions)</li><li><strong>Khalid A. AlArfaj</strong> — Corporate, Riyadh (local commercial and entity setup)</li><li><strong>Optional:</strong> Osama Abu-Dehays in Doha for broader MENA corporate coverage</li></ol><p>Then deepen context with the Export Controls 101 webinar, Trade Talks podcast, Gulf Expansion alert, and KSA entry checklist.</p>"

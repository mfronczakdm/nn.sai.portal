    - ID: "2485de13-6c39-468c-9c26-fe08c27088f4"
      Hint: pageSummary
      Value: |
        Si has conducido por un pequeño pueblo últimamente y has notado equipos trabajando al costado de la carretera, tirando cable, perforando bajo las calles o escalando líneas aéreas, estás viendo cómo se construye en tiempo real la columna vertebral de la América moderna. ¿Y los ingenieros que dirigen ese trabajo? No están sentados en oficinas. Están en el campo, resolviendo problemas importantes, en los lugares que más lo necesitan.
        En Dycom, acabamos de asegurar dos de los contratos de infraestructura más grandes en la historia de nuestra empresa: un importante despliegue de fibra BEAD en el sureste y una construcción de infraestructura de centro de datos en el Atlántico medio. Eso significa que necesitamos ingenieros que quieran estar donde está la acción. No algún día. Ahora.
        
        ¿Qué Hace Realmente un Ingeniero de Campo en Dycom?
        Los ingenieros de campo en Dycom son el tejido conectivo entre un plan de proyecto y una red terminada. En cualquier día, eso podría significar:
        
        Inspeccionar y marcar nuevas rutas de fibra a través de comunidades rurales que nunca han tenido banda ancha
        Coordinar equipos de perforación subterránea y garantizar que las rutas de perforación despejen las utilidades existentes de manera segura
        Solucionar problemas en puntos de empalme aéreo en una red activa
        Trabajar directamente con inspectores municipales y propietarios de terrenos para mantener los proyectos en horario
        Leer y corregir planos de construcción en condiciones reales de campo
        
        Es técnico. Es físico. Nunca es el mismo día dos veces. Y el trabajo que haces es permanente: la fibra que despliegas servirá a esa comunidad durante los próximos 30 años.
        
        El Momento en el que Estamos es Sin Precedentes
        El programa federal BEAD está destinando $29.5 mil millones a infraestructura de banda ancha en todo el país. Los hiperescaladores están construyendo centros de datos más rápido de lo que la industria ha visto jamás. La densificación de 5G sigue acelerándose. Todo esto requiere fibra. Toda esa fibra requiere ingenieros que sepan cómo construirla.
        Esto no es un impulso de contratación temporal. Este es un ciclo de construcción de una década que apenas está comenzando, y Dycom está posicionado en el centro de ello. Los ingenieros que contratemos hoy crecerán con la mayor inversión en infraestructura en la historia de Estados Unidos.
        
        Lo que Buscamos
        Estamos contratando ingenieros de campo en el sureste y el Atlántico medio ahora mismo para roles que van desde soporte de ingeniería de construcción de nivel inicial hasta líderes de proyecto experimentados. Esto es lo que más nos importa:
        Te sientes cómodo en el campo. Este no es un rol remoto ni híbrido. Estarás afuera, en los sitios de trabajo, trabajando junto a los equipos. Ese es el trabajo, y para la persona adecuada, es la mejor parte.
        Puedes resolver problemas en tiempo real. Los planes cambian. El clima sucede. Las utilidades no siempre están donde los planos dicen que están. Necesitamos ingenieros que se adapten, se comuniquen y mantengan los proyectos en movimiento.
        Quieres construir una carrera, no solo ocupar un puesto. Dycom promueve desde dentro. Los ingenieros de campo que contratemos hoy serán los gerentes de proyecto, directores de operaciones y líderes regionales del mañana. Tenemos la infraestructura de capacitación, incluido nuestro nuevo campus de capacitación inmersiva de 49 acres en Georgia, para respaldar eso.
        La experiencia en telecomunicaciones, servicios públicos o construcción civil es una ventaja. Pero hemos construido carreras desde cero antes y lo haremos nuevamente. Si tienes la motivación, nosotros tenemos el camino.
        
        Lo que Obtendrás
        
        Pago competitivo semanal con oportunidad de horas extras en despliegues activos
        Beneficios completos desde el primer día: médico, dental, visión, seguro de vida y 401(k) con aportación de la empresa
        Reembolso educativo para ingenieros que busquen credenciales o títulos avanzados
        Una presencia nacional: con más de 500 oficinas de campo y 39 subsidiarias operativas, la oportunidad te sigue donde sea que tu carrera te lleve
        Estabilidad: Dycom tiene una cartera de pedidos de $9.5 mil millones. Estos no son proyectos a corto plazo. Este es trabajo a largo plazo, crítico para la misión, con una empresa que no va a ninguna parte.
        
        
        ¿Ya estás en Dycom? Esto También es para Ti.
        Si actualmente estás en un rol de soporte de campo, localización o construcción en cualquiera de nuestras subsidiarias y has estado pensando en cuál es el siguiente paso, estos contratos son tu oportunidad. Habla con tu supervisor sobre nuestras vías de avance interno, o visita nuestro portal de desarrollo profesional para ver qué roles de ingeniería están disponibles dentro de tu región. Construimos el campus de capacitación para exactamente este momento.
        
        La Conclusión
        El país necesita que se construya esta infraestructura. Las comunidades a las que servimos cuentan con ello. Los ingenieros que la construyan mirarán atrás en esta década como el momento en que hicieron algo que realmente importó.
        Si eso suena como la carrera que has estado buscando, o el siguiente paso que has estado esperando, queremos saber de ti.
        

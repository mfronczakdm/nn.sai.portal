    - ID: "2485de13-6c39-468c-9c26-fe08c27088f4"
      Hint: pageSummary
      Value: |
        If you've driven through a small town lately and noticed crews working roadside, pulling cable, boring under streets, or climbing aerial lines — that's the backbone of modern America being built in real time. And the engineers directing that work? They're not sitting in offices. They're in the field, solving problems that matter, in places that need it most.
        At Dycom, we just secured two of the largest infrastructure contracts in our company's history — a major BEAD fiber deployment across the Southeast and a data center infrastructure build across the Mid-Atlantic. That means we need engineers who want to be where the action is. Not someday. Now.
        
        What Does a Dycom Field Engineer Actually Do?
        Field engineers at Dycom are the connective tissue between a project plan and a finished network. On any given day that might mean:
        
        Surveying and staking new fiber routes through rural communities that have never had broadband
        Coordinating underground boring crews and ensuring bore paths clear existing utilities safely
        Troubleshooting aerial splice points on a live network
        Working directly with municipal inspectors and landowners to keep projects on schedule
        Reading and redlining construction drawings in real field conditions
        
        It's technical. It's physical. It's never the same day twice. And the work you do is permanent — the fiber you deploy will serve that community for the next 30 years.
        
        The Moment We're In Is Unprecedented
        The federal BEAD program is pushing $29.5 billion into broadband infrastructure across the country. Hyperscalers are building data centers faster than the industry has ever seen. 5G densification is still accelerating. All of it requires fiber. All of that fiber requires engineers who know how to build it.
        This isn't a temporary hiring push. This is a decade-long build cycle that is just getting started — and Dycom is positioned at the center of it. The engineers we bring on today will grow with the largest infrastructure investment in American history.
        
        What We're Looking For
        We're hiring field engineers across the Southeast and Mid-Atlantic right now for roles that range from entry-level construction engineering support to experienced project leads. Here's what matters most to us:
        You're comfortable in the field. This isn't a remote or hybrid role. You'll be outside, on job sites, working alongside crews. That's the job, and for the right person, it's the best part.
        You can solve problems in real time. Plans change. Weather happens. Utilities aren't always where the drawings say they are. We need engineers who adapt, communicate, and keep projects moving.
        You want to build a career, not just fill a role. Dycom promotes from within. The field engineers we hire today are the project managers, operations directors, and regional leaders of tomorrow. We have the training infrastructure — including our new 49-acre immersive training campus in Georgia — to back that up.
        Experience in telecom, utilities, or civil construction is a plus. But we've built careers from scratch before and we'll do it again. If you have the drive, we have the path.
        
        What You'll Get
        
        Competitive weekly pay with overtime opportunity on active deployments
        Full benefits from day one — medical, dental, vision, life insurance, and 401(k) with company match
        Education reimbursement for engineers pursuing advanced credentials or degrees
        A national footprint — with 500+ field offices and 39 operating subsidiaries, opportunity follows you wherever your career takes you
        Stability — Dycom has a $9.5 billion backlog. These aren't short-term projects. This is long-term, mission-critical work with a company that isn't going anywhere.
        
        
        Already at Dycom? This Is for You Too.
        If you're currently in a field support, locating, or construction role at any of our subsidiaries and you've been thinking about what's next — these contracts are your opening. Talk to your supervisor about our internal advancement pathways, or visit our career development portal to see what engineering roles are available within your region. We built the training campus for exactly this moment.
        
        The Bottom Line
        The country needs this infrastructure built. The communities we serve are counting on it. The engineers who build it will look back on this decade as the moment they did something that actually mattered.
        If that sounds like the career you've been looking for — or the next step you've been waiting for — we want to hear from you.
        

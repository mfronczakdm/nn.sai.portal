        <div class="ck-content"><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">How GPT Is Commonly Applied in Practice</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Across the industry, laboratories design GPT programs to confirm that media performs as intended under routine testing conditions. While procedures vary, effective GPT programs tend to share common characteristics:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Practical and repeatable execution</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Alignment with routine laboratory workflows</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Emphasis on consistency and comparability over time</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">GPT is intended to demonstrate suitability for use, not exact numerical precision. Because GPT involves living organisms, some variability is expected. The goal is not to make every result look identical, but to show that media consistently supports acceptable growth when tested under defined conditions. For that reason, GPT programs are strongest when they are repeatable, clearly documented, and evaluated in context over time.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">USP Framework for Growth Promotion Testing</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Several key pharmacopeias provide GPT guidelines. The relevant USP chapters are harmonized with the JP and EP. The harmonized framework includes:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Media</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Incubation conditions</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Testing period</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Acceptance criteria</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">These GPT guidelines allow laboratories flexibility of implementation within their quality systems.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Solid and Liquid Media: Acceptance in Context</h2><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Solid Media</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">USP &lt;61&gt;, acceptance criteria for GPT for Microbial Enumeration Tests, states that “growth obtained on solid media must not differ by a factor greater than two from the calculated value for a standardized inoculum.” As of the publishing date for this blog, the USP does not contain a definition of a “Standardized Inoculum.” Although one does not exist in the USP, Dr. Radhakrishna Tirumalai defines a “Standardized Inoculum” in the PDA Publication <em style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><i><em>Industrial Pharmaceutical Microbiology Quality Control</em></i></em> as one that is “prepared using the Standard culture collection microorganisms as indicated in the chapter and should meet the “five passage rule” and have an accurately determined microbial count commercially available, or one that has been standardized in-house to provide and accurate number of CFUs.”</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">There are many ways to complete the factor of two comparison; however, the most scientifically sound way is to compare the new batch of media to a previously approved batch. For GPT of media used in USP &lt;62&gt;, Tests for Specified Organisms, it is recommended to also run a control with ≤100 CFU on non-selective agar to support interpretability.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><strong style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;">In practice</strong>, many laboratories focus on overall comparability and performance trends across batches, recognizing that small numerical differences are expected in biological systems.</p><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Liquid Media</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Liquid media are considered suitable when clearly visible growth occurs that is comparable to previously approved media. Parallel testing and use of non-selective agar provides proof the liquid media was inoculated with a viable culture of NMT 100 CFU.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Internal Verification and Audit Confidence</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Internal verification of media and controls plays an important role in supporting confident audit discussions by helping laboratories demonstrate suitability for routine use. In addition to supplier documentation, laboratories should evaluate performance under their own test conditions, including organism recovery, growth promotion, and method-specific performance characteristics. USP &lt;1117&gt; emphasizes the importance of verifying that media and controls are appropriate for their intended use and maintaining records that demonstrate consistent performance over time.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Trending historical recovery data can provide useful context during investigations and inspections, particularly because microbiological recovery inherently exhibits biological variability. Published microbiological studies, including work by Tidswell et al., support the use of trend-based interpretation rather than overreliance on isolated recovery results.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">To meet the USP &lt;1117&gt; requirements for incoming inspection of media and controls, a laboratory must:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Verify control performance such as identity and manufacture warranty</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Confirm performance within their own methods and environment</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Maintain historical recovery data to demonstrate consistent performance over time</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">During inspections, this approach allows laboratories to clearly explain <strong style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;">why</strong> a control or medium is considered suitable based on observed performance, rather than relying solely on documentation or labels.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Frequently cited microbiological literature, including work by Tidswell et al., supports evaluating microbial recovery under routine laboratory conditions, reinforcing the importance of interpreting recovery data in context, recognizing inherent biological variability and the value of trend-based interpretation. For GPT programs, this means laboratories must confirm that media consistently supports acceptable growth under the laboratory’s defined test condition, while recognizing expected biological variability.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Why This Approach Holds Up in an Audit</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Auditors generally look for:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Clear rationale for testing practices</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Consistent execution over time</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Evidence that materials are fit for their intended use</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">When internal verification and trending are part of routine GPT practices, laboratories are well positioned to demonstrate control over their processes without the need for reactive justifications during inspection.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Key Takeaways</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Growth Promotion Testing helps confirm that microbiological media are suitable for their intended use. GPT programs that work well in practice typically:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Align with routine laboratory workflows</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Emphasize comparability and consistency over time</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Use internal verification to support confident audit discussions</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">When GPT practices are clearly defined and consistently applied, they support both reliable testing and smooth inspections.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Microorganism controls for GPT</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Looking for GPT control strains? Microbiologics brings confidence without complexity to your GPT program. For over 40 common reference strains, EZ-Accu Shot simplifies GPT with refrigerator storage and a quick dissolve format that delivers 10 to 100 CFU per inoculum. When you pair EZ-Accu Shot with our custom environmental isolate controls, your laboratory has a comprehensive and consistent GPT program. Find your GPT strains at <a style="background-color:transparent;border-width:0px;box-sizing:border-box;color:rgb(39, 54, 146) !important;font-size:14px;margin:0px;outline:0px;padding:0px;text-decoration:none;text-size-adjust:100%;vertical-align:baseline;" href="https://www.microbiologics.com/item-type/Product/testmethod/Growth-Promotion-Testing?order=storedisplayname:asc">Microbiologics.com</a>.</p><h4 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:18px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Sources</h4><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Tirumalai, Radhakrishna, PhD and Edward Tisdel, PhD. (2024) <em style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><i><em>Industrial Pharmaceutical Microbiology Quality Control</em></i></em>. PDA.</p></div>

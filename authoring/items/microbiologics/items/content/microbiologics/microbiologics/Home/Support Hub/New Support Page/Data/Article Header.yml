    - ID: "a61ff6e0-3066-43f5-88fd-0dc5f08bb2d8"
      Hint: summary
      Value: |
        Growth Promotion Testing (GPT) is a routine and essential part of microbiological quality control for sterile and non-sterile pharmaceutical laboratories. When media qualification practices are aligned with day-to-day testing practices, they support consistent performance, clear scientific rationale, and confident audit discussions.
        
        This overview highlights commonly applied GPT practices grounded in USP guidance and established microbiological principles, with practical context to help laboratories qualify media in a way that is both effective in routine use and easy to defend during inspection.

    - ID: "8b57dadd-0825-4f5d-9c32-187c0af7e1fd"
      Hint: text
      Value: |
        <div class="ck-content"><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">How GPT Is Commonly Applied in Practice</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Across the industry, laboratories design GPT programs to confirm that media performs as intended under routine testing conditions. While procedures vary, effective GPT programs tend to share common characteristics:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Practical and repeatable execution</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Alignment with routine laboratory workflows</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Emphasis on consistency and comparability over time</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">GPT is intended to demonstrate suitability for use, not exact numerical precision. Because GPT involves living organisms, some variability is expected. The goal is not to make every result look identical, but to show that media consistently supports acceptable growth when tested under defined conditions. For that reason, GPT programs are strongest when they are repeatable, clearly documented, and evaluated in context over time.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">USP Framework for Growth Promotion Testing</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Several key pharmacopeias provide GPT guidelines. The relevant USP chapters are harmonized with the JP and EP. The harmonized framework includes:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Media</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Incubation conditions</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Testing period</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Acceptance criteria</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">These GPT guidelines allow laboratories flexibility of implementation within their quality systems.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Solid and Liquid Media: Acceptance in Context</h2><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Solid Media</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">USP &lt;61&gt;, acceptance criteria for GPT for Microbial Enumeration Tests, states that “growth obtained on solid media must not differ by a factor greater than two from the calculated value for a standardized inoculum.” As of the publishing date for this blog, the USP does not contain a definition of a “Standardized Inoculum.” Although one does not exist in the USP, Dr. Radhakrishna Tirumalai defines a “Standardized Inoculum” in the PDA Publication <em style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><i><em>Industrial Pharmaceutical Microbiology Quality Control</em></i></em> as one that is “prepared using the Standard culture collection microorganisms as indicated in the chapter and should meet the “five passage rule” and have an accurately determined microbial count commercially available, or one that has been standardized in-house to provide and accurate number of CFUs.”</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">There are many ways to complete the factor of two comparison; however, the most scientifically sound way is to compare the new batch of media to a previously approved batch. For GPT of media used in USP &lt;62&gt;, Tests for Specified Organisms, it is recommended to also run a control with ≤100 CFU on non-selective agar to support interpretability.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><strong style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;">In practice</strong>, many laboratories focus on overall comparability and performance trends across batches, recognizing that small numerical differences are expected in biological systems.</p><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Liquid Media</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Liquid media are considered suitable when clearly visible growth occurs that is comparable to previously approved media. Parallel testing and use of non-selective agar provides proof the liquid media was inoculated with a viable culture of NMT 100 CFU.</p></div>

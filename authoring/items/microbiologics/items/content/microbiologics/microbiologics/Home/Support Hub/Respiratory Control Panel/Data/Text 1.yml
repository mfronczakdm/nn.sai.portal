      Value: |
        <div class="ck-content"><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Wie GPT Häufig in der Praxis Eingesetzt Wird</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">In der gesamten Branche entwickeln Labore GPT-Programme, um zu bestätigen, dass Medien unter routinemäßigen Testbedingungen wie vorgesehen funktionieren. Obwohl die Verfahren variieren, weisen effektive GPT-Programme häufig gemeinsame Merkmale auf:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Praktische und wiederholbare Durchführung</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Anpassung an routinemäßige Laborabläufe</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Betonung von Konsistenz und Vergleichbarkeit über die Zeit</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">GPT soll die Eignung für den Einsatz demonstrieren, nicht die exakte numerische Präzision. Da GPT lebende Organismen umfasst, ist eine gewisse Variabilität zu erwarten. Ziel ist es nicht, jedes Ergebnis identisch aussehen zu lassen, sondern zu zeigen, dass Medien unter definierten Bedingungen konsistent akzeptables Wachstum unterstützen. Aus diesem Grund sind GPT-Programme am stärksten, wenn sie wiederholbar, klar dokumentiert und im Kontext über die Zeit bewertet werden.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">USP-Rahmen für Wachstumstestförderung</h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Mehrere wichtige Arzneibücher bieten GPT-Richtlinien. Die relevanten USP-Kapitel sind mit dem JP und EP harmonisiert. Der harmonisierte Rahmen umfasst:</p><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:26px;list-style:disc;margin-bottom:0px;margin-right:0px;margin-top:0px;orphans:2;outline:0px;padding:0px 0px 23px 1em;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Medien</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Inkubationsbedingungen</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Testzeitraum</p></li><li style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin-bottom:0px;margin-right:0px;margin-top:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><p style="margin-left:1.5em;">Akzeptanzkriterien</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Diese GPT-Richtlinien ermöglichen Laboren Flexibilität bei der Implementierung innerhalb ihrer Qualitätssysteme.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Fest- und Flüssigmedien: Akzeptanz im Kontext</h2><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Festmedien</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">USP &lt;61&gt;, Akzeptanzkriterien für GPT für Tests zur mikrobiellen Zählung, besagt, dass „das Wachstum auf Festmedien nicht um mehr als den Faktor zwei von dem berechneten Wert für ein standardisiertes Inokulum abweichen darf.“ Zum Veröffentlichungsdatum dieses Blogs enthält die USP keine Definition eines „Standardisierten Inokulums“. Obwohl eine solche in der USP nicht existiert, definiert Dr. Radhakrishna Tirumalai ein „Standardisiertes Inokulum“ in der PDA-Publikation <em style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;"><i><em>Industrial Pharmaceutical Microbiology Quality Control</em></i></em> als eines, das „unter Verwendung der Standardkultur-Sammlungsmikroorganismen gemäß dem Kapitel hergestellt wird und die „Fünf-Passage-Regel“ erfüllen sollte und eine genau bestimmte mikrobielle Anzahl kommerziell verfügbar ist oder eines, das intern standardisiert wurde, um eine genaue Anzahl von KBE bereitzustellen.“</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Es gibt viele Möglichkeiten, den Vergleich des Faktors zwei durchzuführen; die wissenschaftlich fundierteste Methode ist jedoch der Vergleich der neuen Mediencharge mit einer zuvor genehmigten Charge. Für GPT von Medien, die in USP &lt;62&gt;, Tests für spezifizierte Organismen, verwendet werden, wird empfohlen, auch eine Kontrolle mit ≤100 KBE auf nicht-selektiven Agar durchzuführen, um die Interpretierbarkeit zu unterstützen.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;"><strong style="background-color:transparent;border-width:0px;box-sizing:border-box;font-size:14px;margin:0px;outline:0px;padding:0px;text-size-adjust:100%;vertical-align:baseline;">In der Praxis</strong> konzentrieren sich viele Labore auf die allgemeine Vergleichbarkeit und Leistungstrends über Chargen hinweg, wobei anerkannt wird, dass kleine numerische Unterschiede in biologischen Systemen zu erwarten sind.</p><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(51, 51, 51);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:22px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.3em;margin:0px;orphans:2;outline:0px;padding:0px 0px 10px;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Flüssigmedien</h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);border-width:0px;box-sizing:border-box;color:rgb(102, 102, 102);font-family:&quot;Open Sans&quot;, Arial, sans-serif;font-size:14px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;margin:0px;orphans:2;outline:0px;padding:0px 0px 1em;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-size-adjust:100%;text-transform:none;vertical-align:baseline;white-space:normal;widows:2;word-spacing:0px;">Flüssigmedien gelten als geeignet, wenn ein klar sichtbares Wachstum auftritt, das mit zuvor genehmigten Medien vergleichbar ist. Parallele Tests und die Verwendung von nicht-selektivem Agar liefern den Nachweis, dass das Flüssigmedium mit einer lebensfähigen Kultur von NMT 100 KBE inokuliert wurde.</p></div>
